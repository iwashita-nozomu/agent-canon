[[evals]]
id = "tool-finding-report-skill"
target = ".agents/skills/tool-finding-report/SKILL.md"
canonical_target = "agents/skills/tool-finding-report.md"
kind = "skill"
description = "Tool finding reports must preserve raw and structured artifacts, route narrative reports separately, and feed prompt repair decisions into implementation loops."

[[evals.checklist]]
id = "TOOL-FINDING-1"
critical = true
description = "Requires raw result preservation, structured artifacts, and before/after impact when available."
required_regex = ["raw", "structured", "impact", "python-structure-hash-report", "python-structure-hash-impact"]

[[evals.checklist]]
id = "TOOL-FINDING-2"
critical = true
description = "Separates writeout, reader report, and refactor implementation responsibilities."
required_regex = ["\\$result-artifact-writeout", "\\$report-writing", "\\$refactor-loop"]

[[evals.checklist]]
id = "TOOL-FINDING-3"
critical = true
description = "Requires prompt feedback classification and prompt repair before the next write-capable subagent."
required_regex = ["handoff_prompt_gap", "shared_skill_or_workflow_gap", "workflow_monitor\\.py --runtime-feedback", "prompt_repair", "next write-capable subagent"]

[[evals.checklist]]
id = "TOOL-FINDING-4"
critical = true
description = "Routes Python structural finding packets through scope planning before implementation."
required_regex = ["python-structure-hash-scope-plan", "impact_blocks", "scope_candidates", "selected_scope", "repair_batches"]

[[evals.checklist]]
id = "TOOL-FINDING-5"
critical = true
description = "Defaults tool finding runs to full repository scope and records any bounded-scope exception."
required_regex = ["full repository", "scope_exception", "requested_scope", "omitted_surfaces"]

[[evals]]
id = "md-style-check-unified-rust-docs"
target = ".agents/skills/md-style-check/SKILL.md"
canonical_target = "agents/skills/md-style-check.md"
kind = "skill"
description = "Markdown style skill shim must route formatter-adjacent work through the unified Rust docs tool."

[[evals.checklist]]
id = "MD-STYLE-RUST-1"
critical = true
description = "Uses agent-canon docs as the canonical check and formatter entrypoint."
required_regex = ["tools/bin/agent-canon docs -h", "tools/bin/agent-canon docs check", "tools/bin/agent-canon docs format", "Rust", "DOCS_CHECK_REPORT_BEGIN"]

[[evals.checklist]]
id = "MD-STYLE-RUST-2"
critical = true
description = "Requires adjacent checks after formatter or fixer execution."
required_regex = ["After any docs formatter or fixer runs", "adjacent check", "fix-math", "fix-mermaid"]

[[evals.checklist]]
id = "MD-STYLE-MATH-FENCE-1"
critical = true
description = "Runtime md-style-check skill must forbid text/plaintext/txt/plain/math/latex/tex fenced blocks and require standalone double-dollar guidance."
required_regex = [
  "\\btext\\b",
  "\\bplaintext\\b",
  "\\btxt\\b",
  "\\bplain\\b",
  "\\bmath\\b",
  "\\blatex\\b",
  "\\btex\\b",
  "fenced block",
  "must not be placed",
  "standalone double-dollar",
  "case-insensitively",
]

[[evals.checklist]]
id = "MD-STYLE-STRUCTURE-GATE-1"
critical = true
description = "Routes substantive Markdown document edits through prose graph and structure planning, with format-only skip evidence."
required_regex = ["\\$prose-reasoning-graph", "\\$structure-planning", "section order", "reader path", "format-only", "structure_contract=skipped"]

[[evals]]
id = "subagent-bootstrap-tool-first-gate"
target = ".agents/skills/subagent-bootstrap/SKILL.md"
canonical_target = "agents/skills/subagent-bootstrap.md"
kind = "skill"
description = "Subagent bootstrap must not spend subagent tokens on deterministic checks already owned by tools."

[[evals.checklist]]
id = "SUBAGENT-TOOL-FIRST-1"
critical = true
description = "Requires canonical checker/router/dashboard before read-only exploration."
required_regex = ["Before assigning read-only exploration", "canonical checker", "structured tool artifacts", "not to repeat deterministic tool checks"]

[[evals.checklist]]
id = "SUBAGENT-FRESH-CAPSULE-1"
critical = true
description = "Requires compatible-context reuse and limits fresh launches to independent or incompatible responsibility."
required_regex = [
  "Compatible active agents may\\s+be reused for revised scope",
  "Reuse an active agent when owner, responsibility, context, write authority,\\s+and validation route remain compatible",
  "independent\\s+review, disjoint authority, incompatible\\s+owner/context",
  "New turns or\\s+renamed packets alone do not require fresh launch",
  "Fresh Subagent Context Capsule",
  "Context Visibility Contract",
  "protocol-owned",
]

[[evals]]
id = "md-style-check-human-doc-unified-rust-docs"
