# @dependency-start
# contract data
# responsibility Defines deterministic evals for skill and workflow prompt drift.
# upstream design README.md prompt eval directory contract
# upstream design ../../agents/skills/md-style-check.md Markdown style skill human document contract
# upstream design ../../.agents/skills/md-style-check/SKILL.md md-style-check skill shim contract
# upstream design ../../agents/skills/adaptive-improvement-loop.md adaptive improvement skill contract
# upstream design ../../agents/skills/academic-writing.md Academic Writing TeX routing contract
# upstream design ../../agents/skills/structure-planning.md reusable structure planning skill contract
# upstream design ../../agents/skills/html-output.md explicit HTML output and browser publication skill contract
# upstream design ../../agents/skills/experiment-lifecycle.md experiment run identity and publication decision contract
# upstream design ../../agents/skills/result-artifact-writeout.md concrete artifact persistence contract
# upstream design ../../agents/internal-routines/README.md internal routine document owner surface
# downstream implementation ../../tools/agent_tools/evaluate_skill_workflow_prompts.py runs these evals
# @dependency-end

version = 1

[[evals]]
id = "all-discoverable-skill-shims"
target_glob = ".agents/skills/*/SKILL.md"
kind = "skill"
description = "Every discoverable Codex skill shim must be loadable and dependency-linked."

[[evals.checklist]]
id = "SKILL-SHIM-GENERIC-1"
critical = true
description = "Starts with YAML frontmatter and includes required name/description fields."
required_regex = ["\\A---\\n", "\\nname:\\s*_?[a-z0-9]+(?:-[a-z0-9]+)*", "\\ndescription:\\s*\\S"]

[[evals.checklist]]
id = "SKILL-SHIM-GENERIC-2"
critical = true
description = "Includes dependency manifest markers near the top of the file."
required_regex = ["@dependency-start", "@dependency-end"]

[[evals.checklist]]
id = "SKILL-SHIM-GENERIC-3"
critical = true
description = "Provides an executable numbered instruction list."
required_regex = ["(?m)^1\\.\\s+"]

[[evals]]
id = "all-human-skill-docs"
target_glob = "agents/skills/*.md"
kind = "skill"
description = "Every human-facing skill document must be dependency-linked and reader-addressable."

[[evals.checklist]]
id = "SKILL-DOC-GENERIC-1"
critical = true
description = "Includes dependency manifest markers."
required_regex = ["@dependency-start", "@dependency-end"]

[[evals.checklist]]
id = "SKILL-DOC-GENERIC-2"
critical = true
description = "Includes a top-level Markdown title."
required_regex = ["(?m)^#\\s+"]

[[evals]]
id = "oop-type-design-runtime-contract"
target = ".agents/skills/oop-type-design/SKILL.md"
canonical_target = "agents/skills/oop-type-design.md"
kind = "skill"
description = "The runtime shim exposes the pre-implementation OOP/type-design contract and forbids post-hoc/static duplication."

[[evals.checklist]]
id = "OOP-TYPE-RUNTIME-1"
critical = true
required_regex = ["oop-type-design", "@dependency-start", "@dependency-end", "^1\\."]

[[evals.checklist]]
id = "OOP-TYPE-RUNTIME-2"
critical = true
required_regex = ["Protocol|interface", "value object", "aggregate", "constructor", "state transition", "composition", "dependency direction", "responsibility", "semantic responsibility contract|semantic grouping"]

[[evals.checklist]]
id = "OOP-TYPE-RUNTIME-3"
critical = true
required_regex = ["statically decidable|static type|static checker", "runtime guard|runtime validation", "test-first|test first", "oop-readability-check", "python-review", "cpp-review"]
forbidden_regex = ["keyword routing|keyword trigger"]

[[evals]]
id = "oop-type-design-human-contract"
target = "agents/skills/oop-type-design.md"
kind = "skill"
description = "The human-facing skill doc fixes the packet order, boundary matrix, and delegated validation owners."

[[evals.checklist]]
id = "OOP-TYPE-HUMAN-1"
critical = true
required_regex = ["Abstract Design Frame|Responsibility model", "Implementation Source Packet", "Design Side-Effect Map", "Design-To-Implementation Trace"]

[[evals.checklist]]
id = "OOP-TYPE-HUMAN-2"
critical = true
required_regex = ["API", "serialization", "external input", "constructor invariant", "legal state transition", "Protocol|interface", "invariant", "change reason", "external effect", "substitutability", "dependency direction", "atomic_transition|transaction|consistency|lifecycle", "semantic grouping", "one or more obligations"]

[[evals.checklist]]
id = "OOP-TYPE-HUMAN-3"
critical = true
required_regex = ["check_static_any.py", "pyright", "ruff", "oop-readability-check", "gpt-5.4-mini", "T14", "primary verification owner|obligations", "hard-edge", "test_designer", "composition root"]
forbidden_regex = ["keyword routing", "keyword trigger", "coordination[_ ]cost", "connected-components", "line/function count|function count", "exhaustive partition|partition threshold|cohesion threshold", "compatibility-preservation drift|compatibility (path|route)"]

