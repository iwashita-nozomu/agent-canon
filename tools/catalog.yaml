# @dependency-start
# contract registry
# responsibility Defines the structured AgentCanon tool catalog.
# upstream design README.md shared tool family ownership
# upstream design ../documents/tools/repo-local-tool-imports.md legacy import disposition ledger
# upstream design ../documents/tools/visualization_contract.md canonical visualization coverage and readback tool contract
# downstream implementation runtime/manifest/tool_catalog.py validates this catalog
# downstream implementation validation/semantic/tools/tool_drift.py checks catalog drift contracts
# downstream implementation validation/semantic/documents/check_design_doc_claims.py validates design-document evidence claims
# downstream design ../documents/tools/tool-docs.toml maps same-named tool docs
# downstream implementation ../tests/agent_tools/test_tool_catalog.py validates canonical visualization tool registration
# @dependency-end

version: 1
catalog_kind: agent_canon_tool_catalog
scope: shared_canon

# The legacy catalog shape remains version 1 for the existing catalog checker.
# Runtime dispatch is an additive, independently versioned contract.  Entries
# may provide a ``dispatch`` mapping; entries without one use these typed
# defaults. The versioned parity fixture is still required before execution.
runtime_schema:
  version: 2
  # A catalog entry is not cut over merely because it is listed.  Every
  # verified entry must carry an explicit dispatch.parity value and an
  # observed v2 fixture row; otherwise the legacy owner remains authoritative.
  default_parity: legacy
  runtimes:
    - python
    - rust
  execution_planes:
    - tool-container
  cwd_policies:
    - source-root
    - target-root
    - task-root
    - explicit
  env_policies:
    - allowlisted
    - clean
  io_policies:
    - inherited
    - captured
  exit_policies:
    - propagate
    - normalize-signal
  side_effect_policies:
    - read-only
    - external-artifact
    - explicit-target-write
  output_roots:
    - none
    - external-runtime
    - explicit-target
  parity_fixture: tools/fixtures/tool_dispatch/public-command-parity.json
  # Commands exposed by tools/runtime/dispatch/agent-canon/src/main.rs that do not have a
  # one-file catalog entry below. Keeping this inventory here prevents the
  # dispatcher from silently dropping a first-class Rust route.
  rust_public_commands:
    - id: rust-version
      selector: --version
      path: tools/runtime/dispatch/agent-canon/src/main.rs
    - id: rust-rust-migration-audit
      selector: rust-migration-audit
      path: tools/runtime/dispatch/agent-canon/src/migration_audit.rs
    - id: rust-rust-migration-plan
      selector: rust-migration-plan
      path: tools/runtime/dispatch/agent-canon/src/rust_migration_plan.rs
    - id: rust-docs
      selector: docs
      path: tools/runtime/dispatch/agent-canon/src/docs.rs
      writes: true
    - id: rust-structured-analysis
      selector: structured-analysis
      path: tools/runtime/dispatch/agent-canon/src/structured_analysis.rs
      writes: true
    - id: rust-python-structure-hash
      selector: python-structure-hash
      path: tools/runtime/dispatch/agent-canon/src/python_structure_hash.rs
    - id: rust-python-structure-hash-report
      selector: python-structure-hash-report
      path: tools/runtime/dispatch/agent-canon/src/python_structure_hash_report.rs
      writes: true
    - id: rust-python-structure-hash-impact
      selector: python-structure-hash-impact
      path: tools/runtime/dispatch/agent-canon/src/python_structure_hash_impact.rs
      writes: true
    - id: rust-python-structure-hash-scope-plan
      selector: python-structure-hash-scope-plan
      path: tools/runtime/dispatch/agent-canon/src/python_structure_hash_scope_plan.rs
      writes: true
    - id: rust-python-module-groups-check
      selector: python-module-groups-check
      path: tools/runtime/dispatch/agent-canon/src/python_module_groups.rs

