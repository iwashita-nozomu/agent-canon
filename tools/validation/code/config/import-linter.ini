[importlinter]
# Issue #912 establishes Import Linter as the architecture-graph owner.
# The checkout exposes `tools` as a regular package and `eval` as an importable
# namespace portion; these are the proven architecture graph roots.
root_packages =
    tools
    eval
include_external_packages = False

# Contracts are added only after the current custom rules are mapped to an
# importable package property (forbidden/layers/independence/protected).
# General unused and wildcard import findings remain Ruff-owned.
