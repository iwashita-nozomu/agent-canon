id = "design_integrity_gate"
description = "Implementation starts from an owning responsibility model and semantic decision sufficiency: owner, replaceable unit, implementation mechanism, validation route, unresolved branch, and design_issue_blocker."

[[contracts.surfaces]]
path = "agents/skills/agent-orchestration.md"
markers = ["Design Integrity Gate", "Decision sufficiency is semantic", "owner, replaceable unit", "implementation mechanism", "validation route", "unresolved branch", "design_issue_blocker"]

[[contracts.surfaces]]
