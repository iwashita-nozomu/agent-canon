# @dependency-start
# contract tool
# responsibility Declares canonical-source marker contracts consumed by convention compliance checks.
# upstream design ../../../../agents/skills/oop-readability-check.md SOLID checker route ownership
# upstream design ../../../../agents/canonical/CODEX_WORKFLOW.md branch reuse and checkout continuity policy
# upstream design ../../../../documents/design/entrypoint-owner-map.md root entrypoint responsibility boundary
# downstream implementation ./check_convention_compliance.py loads marker contracts
# downstream implementation ../entrypoint/check_entrypoint_owner_map.py rejects operational marker ownership in root entrypoints
# downstream implementation ../../../../tests/agent_tools/test_check_convention_compliance.py verifies marker contracts
# @dependency-end

schema_version = 1

# Skill policy markers belong to agents/skills/<skill>.md canonical prose owners.
# Generated .codex/personal/skills/<skill>/SKILL.md adapters use dedicated shim readback gates.
# AGENTS.md and ROOT_AGENTS.md are reader maps; operational marker contracts stay in owners.

