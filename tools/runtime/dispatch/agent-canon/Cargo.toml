# @dependency-start
# contract implementation
# responsibility Defines the AgentCanon Rust CLI crate.
# upstream design ../../../../documents/design/rust-agent-tool-migration.md Rust tool migration policy
# downstream implementation src/main.rs CLI entrypoint
# downstream implementation src/config.rs format-preserving managed Codex config update
# downstream implementation src/migration_audit.rs Rust migration audit command
# downstream implementation src/python_algorithm_contract.rs Python algorithm contract checker
# downstream implementation src/rust_migration_plan.rs Rust migration planning command
# downstream implementation src/structured_analysis.rs structured analysis document inventory and cache build commands
# downstream implementation src/test_design.rs test design resilience diagnostics
# @dependency-end

[package]
name = "agent-canon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha1 = "=0.10.7"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
yaml-rust2 = "0.11"
toml_edit = { version = "0.25.15", features = ["serde"] }
pathdiff = "0.2.3"
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"
cap-fs-ext = "=4.0.3"
regex = "=1.12.2"
time = { version = "=0.3.47", features = ["formatting"] }
rustpython-ast = { version = "0.4.0", default-features = false, features = ["location", "num-bigint", "unparse", "visitor"] }
rustpython-parser = { version = "0.4.0", default-features = false, features = ["location", "num-bigint"] }

icu_casemap = { version = "=1.3.2", features = ["compiled_data"] }
lsp-server = "=0.10.0"
