# @dependency-start
# contract environment
# responsibility Declares the pinned shared AgentCanon developer and agent tools.
# upstream design ../CONTAINER_OPERATIONS.md product image and mounted tool boundary
# upstream design ../documents/design/devcontainer/parent-dependency-manifest-followup.md parent-first merge and follow-up contract
# downstream implementation ../tools/agent_tools/devcontainer_dependencies.py typed parser and executor
# downstream implementation post-create.sh executes the validated topological plan
# @dependency-end

schema = "agent-canon.devcontainer-dependencies"
schema_version = 2

# This file contains mounted developer/agent tools only. Product image and
# project Python dependencies remain parent-owned.

[[records]]
id = "github-cli"
package = "gh"
method = "apt-repository"
version = "2.93.0"
source = "https://cli.github.com/packages"
key_url = "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
key_fingerprint = "2C6106201985B60E6C7AC87323F3D4EA75716059"
verification = { kind = "apt-repository" }
deps = ["ca-certificates", "curl"]
provides = ["gh"]
failure_policy = "fail"

