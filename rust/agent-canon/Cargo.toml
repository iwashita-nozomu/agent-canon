# @dependency-start
# responsibility Defines the AgentCanon Rust CLI crate.
# upstream design ../../documents/rust-agent-tool-migration.md Rust tool migration policy
# downstream implementation src/main.rs CLI entrypoint
# downstream implementation src/local_llm.rs local LLM CLI command
# downstream implementation src/migration_audit.rs Rust migration audit command
# downstream implementation src/mcp_inventory.rs Rust MCP preflight command
# downstream implementation src/python_algorithm_contract.rs Python algorithm contract checker
# downstream implementation src/rust_migration_plan.rs Rust migration planning command
# @dependency-end

[package]
name = "agent-canon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
