# @dependency-start
# contract template
# responsibility Defines machine-readable experiment plan, resource, run, result, and reproducibility fields.
# upstream design ./README.md reader-facing experiment contract.
# upstream design ../../../documents/design/experiment_runner.md managed experiment execution contract.
# downstream implementation ../../../templates/experiments/_template/run.py produces the referenced run artifact.
# @dependency-end

version = 1
template_kind = "experiment-provenance"
template_complete = false
completion_status = "incomplete"
# template_complete=false または placeholder 残存中は success に遷移させない。
# result.state は incomplete / success / failed / blocked のいずれか一つだけを取る。

[experiment]
topic = "<topic>"
owner = "<owner>"
question = "<question>"
hypothesis = "<hypothesis>"
plan_digest = "<sha256>"
non_goals = ["<non-goal>"]

[plan]
baseline = "<baseline>"
candidate = "<candidate>"
variables = ["<variable>"]
cases = ["<case-id>"]
observables = ["<observable>"]
evidence_targets = ["<observation-or-artifact-to-record>"]
metrics = ["<metric>"]
comparison = "<comparison-and-calculation>"
calculation = "<calculation>"
expected_mechanism = "<expected-mechanism>"
protocol = "<protocol>"
stopping_rule = "<stopping-rule>"
impossibility_conditions = ["<operational-impossibility-condition>"]
input_conditions = ["<input-condition>"]
environment_conditions = ["<environment-condition>"]

[plan.algorithm_contract]
public_entrypoint = "<entrypoint>"
input_schema = "<input-schema>"
state_transition = "<state-transition-or-recurrence>"
invariants = ["<invariant>"]
stopping_rule = "<stopping-rule>"
failure_semantics = "<typed-failure-and-preserved-state>"

[resource]
# Resource allocation belongs to the caller or scheduler; do not hard-code a GPU id.
admission_owner = "caller-or-scheduler"
request = "<cpu-memory-gpu-request>"
selection_reason = "<capability-or-scheduler-reason>"
gpu_visibility = "caller-provided"
parallelism_policy = "scheduler-or-caller"
environment_limit = "<none-or-recorded-limit>"
allocation_evidence = "<caller-or-scheduler-record>"

[source]
repository = "<repository>"
branch = "<branch>"
commit = "<commit-sha>"
dirty_state = "clean"

[input]
config_path = "<config-path>"
config_snapshot = "<result-path>/summary/config_snapshot.json"
seed_policy = "<seed-policy>"
environment_snapshot = "<result-path>/summary/environment.json"

[run]
runner = "<managed-runner>"
command = "<exact-command>"
run_id = "<run-id>"
started_at = "<RFC3339>"
finished_at = "<RFC3339>"
exit_status = "<exit-status>"

[result]
path = "<result-path>"
summary = "<result-path>/summary/summary.json"
cases = "<result-path>/summary/cases.jsonl"
manifest = "<result-path>/summary/artifact-manifest.json"
visualization_status = "<result-path>/summary/visualization-status.json"
state = "incomplete"
status = "incomplete"
failure_class = "<expected|infrastructure|implementation|oracle|unknown|none>"
failure_evidence = "<required-path-or-none>"
preserved_artifacts = ["<artifact-path>"]
close_condition = "<required-close-condition>"
execution_evidence = "<exit-status-case-state-artifact-readback>"
failure_cause_owner = "<owner>"
conflict_intent = "<preserved-intent-or-none>"
# success、failed、blocked、incomplete は実行状態であり、研究上の結論ではない。
# success は exit_status=0、case state、artifact existence/checksum/readback が揃った
# 場合に記録する。failed、blocked、incomplete は failure evidence と close condition
# を記録する。

[reproducibility]
readback_command = "<command>"
required_artifacts = ["summary/summary.json", "summary/artifact-manifest.json"]
required_case_artifact = "summary/cases.jsonl"
config_snapshot = "<result-path>/summary/config_snapshot.json"
environment_snapshot = "<result-path>/summary/environment.json"
known_nondeterminism = "<none-or-description>"
retention_owner = "<owner>"
cleanup_policy = "<policy>"
cleanup_command = "<command>"
reconstructibility_readback = "<evidence-path-or-command>"

[[cases]]
id = "<case-id>"
parameters = "<parameter-record>"
expected = "<expected-observation>"

# For a preserved failure result, set result.status = "failed", fill failure_class,
# and record the evidence and close condition in the README.
