# @dependency-start
# contract template
# responsibility Seeds the canonical total single-owner relation for tracked paths in template-derived repositories.
# upstream design ../../documents/design/responsibility-scope-management.md scope ownership policy
# upstream design ../../documents/structure/repo-structure-contract.toml separate path existence and kind contract
# upstream implementation ../../tools/agent_tools/responsibility_scope.py validates this schema
# downstream implementation responsibility-scope.toml is the rendered project-local contract
# @dependency-end

catalog_kind = "agent_canon_responsibility_scope"
version = 1

owner_values = [
  "agent-canon",
  "template",
  "derived-project",
  "github",
  "external-vendor",
]

class_values = [
  "shared_runtime",
  "shared_policy",
  "active_contract",
  "durable_state",
  "evidence",
  "tooling",
  "github_surface",
  "external_dependency",
]

[[import_rule]]
source = "agent-canon-runtime-view"
targets = [
  "agent-canon-runtime-view",
  "parent-repo-active-contract",
  "project-durable-state",
  "parent-github-automation",
  "external-vendor",
]

[[import_rule]]
source = "parent-repo-active-contract"
targets = [
  "parent-repo-active-contract",
  "agent-canon-runtime-view",
  "project-durable-state",
  "parent-github-automation",
  "external-vendor",
]

[[import_rule]]
source = "project-durable-state"
targets = [
  "project-durable-state",
  "parent-repo-active-contract",
  "agent-canon-runtime-view",
]

[[import_rule]]
source = "parent-github-automation"
targets = [
  "parent-github-automation",
  "parent-repo-active-contract",
  "agent-canon-runtime-view",
]

[[import_rule]]
source = "external-vendor"
targets = [
  "external-vendor",
]

[[scope]]
id = "agent-canon-runtime-view"
owner = "agent-canon"
class = "shared_runtime"
description = "Active AgentCanon source and generated runtime views consumed by the parent repository."
paths = [
  "vendor/agent-canon/**",
  "AGENTS.md",
  ".codex/config.toml",
  ".codex/agents/**",
  "documents/notes",
  "documents/notes/**",
  "tools/agent-canon/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/agent_canon_source_root.py",
  "tools/agent-canon/agent_tools/responsibility_scope.py",
  "tools/agent-canon/sync_agent_canon.sh",
]
issues = []

[[scope]]
id = "parent-repo-active-contract"
owner = "derived-project"
class = "active_contract"
description = "Parent-owned active code, configuration, documentation, tests, editor state, and generated skill adapters."
paths = [
  ".agents/**",
  ".codex/**",
  ".devcontainer/**",
  ".dockerignore",
  ".gitattributes",
  ".gitignore",
  ".gitmodules",
  ".markdownlint.json",
  ".vscode/**",
  "LICENSE",
  "Makefile",
  "README.md",
  "QUICK_START.md",
  "agents/**",
  "cpp/**",
  "docker/**",
  "documents/**",
  "examples/**",
  "goal.md",
  "pyproject.toml",
  "pyrightconfig.json",
  "python/**",
  "responsibility-scope.toml",
  "scripts/**",
  "tests/**",
  "tools/**",
]
exclude_paths = [
  ".codex/config.toml",
  ".codex/agents",
  ".codex/agents/**",
  "tools/agent-canon",
  "tools/agent-canon/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/responsibility_scope.py",
  "tools/agent-canon/agent_tools/import_responsibility.py",
]
issues = []

[[scope]]
id = "project-durable-state"
owner = "derived-project"
class = "durable_state"
description = "Project-owned experiments, evidence, memory, notes, references, and other durable records."
paths = [
  "experiments/**",
  "evidence/**",
  "memory/**",
  "documents/notes/**",
  "references/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/task_close.py",
  "tools/agent-canon/agent_tools/responsibility_scope.py",
]
issues = []

[[scope]]
id = "parent-github-automation"
owner = "github"
class = "github_surface"
description = "Parent-owned GitHub Actions, issue templates, PR templates, and repository automation."
paths = [
  ".github/**",
]
protecting_tools = [
  "tools/agent-canon/ci/check_github_workflows.py",
  "tools/agent-canon/agent_tools/github_status_lifecycle.py",
]
issues = []

[[scope]]
id = "external-vendor"
owner = "external-vendor"
class = "external_dependency"
description = "Vendored dependencies other than the active AgentCanon source tree."
paths = [
  "vendor/**",
]
exclude_paths = [
  "vendor/agent-canon",
  "vendor/agent-canon/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/task_authority.py",
]
issues = []
