# Canonical source: templates/documents/github/issue/agentcanon-maintenance.yml. Generated projection targets .github/ISSUE_TEMPLATE/agentcanon-maintenance.yml; edit this source only.

name: AgentCanon maintenance issue
description: Track an AgentCanon runtime, tool, workflow, docs, or propagation defect.
title: "[agent-canon] "
labels: ["agent-canon", "maintenance"]
body:
  - type: dropdown
    id: runtime_profile
    attributes:
      label: Affected runtime profile
      options:
        - Agent runtime
        - Docs
        - Python/tooling
        - Docker/devcontainer
        - GitHub automation
        - MCP
        - Submodule/update
        - Eval/logging
        - Other
    validations:
      required: true
  - type: input
    id: affected_surface
    attributes:
      label: Affected surface/path
      placeholder: "agents/workflows/..., tools/..., .codex/..."
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Observed facts / current behavior
      description: Record only observed command, hook, CI, workflow, or artifact facts with paths and timestamps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest clean-state command, fixture, branch, and expected versus actual result.
      value: |
        preconditions:
        command:
        expected:
        actual:
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Canonical owner / responsible unit
      placeholder: "documents/..., agents/..., tools/..."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and failure semantics
      description: State who is blocked, what becomes unsafe or non-reproducible, and what remains preserved.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: Record at least two viable repair options and the selected mechanism.
      value: |
        option A:
        option B:
        selected:
    validations:
      required: true
  - type: textarea
    id: rejected_rationale
    attributes:
      label: Rejected options and rationale
      description: Explain why each rejected option violates the contract, ownership, safety, or validation oracle.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance conditions
      description: Define the observable contract, evidence oracle, validation command, and close condition.
      value: |
        observable contract:
        evidence / oracle:
        validation command:
        close condition:
    validations:
      required: true
  - type: textarea
    id: non_goal
    attributes:
      label: Non-goals
      description: Name adjacent cleanup or behavior that this finding deliberately does not change.
    validations:
      required: true
  - type: textarea
    id: downstream_impact
    attributes:
      label: Downstream impact
      description: Note template/derived repo impact or say not applicable.
    validations:
      required: true
  - type: textarea
    id: required_validation
    attributes:
      label: Required validation
      value: |
        - [ ] targeted local check:
        - [ ] docs/link check:
        - [ ] AgentCanon PR gate:
    validations:
      required: true
  - type: textarea
    id: eval_required
    attributes:
      label: Eval required or not required
      description: Link an eval case, or explain why this cannot be evaled.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback consideration
      description: Include rollback command or explain why rollback is not applicable.
  - type: textarea
    id: closeout_evidence
    attributes:
      label: Closeout evidence
      value: |
        - fixed by:
        - validation:
        - issue/eval links:
    validations:
      required: true
