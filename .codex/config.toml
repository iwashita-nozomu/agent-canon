# Project-scoped Codex settings.
# Keep review fan-out explicit, keep one writer per worktree, do not fix agent depth in repo config,
# and use spawned agents in bounded waves instead of starting every available role at once.
# @dependency-start
# responsibility Documents Project-scoped Codex settings. for this repository.
# upstream design ../agents/task_catalog.yaml workflow family runtime budgets
# upstream design ../agents/canonical/CODEX_SUBAGENTS.md Codex subagent routing
# downstream implementation ./hooks.json injects MCP startup and prompt context
# downstream implementation ../tools/agent_tools/check_mcp_inventory.py verifies MCP inventory
# downstream implementation ../tools/agent_tools/check_agent_runtime_alignment.py validates agent model policy
# downstream design ../agents/workflows/token-efficient-codex-workflow.md token-aware runtime modes
# @dependency-end

approval_policy = "never"
sandbox_mode = "danger-full-access"

review_model = "gpt-5.5"

[features]
codex_hooks = true
goals = true

[profiles.token-lite]
model_reasoning_effort = "minimal"
plan_mode_reasoning_effort = "minimal"
model_verbosity = "low"
tool_output_token_limit = 2000

[profiles.token-standard]
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_verbosity = "medium"
tool_output_token_limit = 3000

[profiles.token-deep]
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
tool_output_token_limit = 6000

[profiles.review]
model = "gpt-5.5"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
approval_policy = "never"

[agents]
max_threads = 24
job_max_runtime_seconds = 3600

[agents.model_policy.frontier_judgment]
model = "gpt-5.5"
model_reasoning_effort = "high"
roles = [
  "requirements_organizer",
  "execution_planner",
  "detailed_designer",
  "long_form_writer",
  "detailed_design_reviewer",
  "citation_evidence_reviewer",
  "notation_definition_reviewer",
  "logic_gap_reviewer",
  "reviewer",
  "project_reviewer",
  "literature_researcher",
]

[agents.model_policy.mini_review]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
roles = [
  "manager_reviewer",
  "plan_reviewer",
  "document_flow_reviewer",
  "oop_readability_reviewer",
  "report_reviewer",
  "docs_workflow_steward",
  "reproducibility_reviewer",
  "scientific_computing_reviewer",
  "benchmark_reviewer",
  "artifact_reviewer",
  "fair_data_reviewer",
  "ml_science_reviewer",
]

[agents.model_policy.spark_read]
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "low"
roles = [
  "explorer",
  "test_designer",
  "python_reviewer",
  "cpp_reviewer",
]

[agents.model_policy.frontier_implementation]
model = "gpt-5.5"
model_reasoning_effort = "high"
roles = [
  "worker",
]

[agents.model_policy.spark_coding]
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "low"
roles = [
  "spark_worker",
]

[mcp_servers.repo_mcp_server]
command = "bash"
args = ["mcp/repo_mcp_server.sh"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 300
