# Project-scoped Codex settings.
# Keep review fan-out explicit, keep project subagent registration centralized here,
# and use spawned agents in bounded waves instead of starting every available role at once.
# This file owns role registration. The canonical profile registry owns child profile authority,
# and the canonical materializer generates .codex/agents/*.toml plus agents_config projections.
# @dependency-start
# contract configuration
# responsibility Documents Project-scoped Codex settings. for this repository.
# upstream design ../agents/task_catalog.yaml workflow family runtime budgets
# upstream design ../agents/canonical/CODEX_SUBAGENTS.md Codex subagent routing
# upstream design ../documents/runtime/runtime-profiles-and-check-matrix.json canonical validation trust boundary owner
# downstream implementation ./hooks.json injects lifecycle hook context
# downstream implementation ../tools/agent_tools/check_agent_runtime_alignment.py validates agent registry and role TOML
# downstream design ../agents/workflows/token-efficient-codex-workflow.md token-aware runtime modes
# @dependency-end

approval_policy = "on-request"
sandbox_mode = "workspace-write"

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
review_model = "gpt-5.6-luna"
model_context_window = 1000000
tool_output_token_limit = 4096

[agents]
max_threads = 27
max_depth = 2
job_max_runtime_seconds = 3600

[agents.terra]
description = "Conditional read-only cross-cutting specialist for owner closure, context reconstruction, and adversarial contradiction validation."
config_file = "agents/terra.toml"

[agents.artifact_reviewer]
description = "Read-only reviewer for code, scripts, raw results, environment capture, and artifact-readiness."
config_file = "agents/artifact_reviewer.toml"

