# @dependency-start
# contract reference
# responsibility Declares the canonical total single-owner relation for tracked AgentCanon paths.
# upstream design documents/design/responsibility-scope-management.md scope ownership policy
# upstream design documents/structure/repo-structure-contract.toml separate path existence and kind contract
# upstream design tools/catalog.yaml protecting tool ownership
# downstream implementation tools/agent_tools/responsibility_scope.py validates this manifest
# downstream implementation tools/agent_tools/import_responsibility.py checks import boundaries
# downstream implementation tools/agent_tools/tool_drift.py checks scope/tool trace links
# @dependency-end

catalog_kind = "agent_canon_responsibility_scope"
version = 1

owner_values = [
  "agent-canon",
  "template",
  "derived-project",
  "github",
  "external-vendor",
]

class_values = [
  "shared_runtime",
  "shared_policy",
  "active_contract",
  "durable_state",
  "evidence",
  "tooling",
  "github_surface",
  "external_dependency",
]

[[import_rule]]
source = "runtime-entrypoints"
targets = [
  "runtime-entrypoints",
  "shared-tooling",
  "shared-policy-documents",
  "eval-and-hook-evidence",
  "operational-issue-state",
  "experiment-artifacts",
]

[[import_rule]]
source = "operational-issue-state"
targets = [
  "operational-issue-state",
  "shared-tooling",
  "shared-policy-documents",
]

[[import_rule]]
source = "eval-and-hook-evidence"
targets = [
  "eval-and-hook-evidence",
  "shared-tooling",
  "shared-policy-documents",
  "shared-test-suite",
]

[[import_rule]]
source = "shared-tooling"
targets = [
  "shared-tooling",
  "shared-policy-documents",
  "operational-issue-state",
  "eval-and-hook-evidence",
  "runtime-entrypoints",
  "github-automation",
  "shared-test-suite",
  "experiment-artifacts",
]

[[import_rule]]
source = "shared-test-suite"
targets = [
  "shared-test-suite",
  "shared-tooling",
  "shared-policy-documents",
  "runtime-entrypoints",
  "operational-issue-state",
  "eval-and-hook-evidence",
  "experiment-artifacts",
]

[[import_rule]]
source = "shared-policy-documents"
targets = [
  "shared-policy-documents",
  "shared-tooling",
  "runtime-entrypoints",
  "operational-issue-state",
  "eval-and-hook-evidence",
  "shared-test-suite",
  "github-automation",
  "experiment-artifacts",
]

[[import_rule]]
source = "github-automation"
targets = [
  "github-automation",
  "shared-tooling",
  "shared-policy-documents",
  "runtime-entrypoints",
  "eval-and-hook-evidence",
]

[[import_rule]]
source = "external-vendor"
targets = [
  "external-vendor",
]

[[import_rule]]
source = "experiment-artifacts"
targets = [
  "experiment-artifacts",
  "shared-tooling",
  "shared-policy-documents",
  "eval-and-hook-evidence",
]

[[scope]]
id = "runtime-entrypoints"
owner = "agent-canon"
class = "shared_runtime"
description = "Canonical AgentCanon runtime entrypoints, adapters, profiles, and shared source templates."
paths = [
  "AGENTS.md",
  "ROOT_AGENTS.md",
  ".agents/**",
  ".codex/**",
  ".devcontainer/**",
  ".vscode/**",
  "agent-canon-environment.toml",
  "agents/**",
  "templates/**",
]
protecting_tools = [
  "tools/agent_tools/check_agent_runtime_alignment.py",
]
issues = []

[[scope]]
id = "operational-issue-state"
owner = "agent-canon"
class = "durable_state"
description = "Canonical local issue records and their lifecycle state."
paths = [
  "issues/**",
]
protecting_tools = [
  "tools/agent_tools/issue_sync.py",
  "tools/agent_tools/task_close.py",
]
issues = []

[[scope]]
id = "eval-and-hook-evidence"
owner = "agent-canon"
class = "evidence"
description = "Append-only hook, skill, eval, runtime-log, and learning evidence plus its dedicated readers and tests."
paths = [
  "evidence",
  "evidence/**",
  "documents/evals/**",
  "documents/runtime/runtime-log-archive.md",
  "documents/runtime/runtime-log-archive-migration.md",
  "reports/**",
  "tools/agent_tools/eval_accumulation_check.py",
  "tools/agent_tools/eval_learning.py",
  "tools/agent_tools/eval_trend.py",
  "tools/agent_tools/evidence_split.py",
  "tools/agent_tools/goal_evidence.py",
  "tools/agent_tools/hook_outcome_review.py",
  "tools/agent_tools/hook_outcomes.py",
  "tools/agent_tools/pre_task_outcome_capture.py",
  "tools/agent_tools/runtime_log_archive_git.py",
  "tools/agent_tools/runtime_log_paths.py",
  "tools/agent_tools/skill_evaluation.py",
  "tools/agent_tools/skill_eval_report.py",
  "tests/agent_tools/test_eval_accumulation_check.py",
  "tests/agent_tools/test_eval_learning.py",
  "tests/agent_tools/test_eval_trend.py",
  "tests/agent_tools/test_evidence_split.py",
  "tests/agent_tools/test_goal_evidence.py",
  "tests/agent_tools/test_hook_outcome_review.py",
  "tests/agent_tools/test_hook_outcomes.py",
  "tests/agent_tools/test_pre_task_outcome_capture.py",
  "tests/agent_tools/test_runtime_log_archive_git.py",
  "tests/agent_tools/test_runtime_log_paths.py",
  "tests/agent_tools/test_skill_evaluation.py",
  "tests/agent_tools/test_skill_eval_report.py",
]
protecting_tools = [
  "tools/agent_tools/eval_accumulation_check.py",
  "tools/agent_tools/runtime_log_archive_git.py",
]
issues = []

[[scope]]
id = "shared-tooling"
owner = "agent-canon"
class = "tooling"
description = "Shared tool implementations, tool catalog, compiled tooling, and helper policy."
paths = [
  "tools/**",
  "rust/**",
  "helper_inventory_guard_policy.json",
]
exclude_paths = [
  "tools/agent_tools/eval_accumulation_check.py",
  "tools/agent_tools/eval_learning.py",
  "tools/agent_tools/eval_trend.py",
  "tools/agent_tools/evidence_split.py",
  "tools/agent_tools/goal_evidence.py",
  "tools/agent_tools/hook_outcome_review.py",
  "tools/agent_tools/hook_outcomes.py",
  "tools/agent_tools/pre_task_outcome_capture.py",
  "tools/agent_tools/runtime_log_archive_git.py",
  "tools/agent_tools/runtime_log_paths.py",
  "tools/agent_tools/skill_evaluation.py",
  "tools/agent_tools/skill_eval_report.py",
]
protecting_tools = [
  "tools/agent_tools/responsibility_scope.py",
  "tools/agent_tools/tool_drift.py",
]
issues = []

[[scope]]
id = "shared-test-suite"
owner = "agent-canon"
class = "tooling"
description = "Repository-owned tests outside the dedicated eval and hook evidence scope."
paths = [
  "tests/**",
]
exclude_paths = [
  "tests/agent_tools/test_eval_accumulation_check.py",
  "tests/agent_tools/test_eval_learning.py",
  "tests/agent_tools/test_eval_trend.py",
  "tests/agent_tools/test_evidence_split.py",
  "tests/agent_tools/test_goal_evidence.py",
  "tests/agent_tools/test_hook_outcome_review.py",
  "tests/agent_tools/test_hook_outcomes.py",
  "tests/agent_tools/test_pre_task_outcome_capture.py",
  "tests/agent_tools/test_runtime_log_archive_git.py",
  "tests/agent_tools/test_runtime_log_paths.py",
  "tests/agent_tools/test_skill_evaluation.py",
  "tests/agent_tools/test_skill_eval_report.py",
]
protecting_tools = [
  "tools/agent_tools/responsibility_scope.py",
  "tools/ci/run_all_checks.sh",
]
issues = []

[[scope]]
id = "shared-policy-documents"
owner = "agent-canon"
class = "shared_policy"
description = "Shared policy, design, operational documents, root metadata, memory, notes, and references."
paths = [
  ".dockerignore",
  ".gitattributes",
  ".gitignore",
  "CONTAINER_OPERATIONS.md",
  "LICENSE",
  "PHILOSOPHY.md",
  "README.md",
  "goal.md",
  "responsibility-scope.toml",
  "codex-cli-guide/**",
  "completion-first-review/**",
  "documents/**",
  "memory/**",
  "references/**",
]
exclude_paths = [
  "documents/evals/**",
  "documents/runtime/runtime-log-archive.md",
  "documents/runtime/runtime-log-archive-migration.md",
]
protecting_tools = [
  "tools/agent_tools/check_dependency_headers.py",
  "tools/agent_tools/check_design_doc_claims.py",
  "tools/agent_tools/responsibility_scope.py",
]
issues = []

[[scope]]
id = "github-automation"
owner = "github"
class = "github_surface"
description = "GitHub Actions, issue templates, PR templates, and repository automation."
paths = [
  ".github/**",
]
protecting_tools = [
  "tools/ci/check_github_workflows.py",
]
issues = []

[[scope]]
id = "external-vendor"
owner = "external-vendor"
class = "external_dependency"
description = "Vendored third-party assets kept outside canonical AgentCanon runtime paths."
paths = [
  "vendor/**",
]
protecting_tools = [
  "tools/agent_tools/vendor_skill_adapters.py",
  "tools/agent_tools/responsibility_scope.py",
]
issues = []

[[scope]]
id = "experiment-artifacts"
owner = "agent-canon"
class = "durable_state"
description = "Tracked experiment definitions and durable experiment metadata; managed result bytes remain external evidence."
paths = [
  "experiments/**",
]
protecting_tools = [
  "tools/agent_tools/responsibility_scope.py",
]
issues = []
