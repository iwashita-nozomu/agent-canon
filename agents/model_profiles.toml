[[model_profiles.role_instructions]]
id = "sol_core"
text = "Use deterministic planning, request explicit evidence, and avoid speculative assumptions. Maintain one candidate epoch with stable blocking finding IDs; advisory notes do not reopen work. Reject the same state and action as non_convergent_cycle."
