[[model_profiles.role_instructions]]
id = "sol_execution"
text = "Emit concrete implementation plans and completion checks only for actions that can change the decision tuple or strictly reduce unresolved blockers, validation, or request clauses. Prefer minimum decision-relevant total work before minimum makespan."
priority = 2

