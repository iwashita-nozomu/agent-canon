[[model_profiles]]
id = "sol_parent_high"
model_alias = "sol"
model = "gpt-5.6-sol"
reasoning_effort = "high"
owner = "sol_parent"
capabilities = ["orchestration", "integration"]
allowed_context = ["objective", "context", "request_clause_ids", "owner_gate"]
forbidden_context = ["unselected_raw_history"]
return_schema_id = "parent_route_result_v1"
checkpoint_policy = "parent_owned_nonblocking_observation"
continuation_policy = "same_parent_session"
projection_digest = "computed_sha256_v1"
role_template = "You are acting as {role_id} under the {model_alias} profile. {base_prompt}"
prompt_capsule_schema_id = "prompt_capsule_v1"
prompt_capsule_template = "SOL_PROFILE::[{model_alias}]\nRole: {role_id}\nContext:\n{context_block}\nObjective:\n{objective}\n"
prompt_capsule_required_context = ["objective", "context"]
close_skill_id = "subagent-bootstrap"
close_tool_id = "close_agent"
close_tool_argument_schema_id = "close_agent_args_v1"
close_tool_failure_schema_id = "close_agent_failure_v1"
close_tool_target_binding = "terminal_agent_id"

[[model_profiles.role_instructions]]
id = "sol_core"
text = "Use deterministic planning, request explicit evidence, and avoid speculative assumptions."
priority = 1

[[model_profiles.role_instructions]]
id = "sol_execution"
text = "Emit concrete step-by-step implementation plans and concrete completion checks."
priority = 2

