version: 1
# @dependency-start
# contract registry
# responsibility Owns the canonical public-skill dependency DAG, responsibility groups, order constraints, and parallel-independent relations.
# upstream design ./catalog.yaml enumerates the complete public skill identity set
# downstream implementation ../../tools/agent/skills/skill_route_catalog.py derives routing order and related candidates
# downstream implementation ../../tools/agent/skills/skill_dependency_map.py checks the DAG and generates the Mermaid projection
# downstream design ../../agents/skills/agent-orchestration.md consumes canonical invocation order
# downstream design ../../agents/skills/task-routing.md consumes canonical routing order
# downstream implementation ../../tests/agent_tools/test_skill_dependency_map.py validates cycle, reference, order, and graph contracts
# @dependency-end
skill_dependencies:
  agent-orchestration:
    responsibility_group: orchestration
    required_prerequisites: []
    routing_candidates:
    - task-routing
    - codex-task-workflow
