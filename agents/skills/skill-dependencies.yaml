    - direct-luna-communication
    - dependency-analysis
    successors:
    - task-routing
    - codex-task-workflow
    - subagent-bootstrap
    - direct-luna-communication
    - dependency-analysis
    order_constraints:
    - before: agent-orchestration
      after: task-routing
      reason: routing entry precedes route derivation
    parallel_independent:
    - comprehensive-development
