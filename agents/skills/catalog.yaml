version: 1
# @dependency-start
# responsibility Catalogs canonical agent skills and their descriptions.
# downstream design ../canonical/CODEX_WORKFLOW.md consumes the skill catalog during task routing
# @dependency-end

skill_families:
  - id: agent-orchestration
    purpose: Mandatory routing skill for repository tasks; selects workflow family, skills, review roles, and runtime entrypoints before execution.
    canonical_doc: agents/skills/agent-orchestration.md
    shim: .agents/skills/agent-orchestration/SKILL.md
  - id: repo-onboarding
    purpose: Fast safe entry path for an unfamiliar repository or subdirectory.
    canonical_doc: agents/skills/repo-onboarding.md
    shim: .agents/skills/repo-onboarding/SKILL.md
  - id: task-routing
    purpose: Resolve long proposed tool or skill names into short routing areas and compact commands.
    canonical_doc: agents/skills/task-routing.md
    shim: .agents/skills/task-routing/SKILL.md
  - id: start-repository
    purpose: Start a new GitHub/submodule-first repository from the template clone.
    canonical_doc: agents/skills/start-repository.md
    shim: .agents/skills/start-repository/SKILL.md
  - id: codex-task-workflow
    purpose: Execute repository tasks with a context-independent Codex flow.
    canonical_doc: agents/skills/codex-task-workflow.md
    shim: .agents/skills/codex-task-workflow/SKILL.md
  - id: subagent-bootstrap
    purpose: Start the right specialist run bundle and make stage subagents explicit before implementation.
    canonical_doc: agents/skills/subagent-bootstrap.md
    shim: .agents/skills/subagent-bootstrap/SKILL.md
  - id: change-review
    purpose: Review diffs for regressions, missing validation, and stale docs.
    canonical_doc: agents/skills/change-review.md
    shim: .agents/skills/change-review/SKILL.md
  - id: python-review
    purpose: Review Python diffs with pyright, pytest, ruff, and type-boundary awareness.
    canonical_doc: agents/skills/python-review.md
    shim: .agents/skills/python-review/SKILL.md
  - id: cpp-review
    purpose: Review C and C++ diffs with build evidence, header-boundary awareness, and ownership checks.
    canonical_doc: agents/skills/cpp-review.md
    shim: .agents/skills/cpp-review/SKILL.md
  - id: oop-readability-check
    purpose: Run the OOP readability checker, produce mechanical report tables, and optionally add separate agent analysis.
    canonical_doc: agents/skills/oop-readability-check.md
    shim: .agents/skills/oop-readability-check/SKILL.md
  - id: result-artifact-writeout
    purpose: Write tool, hook, eval, skill, and experiment results as durable raw artifacts, summaries, and manifests without accidental overwrite.
    canonical_doc: agents/skills/result-artifact-writeout.md
    shim: .agents/skills/result-artifact-writeout/SKILL.md
  - id: tool-finding-report
    purpose: Run tools and checkers to discover findings, preserve raw and structured full artifacts, mechanically rank every finding, and produce complete finding packets for implementation or refactor planning; compare impact only when requested.
    canonical_doc: agents/skills/tool-finding-report.md
    shim: .agents/skills/tool-finding-report/SKILL.md
  - id: agent-log-analysis
    purpose: Analyze accumulated skill, tool, workflow, hook, and eval logs through a compact generated summary before reading raw evidence.
    canonical_doc: agents/skills/agent-log-analysis.md
    shim: .agents/skills/agent-log-analysis/SKILL.md
  - id: agent-eval-accumulation
    purpose: Repair missing, stale, or failing AgentCanon accumulated eval evidence by running registered producers, validating family accumulation, and archiving append-only reports.
    canonical_doc: agents/skills/agent-eval-accumulation.md
    shim: .agents/skills/agent-eval-accumulation/SKILL.md
  - id: agent-canon-update
    purpose: Update AgentCanon source, parent submodule pins, root runtime views, and parent update TODO state through the canonical high-level route.
    canonical_doc: agents/skills/agent-canon-update.md
    shim: .agents/skills/agent-canon-update/SKILL.md
  - id: pr-processing
    purpose: Process GitHub pull request and issue queues by inventorying state, checking mutation authority, resolving conflicts, ordering merges, validating gates, triaging issues, and syncing AgentCanon source PRs with parent pin PRs.
    canonical_doc: agents/skills/pr-processing.md
    shim: .agents/skills/pr-processing/SKILL.md
  - id: agent-update-branch
    purpose: Isolate memory, eval result, AgentCanon pin, and other agent-runtime updates on template-derived update branches before controlled integration.
    canonical_doc: agents/skills/agent-update-branch.md
    shim: .agents/skills/agent-update-branch/SKILL.md
  - id: report-writing
    purpose: Draft reader-facing reports, experiment summaries, decision briefs, and presentation/PPT storyboards from evidence with explicit source packets, visual asset plans, limitations, actionability, and quality checklist gates.
    canonical_doc: agents/skills/report-writing.md
    shim: .agents/skills/report-writing/SKILL.md
  - id: prose-reasoning-graph
    purpose: Convert prose into a SQLite-backed structure graph, diagnose discourse/argument/evidence/experiment gaps, explain findings, and emit writing-skill handoff packets.
    canonical_doc: agents/skills/prose-reasoning-graph.md
    shim: .agents/skills/prose-reasoning-graph/SKILL.md
  - id: structure-planning
    purpose: Build structure contracts for reports, experiments, presentations/PPT decks, documents, papers, HTML views, and refactors before prose, rendering, interpretation, runs, or edits.
    canonical_doc: agents/skills/structure-planning.md
    shim: .agents/skills/structure-planning/SKILL.md
  - id: html-output
    purpose: Produce polished browser-readable HTML artifacts only when HTML is explicit, including layout gates, optional ImageGen assets, and local/external browser server publication.
    canonical_doc: agents/skills/html-output.md
    shim: .agents/skills/html-output/SKILL.md
  - id: html-experiment-report
    purpose: Produce browser-readable HTML experiment or Eval reports by choosing the primary figure, planning from it, reusing existing artifacts, and rendering bounded evidence.
    canonical_doc: agents/skills/html-experiment-report.md
    shim: .agents/skills/html-experiment-report/SKILL.md
  - id: test-design
    purpose: Statically diagnose brittle tests and design resilient behavior contracts, oracles, property/metamorphic candidates, and adversarial cases before implementation.
    canonical_doc: agents/skills/test-design.md
    shim: .agents/skills/test-design/SKILL.md
  - id: refactor-loop
    purpose: Run large refactors as behavior-preserving looped structural change with explicit safety contracts and repair slices.
    canonical_doc: agents/skills/refactor-loop.md
    shim: .agents/skills/refactor-loop/SKILL.md
  - id: structure-refactor
    purpose: Refactor repository directory structure from recursive directory README responsibilities, dependency manifests, path mappings, and responsibility-scope validation.
    canonical_doc: agents/skills/structure-refactor.md
    shim: .agents/skills/structure-refactor/SKILL.md
  - id: user-guided-debugging
    purpose: Debug or repair one issue at a time when the user explicitly asks for visible problem statements before each edit and the next issue after each fix.
    canonical_doc: agents/skills/user-guided-debugging.md
    shim: .agents/skills/user-guided-debugging/SKILL.md
  - id: long-form-writing
    purpose: Project graph/DSL structure into general explanatory repository prose for README, workflow, guide, migration, and specification responsibilities.
    canonical_doc: agents/skills/long-form-writing.md
    shim: .agents/skills/long-form-writing/SKILL.md
  - id: academic-writing
    purpose: Draft academic documents with explicit claim mapping and mandatory multi-agent review for notation and logic.
    canonical_doc: agents/skills/academic-writing.md
    shim: .agents/skills/academic-writing/SKILL.md
  - id: paper-writing
    purpose: Draft papers and thesis chapters with section contracts and mandatory citation/evidence review.
    canonical_doc: agents/skills/paper-writing.md
    shim: .agents/skills/paper-writing/SKILL.md
  - id: md-style-check
    purpose: Check Markdown formatting, heading structure, and link hygiene for format-only docs work; pair substantive document edits with prose-reasoning-graph and structure-planning.
    canonical_doc: agents/skills/md-style-check.md
    shim: .agents/skills/md-style-check/SKILL.md
  - id: mvp-skeleton
    purpose: Keep MVP, prototype, v0, and thin-slice implementation skeletal by fixing one core loop, stubbing nonessential work, and reporting deferrals.
    canonical_doc: agents/skills/mvp-skeleton.md
    shim: .agents/skills/mvp-skeleton/SKILL.md
  - id: document-canon-cleanup
    purpose: Find non-canonical documents and route edits to source canon instead of mirrors, generated evidence, or stale copies.
    canonical_doc: agents/skills/document-canon-cleanup.md
    shim: .agents/skills/document-canon-cleanup/SKILL.md
  - id: dependency-analysis
    purpose: Run dependency manifest and code-dependency tools, then package change impact and repair-planning context for editing, review, or subagent handoff.
    canonical_doc: agents/skills/dependency-analysis.md
    shim: .agents/skills/dependency-analysis/SKILL.md
  - id: worktree-start
    purpose: Diagnose stale worktree, WORKTREE_SCOPE.md, and action-log state as legacy cleanup evidence; not for new worktree kickoff, recreation, or resume.
    canonical_doc: agents/skills/worktree-start.md
    shim: .agents/skills/worktree-start/SKILL.md
  - id: worktree-health
    purpose: Review worktree scope, drift, and cleanup readiness.
    canonical_doc: agents/skills/worktree-health.md
    shim: .agents/skills/worktree-health/SKILL.md
  - id: experiment-lifecycle
    purpose: Run a single experiment protocol, then branch through review, rewrite, extra validation, or rerun.
    canonical_doc: agents/skills/experiment-lifecycle.md
    shim: .agents/skills/experiment-lifecycle/SKILL.md
  - id: computational-optimization
    purpose: Fix mathematical and validation contracts for numerical optimization, solvers, preconditioners, convergence, derivatives, KKT conditions, tolerances, and optimization benchmarks.
    canonical_doc: agents/skills/computational-optimization.md
    shim: .agents/skills/computational-optimization/SKILL.md
  - id: adaptive-improvement-loop
    purpose: Manage experiments, research, tuning, and iterative code changes as one backlog-driven outer loop.
    canonical_doc: agents/skills/adaptive-improvement-loop.md
    shim: .agents/skills/adaptive-improvement-loop/SKILL.md
  - id: literature-survey
    purpose: Search for primary sources, prior art, contradictory evidence, and reusable bibliography structure.
    canonical_doc: agents/skills/literature-survey.md
    shim: .agents/skills/literature-survey/SKILL.md
  - id: formal-proof-workflow
    purpose: Convert natural-language mathematical claims or Python AST-derived implementation claims into formal-proof obligations, existing-proof search packets, proof-assistant scaffolds, and checker-gated evidence.
    canonical_doc: agents/skills/formal-proof-workflow.md
    shim: .agents/skills/formal-proof-workflow/SKILL.md
  - id: algorithm-proof-exploration
    purpose: Explore algorithm choices under proof obligations by building Algorithm Expansion IR, lemma dependency graphs, algorithmic blocker frontiers, and algorithm-change handoffs for formal-proof adoption.
    canonical_doc: agents/skills/algorithm-proof-exploration.md
    shim: .agents/skills/algorithm-proof-exploration/SKILL.md
  - id: algorithm-flowchart
    purpose: Render AST-derived Algorithm Expansion IR, LemmaGraph, and proof_status overlays into Mermaid block charts for algorithm/proof-state review.
    canonical_doc: agents/skills/algorithm-flowchart.md
    shim: .agents/skills/algorithm-flowchart/SKILL.md
  - id: research-workflow
    purpose: Manage the outer loop of question framing, external research, iterative changes, runs, and explicit review decisions.
    canonical_doc: agents/skills/research-workflow.md
    shim: .agents/skills/research-workflow/SKILL.md
  - id: comprehensive-development
    purpose: Run repo-wide integrated delivery across code, docs, tools, workflows, and runtime with explicit subagent routing.
    canonical_doc: agents/skills/comprehensive-development.md
    shim: .agents/skills/comprehensive-development/SKILL.md
  - id: environment-maintenance
    purpose: Update Docker, CI, dependencies, and runtime guidance coherently.
    canonical_doc: agents/skills/environment-maintenance.md
    shim: .agents/skills/environment-maintenance/SKILL.md
  - id: user-preference-sync
    purpose: Distill durable user preferences from notes into stable AGENTS.md guidance.
    canonical_doc: agents/skills/user-preference-sync.md
    shim: .agents/skills/user-preference-sync/SKILL.md
  - id: agent-learning
    purpose: Log agent-side working philosophy, interaction lessons, and task retrospectives with evidence.
    canonical_doc: agents/skills/agent-learning.md
    shim: .agents/skills/agent-learning/SKILL.md
