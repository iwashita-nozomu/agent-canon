version: 1
# @dependency-start
# contract registry
# responsibility Catalogs the complete public skill identity set and descriptions.
# upstream design code-visualization.md sole public visualization owner and typed projection contract
# downstream design ./skill-dependencies.yaml owns prerequisites, successors, order constraints, and parallel-independent relations
# downstream design ../canonical/CODEX_WORKFLOW.md consumes the skill catalog during task routing
# downstream implementation ../../tools/agent_tools/skill_route_catalog.py parses complete rule and capability metadata
# downstream implementation ../../tools/agent_tools/route.py consumes routing and dependency-derived skill order
# downstream implementation ../../tools/agent_tools/skill_tool_commands.py prints skill command packets with dependency-derived candidates
# downstream implementation ../../tools/agent_tools/check_agent_runtime_alignment.py validates public skill catalog consistency
# downstream implementation ../../tests/agent_tools/test_route.py tests canonical visualization capability routing
# @dependency-end

skill_families:
  # Public user-facing skill ids use plain hyphen-case. Runtime-internal skill
  # shims use .agents/skills/_<name>/SKILL.md and stay owner-routed.
  - id: agent-orchestration
    purpose: Mandatory routing skill for repository tasks; selects workflow family, skills, review roles, and runtime entrypoints before execution.
    canonical_doc: agents/skills/agent-orchestration.md
    shim: .agents/skills/agent-orchestration/SKILL.md
    discovery:
      name: agent-orchestration
      description: "Mandatory routing skill for repository tasks. Use before selecting workflow family, skills, review roles, subagents, model/team policy, runtime entrypoints, or run bundles for Codex routing."
    tool_commands:
      required:
      - python3 tools/agent_tools/check_execution_time_aware_orchestration.py --root .
      conditional:
      - python3 tools/agent_tools/search.py --query-file <request.txt> --providers text,semantic,vector,tool,header-deps,code-deps
        --format json
      - agent-canon structured-analysis document-inventory
      - python3 tools/agent_tools/route.py --prompt "<user request>" --format json
      - python3 tools/agent_tools/check_convention_compliance.py
      - agent-canon docs
      - make agent-canon-ensure-latest
      maintenance:
      - python3 tools/agent_tools/check_skill_frontmatter.py --root .
      - python3 tools/agent_tools/skill_tool_commands.py check
    routing:
      stage_policy: active
      reason: workflow, skill, subagent, or stage routing is part of the request
      triggers:
        - ["どのスキル"]
        - ["どのskill"]
        - ["スキル選択"]
        - ["skill selection"]
        - ["routing", "skill"]
        - ["ルーティング", "スキル"]
        - ["マルチエージェント"]
        - ["サブエージェント", "起動"]
        - ["subagent", "routing"]
        - ["workflow=", "skills="]
        - ["根本", "設計", "見直"]
  - id: repo-onboarding
    purpose: Fast safe entry path for an unfamiliar repository or subdirectory.
    canonical_doc: agents/skills/repo-onboarding.md
    shim: .agents/skills/repo-onboarding/SKILL.md
    discovery:
      name: repo-onboarding
      description: "Use when entering an unfamiliar repository or subdirectory and you need the fastest safe path to the repo overview, commands, conventions, and agent canon."
