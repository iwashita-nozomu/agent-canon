    tool_commands:
      required: []
      conditional:
      - tools/bin/agent-canon docs check <changed-markdown-paths>
      - make agent-canon-ensure-latest
      - bash tools/sync_agent_canon.sh link-root
      - bash tools/sync_agent_canon.sh check
      - python3 tools/agent_tools/search.py --query-file <request-or-design-question.txt>
        --providers text,semantic,vector,tool,header-deps,code-deps --format json
      - python3 tools/agent_tools/check_solid_evidence.py --changed --evidence <oop-readability-report>
      - python3 tools/agent_tools/tool_rejection_preflight.py --root . <planned-edit-paths>
      - python3 tools/agent_tools/check_dependency_headers.py --changed
