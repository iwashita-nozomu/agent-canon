  - id: start-repository
    purpose: Start a repository from the template clone through the project-owned source-free bootstrap.
    canonical_doc: agents/skills/start-repository.md
    shim: .agents/skills/start-repository/SKILL.md
    discovery:
      name: start-repository
      description: "Use when starting a repository from this template after clone, including project identity setup, source-free static-seed validation, and destination-remote setup without live AgentCanon integration."
    tool_commands:
      required: []
      conditional:
      - git clone <template> <new-project>
      - git status --short --branch
      - bash scripts/start_repository.sh --project-slug <slug> --display-name "<name>"
      - bash scripts/start_repository.sh --validate-only
      maintenance:
      - python3 tools/agent_tools/check_skill_frontmatter.py --root .
      - python3 tools/agent_tools/skill_tool_commands.py check
  - id: codex-task-workflow
    purpose: Execute repository tasks with a context-independent Codex flow.
    canonical_doc: agents/skills/codex-task-workflow.md
    shim: .agents/skills/codex-task-workflow/SKILL.md
    discovery:
      name: codex-task-workflow
      description: "Use when Codex needs a context-independent execution path for a repository task, from intake and workflow selection through artifact placement, implementation, validation, and closeout."
    tool_commands:
      required: []
      conditional:
      - tools/bin/agent-canon docs check <changed-markdown-paths>
      - make agent-canon-ensure-latest
      - PYTHONPATH=vendor/agent-canon/tools:tools python3 -m agent_tools.agent_canon_source_root exec tools/sync_agent_canon.sh link-root
      - PYTHONPATH=vendor/agent-canon/tools:tools python3 -m agent_tools.agent_canon_source_root exec tools/sync_agent_canon.sh check
      - python3 tools/agent_tools/search.py --query-file <request-or-design-question.txt>
        --providers text,semantic,vector,tool,header-deps,code-deps --format json
      - python3 tools/agent_tools/check_solid_evidence.py --changed --evidence <oop-readability-report>
      - python3 tools/agent_tools/tool_rejection_preflight.py --root . <planned-edit-paths>
      - python3 tools/agent_tools/check_dependency_headers.py --changed
      - bash tools/agent_tools/scan_dependency_headers.sh --changed --fail-missing
      - bash tools/agent_tools/check_dependency_header_format.sh --changed --require-header
      - bash tools/agent_tools/check_dependency_graph.sh --print-edges
      - python3 tools/agent_tools/check_convention_compliance.py
      - python3 tools/agent_tools/bootstrap_agent_run.py ... --task-id <T*>
      maintenance:
      - python3 tools/agent_tools/check_skill_frontmatter.py --root .
      - python3 tools/agent_tools/skill_tool_commands.py check
