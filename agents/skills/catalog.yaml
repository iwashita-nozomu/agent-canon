      required: []
      conditional:
      - python3 tools/agent_tools/route.py --prompt "<user request>" --format json
      maintenance:
      - python3 tools/agent_tools/check_skill_frontmatter.py --root .
      - python3 tools/agent_tools/skill_tool_commands.py check
  - id: task-routing
    purpose: Resolve long proposed tool or skill names into short routing areas and compact commands.
    canonical_doc: agents/skills/task-routing.md
    shim: .agents/skills/task-routing/SKILL.md
    discovery:
      name: task-routing
      description: "Use when choosing short AgentCanon tool, skill, profile, check, runtime, closeout, or evidence routes from long candidate names, broad workflow text, routing misses, over-constrained related-skill candidates, public/system skill delegation, skill splitting, or skill/tool routing refactors."
    tool_commands:
      required: []
      conditional:
      - python3 tools/agent_tools/route.py --name <candidate>
      - python3 tools/agent_tools/route.py --prompt "<user request>" --format json
      - python3 tools/agent_tools/route.py --area <area> --changed <paths...>
      - python3 tools/agent_tools/route.py --prompt
      - python3 tools/agent_tools/route.py --area checks --changed <path>
      - python3 tools/agent_tools/route.py --name profile_surface_resolver.py
      - python3 tools/agent_tools/skill_dependency_map.py check --root .
      maintenance:
      - python3 tools/agent_tools/check_skill_frontmatter.py --root .
      - python3 tools/agent_tools/skill_tool_commands.py check
