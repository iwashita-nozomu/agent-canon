# @dependency-start
# contract registry
# responsibility Maps task identifiers to workflow and review defaults.
# upstream design skills/agent-orchestration.md execution-time-aware work-conservation owner
# downstream design canonical/CODEX_WORKFLOW.md workflow consumes task routing catalog
# downstream design canonical/CODEX_SUBAGENTS.md Codex subagent inventory consumes task routing
# downstream design ../templates/agents/schedule.md execution-time-aware schedule projection
# downstream implementation ../.codex/config.toml Codex runtime config consumes task routing
# @dependency-end
version: 2

# Positive workflow activation is resolved from the typed family and topology
# records below.  Consumers must not infer a family, stage, or child from
# prompt prose; authority and safety prohibitions remain with their canonical
# workflow/authority owners.
workflow_activation_policy:
  family_selector: tasks[].family
  stage_owner: role_topology_defaults.stage_waves
  required_role_owner: workflow_families[].roles
  child_handoff:
    activation: selected_typed_route
    required_role_owner: workflow_families[].roles
    write_capable: true
  full_staging:
    activation: selected_coordination_route
    coordination_families:
      - comprehensive_development

review_activation_policy:
  mode: candidate_only
  owner_gate_cardinality: one_gate_per_replaceable_responsibility
  review_dispatch_owner: change_reviewer
  domain_validators:
    - python_reviewer
    - cpp_reviewer
  domain_validator_mode: bounded_claims_only
  specialist_activation: distinct_unresolved_claim_or_risk_only
  task_default_specialists: candidate_only
  default_review_packs: candidate_only
  test_design:
    activation: post_implementation_unresolved_oracle_or_failure_risk_only
    test_plan_required: only_when_activation_required
    existing_tests: evidence_not_first_edit_surface
    checker_owned_properties: route_to_static_or_deterministic_checker
    private_helpers_and_incidental_apis: do_not_freeze
  review_finding_rework:
    initial_review: one_per_candidate_epoch_with_stable_blocking_finding_ids
    focused_recheck: addressed_blockers_and_invalidated_evidence_only
    rework_when: stable_blocker_closure_or_typed_new_epoch_evidence
    record_without_new_wave: advisory_duplicate_stylistic_already_covered_or_evidence_free
    same_state_action: non_convergent_cycle
  validation:
    owner_ref: "agents/skills/agent-orchestration.md#Write-Capable Handoff Validation Trust Boundary"
    route_source: parent_packet.validation_route
    order: static_then_targeted
    full_suite_or_remote_ci: see_owner_ref
  artifacts:
    empty_reviewer_or_template_files: do_not_materialize
    selected_outputs_only: true

execution_time_policy:
  owner_ref: "agents/skills/agent-orchestration.md#Execution-Time-Aware Work-Conservation Contract"
  applies_to: repo-changing execution
  projection: templates/agents/schedule.md#Execution-Time-Aware Plan
  graph_activation: only_when_selected_ordering_or_collision_edges_exist
  graph_scope: selected_dependency_and_collision_edges_only
  executable_fields:
    - dependency_dag
    - responsibility_completeness
    - correctness
    - decision_relevant_total_work
    - makespan_objective
    - critical_path
    - ready_set
    - context_reuse
    - affected_evidence_invalidation
    - candidate_epoch
    - blocking_finding_ids
    - focused_recheck
    - terminal_state

role_topology_defaults: &standard_role_topology
  capacity_derivation: declared_team_peak_plus_nested_reservations_v1
  role_families:
    intake:
      - requirements_organizer
      - explorer
      - execution_planner
    planning:
      - execution_planner
      - plan_reviewer
    design:
      - detailed_designer
      - detailed_design_reviewer
      - document_flow_reviewer
    implementation:
      - worker
      - spark_worker
    integration:
      - integration_executor
    publication:
      - publisher
    test_design:
      - test_designer
    review:
      - python_reviewer
      - cpp_reviewer
      - diff_triage_reviewer
      - mathematical_correctness_reviewer
      - reviewer
      - ship_reviewer
    perspective_review:
      - reproducibility_reviewer
      - artifact_reviewer
      - benchmark_reviewer
      - fair_data_reviewer
      - ml_science_reviewer
      - scientific_computing_reviewer
    cross_cutting:
      - terra
    skill_evaluation:
      - skill_evaluator
  same_role_parallel_instances:
    status: allowed_with_distinct_packets
    identity_key: role_id+instance_id+agent_type
    read_only: allowed_when_input_packets_or_review_focus_are_distinct
    write_capable: allowed_only_for_worker_spark_worker_integration_executor
    current_checkout_parallel_requirements: disjoint_paths+no_shared_git_index_or_head+no_generated_or_formatter_effects
    collision_policy: reject_same_checkout_root_before_spawn
    isolated_worktree_policy: explicit_alternative_implementation_experiment_only
    runtime_threads_are_cardinality_source: false
  stage_waves:
    - id: intake
      stage_class: producer
      role_ids:
        - manager
    - id: skill_evaluation
      stage_class: producer
      role_ids:
        - skill_evaluator
    - id: intake_review
      stage_class: reviewer
      role_ids:
        - manager_reviewer
    - id: mathematical_intent_review
      stage_class: reviewer
      activation: conditional_math_intent_packet
      role_ids:
        - mathematical_correctness_reviewer
    - id: research
      stage_class: producer
      role_ids:
        - researcher
    - id: research_review
      stage_class: reviewer
      role_ids:
        - research_reviewer
        - reproducibility_reviewer
        - scientific_computing_reviewer
        - benchmark_reviewer
        - artifact_reviewer
        - fair_data_reviewer
        - ml_science_reviewer
    - id: scheduling
      stage_class: producer
      role_ids:
        - scheduler
    - id: schedule_review
      stage_class: reviewer
      role_ids:
        - schedule_reviewer
    - id: platform_planning
      stage_class: producer
      role_ids:
        - infra_steward
    - id: platform_review
      stage_class: reviewer
      role_ids:
        - infra_reviewer
    - id: integration_assessment
      stage_class: reviewer
      role_ids:
        - project_reviewer
        - docs_workflow_steward
        - prompt_config_reviewer
    - id: cross_owner_integration
      stage_class: reviewer
      activation: conditional_cross_owner_evidence
      role_ids:
        - terra
    - id: design
      stage_class: producer
      role_ids:
        - designer
    - id: design_review
      stage_class: reviewer
      role_ids:
        - design_reviewer
    - id: document_flow_review
      stage_class: reviewer
      role_ids:
        - document_flow_reviewer
        - citation_evidence_reviewer
        - notation_definition_reviewer
        - logic_gap_reviewer
    - id: experiment
      stage_class: producer
      role_ids:
        - experimenter
    - id: experiment_review
      stage_class: reviewer
      role_ids:
        - experiment_reviewer
        - report_reviewer
    - id: implementation
      stage_class: producer
      role_ids:
        - implementer
    - id: integration
      stage_class: producer
      role_ids:
        - integration_executor
    - id: publication
      stage_class: final
      role_ids:
        - publisher
    - id: test_design
      stage_class: reviewer
      role_ids:
        - test_designer
    - id: implementation_review
      stage_class: reviewer
      role_ids:
        - change_reviewer
        - python_reviewer
        - cpp_reviewer
      owner_gate: change_reviewer
      domain_validators_are_bounded: true
    - id: final_review
      stage_class: final
      role_ids:
        - final_reviewer
    - id: verification_closeout
      stage_class: final
      role_ids:
        - verifier
        - auditor

math_intent_routes:
  mathematical_correction:
    id: mathematical_correction
    requires_math_intent: true
    activation: mathematical_or_numerical_correction_evidence
    owner_skill: computational-optimization
    reviewer: mathematical_correctness_reviewer
    required_packet: mathematical_intent_packet
    precedes: [design, benchmark_reviewer]

workflow_families:
  - id: owner_bounded_change
    name: Owner-Bounded Change
    subagent_prompt:
      purpose: Prompt packet for owner-bounded fixes whose replaceable unit, local validation route, and external public API/behavior/schema unchanged readback are already evidenced.
      prompt_preamble:
        - Treat this as an owner-bounded fix only while `external public API/behavior/schema unchanged`; route every public-surface addition, contraction, removal, rename, restriction, deprecation, or semantic change to `scoped_change` or a broader route and form `dependency/consumer/migration/docs closure`.
        - Start from the structured handoff; use user_request_contract.md, schedule.md, and team_manifest.yaml only when the selected coordination or resumption route materializes them.
        - Include request_clause_ids, expected artifact path, parent-assigned write scope, the exact parent-assigned validation commands, and next review gate in every handoff; those commands are the closed trust boundary defined by `agents/skills/agent-orchestration.md#Write-Capable Handoff Validation Trust Boundary`.
        - For code split/extraction or a missing suspected predecessor, the splitter must investigate a shared current+historical asset universe before decomposition/prototyping. Carry known asset paths, dispositions, reasons, and test paths through the existing reuse_survey; historical refs are required for those cases, but absent advisory context must not block dispatch or writing.
      workflow_focus:
        - Treat catalog intake roles, `worker`, `explorer`, language-specific reviewers, and review packs as candidates. For semantic deltas, reference the run-local semantic_responsibility_contract.toml from the active design packet and allocate one action plus obligation owners before implementation. Activate only the owner-critical implementation route or a distinct unresolved claim/risk. Add `test_designer` only after the owning mechanism is established or repaired and an unresolved oracle/specification/regression/failure-mode risk remains outside static analysis, checkers, and targeted validation; select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>` recorded in stdout and the manifest.
        - Keep this route only when the run's abstract responsibility frame derives a bounded implementation slice with public interface unchanged, meaning `external public API/behavior/schema unchanged`, no dependency change, no specification interpretation, and local validation. File count and nearby ownership are not enough to select or keep this route.
        - Activate design, document-flow, and broad review only when an unresolved owner/design/reader-facing claim requires it. A produced design artifact does not by itself create a separate review wave; one owning review gate may cover the responsibility.
        - Escalate to `scoped_change` when any external public API, behavior, or schema delta exists, the owner boundary is non-obvious, validation is cross-module, or the diff-triage reviewer returns escalate; public deltas carry `dependency/consumer/migration/docs closure` into scope.
        - Begin applicable writer prompts from known selected assets and tests, propagate the same context to every child, and consolidate overlapping responsibility/asset slices before child prompts.
      reviewer_prompt:
        - Prefer language-specific and diff-triage findings before broad review.
        - Block completion if public-surface invariance is missing, validation is missing, request clauses are not mapped, or write scope expanded beyond the owner-bounded route.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - implementer
        - verifier
        - auditor
      specialists:
        - change_reviewer
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - docs_workflow_steward
        - terra
    tasks:
      - T1
      - T2

  - id: scoped_change
    name: Scoped Change
    subagent_prompt:
      purpose: Prompt packet for owner-bounded repo changes whose selected owner gate needs more than the local route.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point; do not route work to another repository unless the parent explicitly says so.
        - Start from the structured handoff; use the run bundle, user_request_contract.md, schedule.md, and team_manifest.yaml only when selected coordination or resumption requires them.
        - Include request_clause_ids, expected artifact path, parent-assigned write scope, the exact parent-assigned validation commands, and next review gate in every handoff; those commands are the closed trust boundary defined by `agents/skills/agent-orchestration.md#Write-Capable Handoff Validation Trust Boundary`.
        - For code split/extraction or a missing suspected predecessor, the splitter must investigate a shared current+historical asset universe before decomposition/prototyping. Carry known asset paths, capabilities, dispositions, reasons, and test paths through the existing reuse_survey; historical refs are mandatory for those cases, but absent advisory context must not block dispatch or writing.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Keep the diff tied to the assigned responsibility boundary. Test design is a conditional post-implementation stage, not a default pre-implementation gate; activate it only when an explicit unresolved oracle, specification, regression, or failure-mode risk remains outside static analysis, checkers, and targeted validation.
        - When fix-surface selection is non-obvious, run hypothesis-validation workflow before implementation.
        - Prefer existing names, helpers, tests, and docs over new surfaces; record why reuse is insufficient before proposing new files.
        - Begin the worker prompt from known selected assets and tests, propagate the same context to every child, and merge slices that touch the same asset.
        - Treat one fix, chunk, or checkpoint as internal progress until every active clause and planned work unit is complete.
      reviewer_prompt:
        - Verify behavior, tests, docs, and request-clause coverage rather than only checking style.
        - Rework only findings that change requested behavior, owner/design boundary, correctness, validation, or publication state. Record duplicate, stylistic, already-covered, or evidence-free findings without opening a new wave; block completion only when an active claim remains unvalidated or unresolved.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - scheduler
        - schedule_reviewer
        - docs_workflow_steward
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - terra
    tasks:
      - T3

  - id: research_driven_change
    name: Research-Driven Change
    subagent_prompt:
      purpose: Prompt packet for research-backed implementation, experiment, benchmark, report, and academic-writing tasks.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point; external sources inform the work but do not replace repo-local artifacts.
        - Emit the skill call sequence with literature-survey before research-workflow when primary sources, prior art, official docs, or source-backed implementation claims are used; carry the source packet and adoption/exclusion decisions into design, implementation, benchmark, and report handoffs.
        - Start from the structured handoff; use the run bundle, user_request_contract.md, schedule.md, research_notes.md, cited sources, and team_manifest.yaml only when the selected research or coordination route requires them.
        - Separate correctness evidence, performance evidence, and reporting claims in the handoff.
        - When mathematical or numerical correction evidence is present, resolve the canonical math_intent_route ID `mathematical_correction` before generic design, benchmark, or scientific-computing review, then create the computational-optimization math-intent packet. The packet must bind math_object/problem, variables/domains/units, objective/residual, constraints, equations/definitions, assumptions/approximations, derivation, iteration_map/update_map, invariants/limits/stopping_scalar/failure_semantics, equation_to_code_map, mathematical_definition_paths, mathematical_oracle_paths, mathematical_documentation_paths, math_oracle/counterexample, mapped allowed write paths equal to that union, forbidden non-math surfaces, and separate handoff targets.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Use primary sources or official docs for external claims, and record search terms, source class, limitations, and contradictory evidence.
        - Treat literature-survey as the source packet owner and research-workflow as the outer loop owner; do not let implementation, experiment, report, or follow-up branches close source-backed claims without source packet evidence, limitations, and adoption/exclusion decisions.
        - Use hypothesis-validation workflow when analysis must decide the code or document surface to modify before the experiment or implementation slice.
        - Keep experiment protocol, code change, runtime flag change, and report interpretation separated unless one explicit clause authorizes combining them.
        - Preserve provenance: commands, seeds, environment, raw result paths, and rerun instructions.
      reviewer_prompt:
        - Block overclaims, spot/debug/partial evidence used as formal evidence, missing baselines, and missing reproducibility artifacts.
        - For paper-like work, split citation/evidence, notation, logic, and document-flow review only when each is a distinct unresolved claim; otherwise one owning review gate may cover the responsibility.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - researcher
        - research_reviewer
        - scheduler
        - schedule_reviewer
        - report_reviewer
        - mathematical_correctness_reviewer
        - citation_evidence_reviewer
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - notation_definition_reviewer
        - logic_gap_reviewer
        - experimenter
        - experiment_reviewer
        - reproducibility_reviewer
        - scientific_computing_reviewer
        - benchmark_reviewer
        - artifact_reviewer
        - fair_data_reviewer
        - ml_science_reviewer
        - terra
    tasks:
      - T4
      - T5
      - T9
      - T10

  - id: large_delivery
    name: Large Delivery
    subagent_prompt:
      purpose: Prompt packet for multi-surface delivery, new feature work, and large refactors.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point and keep durable product state in canonical current-tree paths only.
        - Start from the structured handoff; use the run bundle, user_request_contract.md, schedule.md, design_brief.md, and team_manifest.yaml only when selected coordination or resumption requires them.
        - Name the milestone, chunk, request_clause_ids, write scope, rollback point, and next gate in each handoff.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Define milestone and chunk boundaries before implementation; chunks are not user-facing completion.
        - Use hypothesis-validation workflow to justify the selected refactor or feature surface before moving code.
        - For refactors, require behavior contract, allowed structural delta, forbidden semantic delta, files to remove or move, and path mapping before editing.
        - For deletion/refactor handoffs, carry code-cleanup's line/block semantic and caller/dataflow mapping content itself; a completion claim without mapping content is insufficient, and filename, symbol, search hit, and diff size are not deletion proof.
        - Sweep stale references after renames or structure changes before closeout.
      reviewer_prompt:
        - Block hidden semantic changes, incomplete path mapping, stale docs, and parallel durable truth surfaces.
        - For cleanup reviews, follow code-cleanup's streaming route; do not demand speculative safety reimplementation or per-line validation.
        - Verify every chunk maps back to the umbrella completion boundary.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - scheduler
        - schedule_reviewer
        - test_designer
        - project_reviewer
        - docs_workflow_steward
        - python_reviewer
        - cpp_reviewer
        - terra
    tasks:
      - T6
      - T7

  - id: platform_and_environment
    name: Platform And Environment
    subagent_prompt:
      purpose: Prompt packet for Docker, CI, dependency, runtime, and development-environment changes.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point; environment changes must support the template workflow first.
        - Start from the structured handoff; use the run bundle, environment_change_proposal.md, user_request_contract.md, schedule.md, and team_manifest.yaml only when selected coordination or resumption requires them.
        - State the triggering code requirement, blocked command, source-of-truth surface, rollback path, and the exact parent-assigned validation commands in every handoff; those commands are the closed trust boundary defined by `agents/skills/agent-orchestration.md#Write-Capable Handoff Validation Trust Boundary`.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Prefer existing dependency surfaces and canonical environment helpers over ad hoc setup.
        - For a new or modified surface around an existing CLI, library, or toolchain, pass the existing reuse_survey provider comparison, exact provider input/output boundary, selected command/options, and exact gap to worker/reviewer; delegate covered phases and apply naming.md before handoff.
        - Do not create repo-local virtual environments on host runtime; use the canonical environment policy.
        - Keep Docker, CI, lock/dependency, and runtime-doc changes consistent.
      reviewer_prompt:
        - Block environment changes without a code requirement, rollback path, or validation evidence.
        - Require the existing reuse_survey provider comparison, exact provider input/output boundary, selected command/options, and exact gap; block provider-owned phase reimplementation and compound names under naming.md.
        - Verify docs, CI, Docker packs, and local developer commands remain aligned.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - infra_steward
        - infra_reviewer
        - scheduler
        - schedule_reviewer
        - docs_workflow_steward
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - terra
    tasks:
      - T8

  - id: comprehensive_development
    name: Comprehensive Development
    subagent_prompt:
      purpose: Prompt packet for repo-wide workflow, tooling, runtime, docs, and canon rearchitecture.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point and the integration reference for derived repos.
        - Start from the structured handoff; use the run bundle, user_request_contract.md, schedule.md, project_review.md, docs_workflow_review.md, and team_manifest.yaml only when selected coordination or resumption requires them.
        - Name all affected surfaces, request_clause_ids, canonical paths, expected validation, and next review gate in every handoff.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Review repo-wide integration risk through compact tool output, dependency-expanded path lists, and bounded canon slices; do not hand agents the whole repository as their read scope.
        - For AgentCanon tasks, classify whether the change is standalone AgentCanon source, template parent gitlink, root shared-surface sync, or derived repo proposal before editing.
        - For analysis-heavy changes, require separate code dependency and header dependency evidence before implementation selection; design prose remains a proposal until an owner receipt establishes correspondence.
        - Before decomposition, prototyping, or worker handoff, determine the involved Git-root/module count and whether a dependency-repository consumer exists. After that observation satisfies the cross-module condition, promote/activate deferred or candidate `dependency-analysis` to ACTIVE and run it before decomposition, prototyping, or worker handoff; populate the existing dependency DAG, dependency scope / reuse facts, repair batches, involved-root identities, edge kinds, topological order, and common validation obligations, then relay that same shared context to every child. Derive each child role / module's `allowed_paths`, `do_not_read`, write scope, and exact validation commands from the shared context; do not copy one child's authority to another. A standalone single-module task keeps the existing fast path; this is not a machine gate.
        - Update docs, tests, runtime helpers, skill shims, mirrors, and validation tools together when the behavior crosses those surfaces.
        - Use `prompt_config_reviewer` before editing prompt, routing, or subagent-config policy surfaces.
        - Preserve parent-managed write-scope discipline; concurrent write-capable agents require disjoint paths in the current checkout, and colliding writers must be serialized into later waves instead of moved to separate worktrees.
      reviewer_prompt:
        - Block changes that work only for the touched diff but leave task catalog, starter tools, mirrors, docs, tests, or runtime validation stale.
        - Verify all workflow families and task ids still bootstrap with usable prompt, packet, role, and validation metadata.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - scheduler
        - schedule_reviewer
        - researcher
        - research_reviewer
        - infra_steward
        - infra_reviewer
        - project_reviewer
        - docs_workflow_steward
        - prompt_config_reviewer
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - report_reviewer
        - terra
    tasks:
      - T11
      - T12

  - id: adaptive_improvement_loop
    name: Adaptive Improvement Loop
    subagent_prompt:
      purpose: Prompt packet for backlog-driven tuning, exploration, and repeated experiment-backed improvement.
      prompt_preamble:
        - Treat this template repository as the default implementation starting point; each improvement pass must still be a traceable waterfall slice.
        - Start from the structured handoff; use the run bundle, backlog or decision-state artifact, user_request_contract.md, schedule.md, and team_manifest.yaml only when selected coordination or resumption requires them.
        - State backlog item, hypothesis, run protocol, success metric, stopping rule, and next decision gate in every handoff.
      workflow_focus:
        - Follow `.codex/agents/*.toml` model and reasoning settings. Use the one physical agent selected for each evidenced decision; keep mini roles on bounded exploration, execution, and skill evaluation, use `worker` by default, and select `spark_worker` only through `--select-agent-type implementer=spark_worker:<evidence>`. Review roles provide hypotheses; owner-local receipts establish correspondence, while the parent owns transport, integration, and remote readback without approval authority.
        - Treat a bounded implementation slice as Spark-eligible only when it is derived from the Abstract Design Frame and design trace, one file or one abstraction unit, public interface unchanged, no dependency change, no specification interpretation, and locally testable.
        - Keep the adaptive outer loop separate from one implementation slice; one iteration is not whole-loop completion.
        - Do not mix code change, experiment protocol change, runtime flag change, and claim/report rewrite in one iteration without an explicit clause.
        - Promote only validated lessons into notes or memory; keep failed attempts traceable.
      reviewer_prompt:
        - Block progress claims from spot runs, partial runs, raw failure counts, or unreviewed protocol changes.
        - Verify the backlog, decision state, reproducibility evidence, and carry-over notes are current.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on:
        - manager
        - designer
        - implementer
        - verifier
        - auditor
      specialists:
        - manager_reviewer
        - design_reviewer
        - document_flow_reviewer
        - change_reviewer
        - final_reviewer
        - researcher
        - research_reviewer
        - scheduler
        - schedule_reviewer
        - experimenter
        - experiment_reviewer
        - report_reviewer
        - test_designer
        - python_reviewer
        - cpp_reviewer
        - reproducibility_reviewer
        - scientific_computing_reviewer
        - benchmark_reviewer
        - artifact_reviewer
        - fair_data_reviewer
        - ml_science_reviewer
        - terra
    tasks:
      - T13

  - id: skill_evaluation
    name: Skill Evaluation
    subagent_prompt:
      purpose: Prompt packet for explicit empirical skill evaluation with a fresh, read-only evaluator.
      prompt_preamble:
        - Treat this as an evaluation-only route for one explicit frozen Scenario Packet.
        - The parent derives the frozen Scenario Packet from run-local workflow evidence; keep that run bundle, user_request_contract.md, schedule.md, team_manifest.yaml, prior answers, and prior reports outside evaluator context.
        - The evaluator starts only from the frozen Scenario Packet and its explicit read allowlist.
        - Do not materialize implementation or reviewer roles unless the parent packet separately enables them.
      workflow_focus:
        - Materialize the catalog-owned initial skill_evaluation stage with skill_evaluator only.
        - Keep skill_evaluator fresh, read-only, artifact-only, and scoped to the packet-listed scenario.
        - The parent owns the standard run-coordination and closeout artifacts, scoring, iteration, convergence, and any implementation follow-up; those artifacts remain outside evaluator context.
      reviewer_prompt:
        - Verify that the evaluation route has no default worker, spark_worker, or reviewer wave.
        - Verify that the evaluator model and read-only/fresh policy remain unchanged.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on: []
      specialists:
        - skill_evaluator
    tasks:
      - T14

  - id: issue_worker_publication
    name: IssueWorker Publication
    logical_route: issue_worker
    execution_role: publisher
    subagent_prompt:
      purpose: Prompt packet for explicit repository-owned feedback publication and related Issue reorganization.
      prompt_preamble:
        - Consume only an explicit IssueWorker candidate and the #938 checkout identity readback; counts, status rows, and selection misses are not candidates.
        - Route same-repository candidates to the logical IssueWorker path executed by publisher. Route other repositories as qualified no-mutation handoffs.
        - Keep same-repository evidence gaps in publisher investigation; they may produce need verification and must not be silently discarded.
      dispatch_route: tools/agent/orchestration/agent_team.py#dispatch_issue_worker
      execution_role: publisher
      tool_call_route: tools/agent/orchestration/tool_calls.py#materialize_issue_worker_tool_call
      workflow_focus:
        - Read open and closed related Issues, narrow mixed responsibility, transfer clauses and backlinks, and mutate only when the selected responsibility requires it.
        - Read back every affected Issue URL, number, body, and state. Do not request an extra approval gate or create a local Issue database.
      reviewer_prompt:
        - Verify the candidate boundary, repository routing, no-mutation foreign-repository handoff, and idempotent update/no-op behavior.
    capacity_request:
      schema_id: task_catalog_capacity_request_v1
      policy_id: topology_derived_v1
      topology_source: role_topology
      write_scope_source: team_manifest.run.write_scopes
      capacity_policy_ref: agents/capacity_policy.toml
      target_state_gate_ref: implementation_execution_contract_v1
    role_topology: *standard_role_topology
    roles:
      always_on: []
      specialists:
        - publisher
    tasks:
      - T15

