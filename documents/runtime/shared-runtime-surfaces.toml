# @dependency-start
# contract reference
# responsibility Defines machine-readable AgentCanon root runtime surface ownership.
# upstream design ./SHARED_RUNTIME_SURFACES.md shared runtime surface policy
# upstream design ../experiments/gpu-admission-r5-source-packet.md devcontainer identity ownership
# downstream implementation ../../tools/agent_tools/surface_manifest.py parses this manifest
# downstream implementation ../../tools/sync_agent_canon.sh consumes link and copy specs
# @dependency-end

version = 1
prefix = "vendor/agent-canon"

[[surface]]
path = "AGENTS.md"
mode = "symlink"
source = "ROOT_AGENTS.md"
owner = "agent-canon"
class = "runtime_surface"

[[surface]]
path = "documents/design/codex-spark-implementation-routing.md"
mode = "symlink"
source = "documents/design/codex-spark-implementation-routing.md"
owner = "agent-canon"
class = "runtime_surface"

[[group]]
mode = "symlink"
owner = "agent-canon"
class = "runtime_surface"
# .devcontainer は親側の実体ディレクトリです。
# bootstrap, finalize, compose, attach は親側 wrapper で保持し、
# AgentCanon 側は個別ファイルで差分管理します。
paths = [
  "agents",
  ".agents",
  ".codex/config.toml",
  ".codex/README.md",
  ".codex/agents",
  ".codex/hooks.json",
  ".codex/hooks",
  ".github/AGENTS.md",
  "tools",
]

[[surface]]
path = ".devcontainer"
mode = "regular"
owner = "template-or-derived-repo"
class = "active_contract"
local_override_allowed = true
source = ".devcontainer"

[[surface]]
path = ".devcontainer/devcontainer.json"
mode = "symlink"
owner = "agent-canon"
class = "runtime_surface"

[[surface]]
path = ".vscode"
mode = "regular"
owner = "template-or-derived-repo"
class = "active_contract"
local_override_allowed = true
source = ".vscode"

