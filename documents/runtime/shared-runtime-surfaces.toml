# @dependency-start
# contract reference
# responsibility Defines the minimal AgentCanon root projection mechanics.
# upstream design ./SHARED_RUNTIME_SURFACES.md shared root projection policy
# downstream implementation ../../tools/agent_tools/surface_manifest.py parses this manifest
# downstream implementation ../../tools/sync_agent_canon.sh consumes link and retired-path specs
# @dependency-end

version = 1
prefix = "vendor/agent-canon"

# The parent root exposes only the instruction entrypoint, Codex config, and
# the AgentCanon CLI/tool namespace.  The source tree itself remains under the
# vendor prefix; this manifest is not a second ownership map.
[[surface]]
path = "AGENTS.md"
mode = "symlink"
source = "ROOT_AGENTS.md"
projection_producer = "agent-canon"
projection_kind = "runtime_surface"
local_override_allowed = false

[[surface]]
path = ".codex/config.toml"
mode = "symlink"
source = ".codex/config.toml"
projection_producer = "agent-canon"
projection_kind = "runtime_surface"
local_override_allowed = false

[[surface]]
path = "tools/agent-canon"
mode = "symlink"
source = "tools"
projection_producer = "agent-canon"
projection_kind = "runtime_surface"
local_override_allowed = false

# Optional transaction state is created by the update lifecycle only when a
# parent explicitly selects that route.  It is never materialized as a shared
# root mirror by link-root.
[[surface]]
path = ".agent-canon"
mode = "repo_state"
projection_producer = "agent-canon-update"
projection_kind = "transaction_state"
optional = true
local_override_allowed = false

# Retired root views are removed only when the parent path is still a symlink
# (or a known generated copy).  Parent-owned regular content is preserved by
# sync_agent_canon.sh.
[[group]]
mode = "removed_legacy"
projection_producer = "legacy"
projection_kind = "removed_legacy"
paths = [
  ".agents",
  "agents",
  ".codex/README.md",
  ".codex/agents",
  ".codex/hooks.json",
  ".codex/hooks",
  ".devcontainer/devcontainer.json",
  ".devcontainer/gpu-admission",
  ".devcontainer/rootless",
  ".vscode",
  "evidence",
  "memory",
  "notes",
  "tests",
  ".github/AGENTS.md",
  ".github/workflows/agent-coordination.yml",
  ".github/workflows/agent-improvement-guide.yml",
  ".github/ISSUE_TEMPLATE/config.yml",
  ".github/ISSUE_TEMPLATE/agentcanon-maintenance.yml",
  ".github/ISSUE_TEMPLATE/eval-capture.yml",
  ".github/PULL_REQUEST_TEMPLATE/agent_canon.md",
  ".github/scripts/checkout_agent_canon_submodule.sh",
]
