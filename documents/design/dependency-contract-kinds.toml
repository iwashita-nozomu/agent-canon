# @dependency-start
# contract registry
# responsibility Registers dependency header contract kinds and changed-file header surfaces.
# upstream design dependency-manifest-design.md dependency manifest DSL design
# downstream implementation ../../tools/validation/semantic/dependencies/check_dependency_headers.py validates changed-file contract kinds and surface selection
# downstream implementation ../../tools/validation/semantic/dependencies/check_dependency_header_format.sh validates registered contract kinds
# downstream implementation ../../tools/analysis/dependencies/scan_dependency_headers.sh scans the same dependency-owned surfaces
# @dependency-end

schema = "agent_canon.dependency_contract_kinds.v1"

# Header-required paths are a dependency-policy relation, not repository path
# ownership. Keep this selection beside the dependency contract registry so
# responsibility-scope.toml remains the sole path -> owner/class relation.
header_surfaces = [
  "AGENTS.md",
  "ROOT_AGENTS.md",
  "responsibility-scope.toml",
  "agent-canon-environment.toml",
  "agents/canonical/**",
  "agents/workflows/README.md",
  "agents/workflows/workflow-references.md",
  "documents/design/**",
  "documents/runtime/**",
  "tools/agent/**",
  "tools/validation/**",
  "tools/runtime/dispatch/**",
  ".devcontainer/**",
  ".github/workflows/**",
  ".github/scripts/**",
]

allowed_kinds = [
  "agent-runtime",
  "configuration",
  "data",
  "design",
  "environment",
  "implementation",
  "issue",
  "policy",
  "reference",
  "registry",
  "report",
  "review",
  "skill",
  "template",
  "test",
  "tool",
  "workflow",
]
