version = 2
selection_order = ["current-parent-environment-owner", "current-parent-entrypoint", "configured-runtime-pack-image-tag"]
past_summary_is_authority = false

[required_readback]
fields = ["image_tag", "image_presence"]

[failure]
missing_image = "build_with_normal_cache"

[ordinary_run]
container_cleanup = "rm"
shared_image_cleanup = "none"
image_selection_owner = "caller-configured-runtime-pack"
same_dockerfile_is_not_identity = true
