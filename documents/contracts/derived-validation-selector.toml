version = 1
path_encoding = "nul-delimited"
selection = "ordered-union"
deterministic = true
monotone_on_valid_inputs = true

[fail_closed]
reasons = ["empty_input", "invalid_path", "unknown_path", "unreadable_input", "routing_owner_changed"]
use_consumer_fallback = true

[ownership]
agentcanon_owns_algorithm = true
consumer_owns_validator_ids = true
consumer_owns_patterns = true
consumer_owns_commands = true
