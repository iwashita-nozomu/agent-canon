# @dependency-start
# contract reference
# responsibility Maps canonical tools to same-named explanatory documents and
# owns their public/internal/compat/retired/example classification.
# upstream design README.md tool documentation placement policy
# upstream design ../../tools/catalog.yaml structured AgentCanon tool catalog
# upstream design visualization_contract.md canonical visualization contract/checker documentation
# downstream implementation ../../tools/runtime/manifest/tool_catalog.py validates one-to-one tool docs
# downstream implementation ../../tests/agent_tools/test_tool_catalog.py validates visualization tool-doc registration
# @dependency-end

catalog_kind = "agent_canon_tool_docs"
version = 1
# This is the sole tool-surface classification owner.  `public` rows must
# match catalog entries carrying `public: true`; the other values document
# why a referenced tool is not part of that public set.
classification_values = ["public", "internal", "compat", "retired", "example"]

