name: Issue 783 Runtime Inventory

on:
  push:
    branches:
      - fix/783-remove-agent-canon-runtime

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          output = root / ".agent-canon-runtime-inventory-783.txt"
          patterns = (
              "/var/lib/agent-canon/runtime",
              ".agent-canon/runtime",
              "AGENT_CANON_RUNTIME_ROOT",
              "AGENT_CANON_RUNTIME_ROUTE",
              "AGENT_CANON_SHARED_RUNTIME",
              "HOST_RUNTIME_ROOT",
              "CONTAINER_RUNTIME_ROOT",
              "shared-runtime",
              "shared_runtime",
              "finalize-shared-runtime",
              "MANAGED_CONTAINER",
          )
          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.decode().split("\0")
          tracked = [path for path in tracked if path]

          lines: list[str] = []
          lines.append("AgentCanonRuntime dependency inventory for #783")
          lines.append("base=" + subprocess.run(
              ["git", "rev-parse", "HEAD^"], check=True, capture_output=True, text=True
          ).stdout.strip())
          lines.append("")
          for pattern in patterns:
              lines.append(f"## literal: {pattern}")
              found = 0
              for relative in tracked:
                  path = root / relative
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if pattern in line:
                          lines.append(f"{relative}:{number}:{line}")
                          found += 1
              if not found:
                  lines.append("<none>")
              lines.append("")

          source_path = root / "tools/experiments/execution_resource_plan.py"
          source = source_path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          lines.append("## execution_resource_plan symbol map")
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  name = node.name
                  if re.search(r"runtime|receipt|reservation|lock", name, re.I):
                      end = getattr(node, "end_lineno", node.lineno)
                      lines.append(f"{name}:{node.lineno}-{end}")
          lines.append("")

          for relative in (
              ".devcontainer/generate-runtime-compose.sh",
              ".devcontainer/gpu-admission.sh",
              "tools/experiments/execution_resource_plan.py",
              "tools/experiments/gpu_command_admission.py",
              "tools/experiments/run_gpu_command.py",
              "tools/experiments/run_managed_experiment.py",
              "tools/ci/container_config.py",
              "tools/ci/container_runtime.py",
          ):
              path = root / relative
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              lines.append(f"## definitions/references: {relative}")
              for number, line in enumerate(text.splitlines(), 1):
                  if re.search(
                      r"runtime_root|runtime_route|shared.runtime|HOST_RUNTIME|CONTAINER_RUNTIME|LOCK_ROOT|receipt|gpu.admission",
                      line,
                      re.I,
                  ):
                      lines.append(f"{relative}:{number}:{line}")
              lines.append("")

          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Publish inventory commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue-783-runtime-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-canon-runtime-inventory-783.txt .github/workflows/issue-783-runtime-inventory.yml
          git commit -m "chore: record AgentCanonRuntime dependency closure (#783)"
          git push origin HEAD:fix/783-remove-agent-canon-runtime
