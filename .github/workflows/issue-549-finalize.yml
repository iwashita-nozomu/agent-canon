# @dependency-start
# contract configuration
# responsibility One-time branch finalizer for Issue #549; validates canonical ownership changes and deletes itself from the final tree.
# upstream design ../../documents/design/responsibility-scope-management.md canonical path ownership relation
# upstream design ../../documents/design/dependency-contract-kinds.toml dependency-owned header surface relation
# upstream implementation ../../tools/agent_tools/responsibility_scope.py validates total single-owner classification
# downstream implementation ../../tests/agent_tools/test_responsibility_scope.py focused ownership regression
# @dependency-end

name: Issue 549 Finalize

on:
  push:
    branches:
      - fix/549-path-ownership-boundary
    paths:
      - .github/workflows/issue-549-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-549-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused validation dependencies
        run: |
          python3 -m pip install --upgrade pyyaml tomli packaging pytest ruff pyright
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Assemble canonical sources and remove temporary surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-549-design.part-00 \
              .issue-549-design.part-01 \
              .issue-549-design.part-02 \
              .issue-549-design.part-03 \
            > documents/design/parent-repository-audit.md
          printf '%s  %s\n' \
            '11690482006b371a6c979307e4c0e78e443b2ea36da13ef59d46e17a7a89a8cf' \
            'documents/design/parent-repository-audit.md' | sha256sum --check --strict
          git rm .issue-549-design.part-00 \
                 .issue-549-design.part-01 \
                 .issue-549-design.part-02 \
                 .issue-549-design.part-03 \
                 .github/workflows/issue-549-finalize.yml
          git add documents/design/parent-repository-audit.md

      - name: Normalize ownership and dependency consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_section(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              target.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
              )

          replace_once(
              "tests/agent_tools/test_parent_repository_audit.py",
              "from parent_repository_audit import _load_units  # noqa: E402",
              "from parent_repository_audit import _load_units",
          )
          replace_once(
              "tests/agent_tools/test_parent_repository_audit.py",
              '"documents/parent-repository-audit/audit-unit/"\n'
              '                    "environment-containers.md"',
              '"documents/parent-repository-audit/audit-unit/'
              'environment-containers.md"',
          )
          replace_once(
              "tests/agent_tools/test_responsibility_scope.py",
              "from responsibility_scope import scope_covers, "
              "scope_from_mapping  # noqa: E402",
              "from responsibility_scope import scope_covers, scope_from_mapping",
          )
          replace_once(
              "tools/agent_tools/repo_structure_contract.py",
              'raise ValueError(f"missing profile list in structure contract: {path}")',
              'raise TypeError(f"missing profile list in structure contract: {path}")',
          )

          checker_path = "tools/agent_tools/check_dependency_headers.py"
          checker = Path(checker_path).read_text(encoding="utf-8")
          checker = checker.replace(
              'RESPONSIBILITY_SCOPE_MANIFEST = Path("responsibility-scope.toml")\n',
              "",
              1,
          )
          checker = checker.replace(
              "declared responsibility-scope surfaces",
              "declared dependency-contract surfaces",
          )
          Path(checker_path).write_text(checker, encoding="utf-8")
          replace_section(
              checker_path,
              "def declared_surface_patterns(root: Path) -> tuple[str, ...]:",
              "\n\ndef matches_declared_surface",
              '''def declared_surface_patterns(root: Path) -> tuple[str, ...]:
              """Read dependency-owned opt-in header surfaces from the existing registry."""
              registry = contract_registry_path(root)
              if not registry.is_file():
                  raise ValueError(
                      f"dependency contract registry is missing: {registry}; "
                      "restore dependency-contract-kinds.toml before using --changed or no-path mode"
                  )
              try:
                  raw = tomllib.loads(registry.read_text(encoding="utf-8"))
              except (OSError, ValueError) as error:
                  raise ValueError(
                      f"dependency contract registry is invalid: {registry}: {error}"
                  ) from error
              if raw.get("schema") != "agent_canon.dependency_contract_kinds.v1":
                  raise ValueError(
                      f"dependency contract registry has an unsupported schema: {registry}"
                  )
              values = raw.get("header_surfaces")
              if not isinstance(values, list) or not values:
                  raise ValueError(
                      f"dependency contract registry has no declared header surfaces: {registry}; "
                      "add a non-empty header_surfaces list"
                  )
              if any(not isinstance(value, str) or not value for value in values):
                  raise ValueError(
                      f"dependency contract registry contains an invalid header surface: {registry}; "
                      "each header_surfaces entry must be a non-empty string"
                  )
              return tuple(value for value in values if isinstance(value, str))
              ''',
          )

          shell_surface_loader = '''load_declared_surfaces() {
            local registry="${DEPENDENCY_CONTRACT_KIND_REGISTRY:-}"
            if [[ -z "$registry" && -f "$ROOT_DIR/documents/design/dependency-contract-kinds.toml" ]]; then
              registry="$ROOT_DIR/documents/design/dependency-contract-kinds.toml"
            elif [[ -z "$registry" && -f "$ROOT_DIR/vendor/agent-canon/documents/design/dependency-contract-kinds.toml" ]]; then
              registry="$ROOT_DIR/vendor/agent-canon/documents/design/dependency-contract-kinds.toml"
            elif [[ -z "$registry" ]]; then
              local script_path script_dir
              script_path="$(readlink -f "${BASH_SOURCE[0]}")"
              script_dir="$(cd "$(dirname "$script_path")" && pwd)"
              registry="$(realpath -m "$script_dir/../../documents/design/dependency-contract-kinds.toml")"
            fi
            [[ -f "$registry" ]] || return 0
            awk '\''
              /^header_surfaces[[:space:]]*=[[:space:]]*\[/ { in_block = 1; next }
              in_block && /^[[:space:]]*\]/ { exit }
              in_block {
                line = $0
                while (match(line, /"[^"]+"/)) {
                  print substr(line, RSTART + 1, RLENGTH - 2)
                  line = substr(line, RSTART + RLENGTH)
                }
              }
            '\'' "$registry"
          }
          '''
          for shell_path in (
              "tools/agent_tools/scan_dependency_headers.sh",
              "tools/agent_tools/check_dependency_header_format.sh",
          ):
              replace_section(
                  shell_path,
                  "load_declared_surfaces() {",
                  "mapfile -t DECLARED_SURFACES",
                  shell_surface_loader,
              )

          test_path = Path("tests/agent_tools/test_check_dependency_headers.py")
          test_text = test_path.read_text(encoding="utf-8")
          helper = '''

          def write_contract_registry(root: Path, declaration: str) -> None:
              """Write one dependency registry fixture with header selection and kinds."""
              registry = root / "documents" / "design" / "dependency-contract-kinds.toml"
              registry.parent.mkdir(parents=True, exist_ok=True)
              registry.write_text(
                  'schema = "agent_canon.dependency_contract_kinds.v1"\\n'
                  'allowed_kinds = ["tool"]\\n'
                  + declaration,
                  encoding="utf-8",
              )
          '''
          marker = "\n\nclass DependencyHeaderCheckTest"
          if "def write_contract_registry" not in test_text:
              test_text = test_text.replace(marker, helper + marker, 1)
          fixture = '''            (root / "responsibility-scope.toml").write_text(
                          'dependency_header_surfaces = ["scoped.py"]\\n', encoding="utf-8"
                      )'''
          replacement = '''            write_contract_registry(
                          root,
                          'header_surfaces = ["scoped.py"]\\n',
                      )'''
          if test_text.count(fixture) != 2:
              raise SystemExit("expected two dependency surface fixture replacements")
          test_text = test_text.replace(fixture, replacement)
          loop_fixture = '''                (root / "responsibility-scope.toml").write_text(
                              declaration, encoding="utf-8"
                          )'''
          if test_text.count(loop_fixture) != 1:
              raise SystemExit("expected one invalid registry fixture replacement")
          test_text = test_text.replace(
              loop_fixture,
              "                write_contract_registry(root, declaration)",
              1,
          )
          test_text = test_text.replace(
              "dependency_header_surfaces",
              "header_surfaces",
          )
          test_text = test_text.replace(
              "test_changed_mode_fails_closed_for_invalid_or_empty_scope",
              "test_changed_mode_fails_closed_for_invalid_or_empty_registry",
          )
          test_text = test_text.replace(
              "responsibility scope manifest",
              "dependency contract registry",
          )
          test_text = test_text.replace(
              "scope manifest",
              "dependency contract registry",
          )
          missing_registry_pattern = re.compile(
              r"    def test_changed_mode_fails_closed_without_scope_manifest\(self\) -> None:\n"
              r".*?(?=\n    def test_changed_mode_fails_closed_for_invalid_or_empty_registry)",
              re.DOTALL,
          )
          canonical_fallback_test = '''    def test_changed_mode_uses_canonical_registry_without_parent_copy(self) -> None:
              """Consume AgentCanon's dependency registry without mirroring it into a parent."""
              with tempfile.TemporaryDirectory() as tmp_dir:
                  root = Path(tmp_dir)
                  (root / ".git").mkdir()
                  changed = root / "tools" / "agent_tools" / "scoped.py"
                  changed.parent.mkdir(parents=True)
                  changed.write_text(
                      "# scoped\\n" + manifest(contract="tool"), encoding="utf-8"
                  )

                  result, output = self.run_main(
                      root,
                      ["--root", str(root), "--changed"],
                      changed=[changed],
                  )

                  self.assertEqual(result, 0, output)
                  self.assertIn("DEPENDENCY_HEADERS=pass", output)
          '''
          test_text, replacement_count = missing_registry_pattern.subn(
              canonical_fallback_test,
              test_text,
              count=1,
          )
          if replacement_count != 1:
              raise SystemExit("canonical registry fallback test replacement failed")
          test_path.write_text(test_text, encoding="utf-8")

          scope_doc = Path("documents/design/responsibility-scope-management.md")
          scope_text = scope_doc.read_text(encoding="utf-8")
          scope_marker = (
              "filesystem kind are separate facts and must be declared only in the structure\n"
              "contract.\n\n"
          )
          dependency_boundary = (
              "Dependency-header selection is a separate finite path relation owned by\n"
              "`documents/design/dependency-contract-kinds.toml`. It is consumed by the\n"
              "dependency-header tools and is not stored in the ownership manifest.\n\n"
          )
          if dependency_boundary not in scope_text:
              if scope_marker not in scope_text:
                  raise SystemExit("responsibility scope boundary insertion point missing")
              scope_text = scope_text.replace(
                  scope_marker,
                  scope_marker + dependency_boundary,
                  1,
              )
          scope_doc.write_text(scope_text, encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes \
            tests/agent_tools/test_responsibility_scope.py
          chmod +x \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tools/agent_tools/check_dependency_headers.py \
            tools/agent_tools/scan_dependency_headers.sh \
            tools/agent_tools/check_dependency_header_format.sh

      - name: Materialize canonical runtime views
        env:
          AGENT_CANON_PARENT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 tools/agent_tools/skill_shim_materializer.py \
            materialize --root . --all --format text
          python3 tools/agent_tools/skill_shim_materializer.py \
            materialize --root . --all --format text | tee /tmp/issue-549-materialize-second.txt
          grep -F 'SKILL_SHIM_MATERIALIZER_CONTENT_DELTA_COUNT=0' \
            /tmp/issue-549-materialize-second.txt
          python3 tools/agent_tools/skill_shim_materializer.py \
            check --root . --all --format text

      - name: Validate canonical tracked ownership
        run: |
          python3 tools/agent_tools/responsibility_scope.py \
            --root . --manifest responsibility-scope.toml --format text

      - name: Validate structure existence and kinds
        run: |
          tree -a -J --noreport \
            -I '.git|.pytest_cache|.ruff_cache|__pycache__' . \
            > /tmp/issue-549-tree.json
          python3 tools/agent_tools/repo_structure_contract.py \
            --root . --profile agent_canon_standalone \
            --tree-json /tmp/issue-549-tree.json --format text

      - name: Validate semantic parent audit selection
        env:
          PYTHONPATH: tools/agent_tools
        run: |
          python3 tools/agent_tools/parent_repository_audit.py \
            check --root . --unit-status pass --format text

      - name: Run ownership and structure regressions
        env:
          PYTHONPATH: tools/agent_tools
        run: |
          python3 -m unittest -v \
            tests.agent_tools.test_responsibility_scope \
            tests.agent_tools.test_parent_repository_audit \
            tests.agent_tools.test_repo_structure_contract

      - name: Run dependency header regressions
        env:
          PYTHONPATH: tools/agent_tools
        run: python3 -m unittest -v tests.agent_tools.test_check_dependency_headers

      - name: Validate focused Python sources
        run: |
          python3 -m py_compile \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tools/agent_tools/check_dependency_headers.py \
            tests/agent_tools/test_responsibility_scope.py \
            tests/agent_tools/test_repo_structure_contract.py \
            tests/agent_tools/test_parent_repository_audit.py \
            tests/agent_tools/test_check_dependency_headers.py
          ruff check \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tools/agent_tools/check_dependency_headers.py \
            tests/agent_tools/test_responsibility_scope.py \
            tests/agent_tools/test_repo_structure_contract.py \
            tests/agent_tools/test_parent_repository_audit.py \
            tests/agent_tools/test_check_dependency_headers.py
          pyright \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tools/agent_tools/check_dependency_headers.py

      - name: Validate Python dependency selection
        run: python3 tools/agent_tools/check_dependency_headers.py --root .

      - name: Validate shell dependency selection
        run: |
          bash -n tools/agent_tools/scan_dependency_headers.sh
          bash -n tools/agent_tools/check_dependency_header_format.sh
          bash tools/agent_tools/scan_dependency_headers.sh \
            --root . --changed --fail-missing
          bash tools/agent_tools/check_dependency_header_format.sh \
            --root . --changed --require-header

      - name: Validate tool drift and final diff
        run: |
          python3 tools/agent_tools/tool_drift.py --root .
          git diff --check

      - name: Commit and publish validated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: centralize path ownership for Issue 549'
          git push origin HEAD:fix/549-path-ownership-boundary
