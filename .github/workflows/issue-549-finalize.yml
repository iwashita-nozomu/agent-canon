# @dependency-start
# contract configuration
# responsibility One-time branch finalizer for Issue #549; validates canonical ownership changes and deletes itself from the final tree.
# upstream design ../../documents/design/responsibility-scope-management.md canonical path ownership relation
# upstream implementation ../../tools/agent_tools/responsibility_scope.py validates total single-owner classification
# downstream implementation ../../tests/agent_tools/test_responsibility_scope.py focused ownership regression
# @dependency-end

name: Issue 549 Finalize

on:
  push:
    branches:
      - fix/549-path-ownership-boundary
    paths:
      - .github/workflows/issue-549-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-549-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused validation dependencies
        run: |
          python3 -m pip install --upgrade pyyaml tomli packaging pytest ruff pyright
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Assemble canonical sources and remove temporary surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-549-design.part-00 \
              .issue-549-design.part-01 \
              .issue-549-design.part-02 \
              .issue-549-design.part-03 \
            > documents/design/parent-repository-audit.md
          printf '%s  %s\n' \
            '11690482006b371a6c979307e4c0e78e443b2ea36da13ef59d46e17a7a89a8cf' \
            'documents/design/parent-repository-audit.md' | sha256sum --check --strict
          git rm .issue-549-design.part-00 \
                 .issue-549-design.part-01 \
                 .issue-549-design.part-02 \
                 .issue-549-design.part-03 \
                 .github/workflows/issue-549-finalize.yml
          git add documents/design/parent-repository-audit.md

      - name: Normalize focused Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/agent_tools/test_parent_repository_audit.py": (
                  (
                      "from parent_repository_audit import _load_units  # noqa: E402",
                      "from parent_repository_audit import _load_units",
                  ),
                  (
                      '"documents/parent-repository-audit/audit-unit/"\n'
                      '                    "environment-containers.md"',
                      '"documents/parent-repository-audit/audit-unit/'
                      'environment-containers.md"',
                  ),
              ),
              "tests/agent_tools/test_responsibility_scope.py": (
                  (
                      "from responsibility_scope import scope_covers, "
                      "scope_from_mapping  # noqa: E402",
                      "from responsibility_scope import scope_covers, scope_from_mapping",
                  ),
              ),
              "tools/agent_tools/repo_structure_contract.py": (
                  (
                      'raise ValueError(f"missing profile list in structure contract: {path}")',
                      'raise TypeError(f"missing profile list in structure contract: {path}")',
                  ),
              ),
          }
          for path, path_replacements in replacements.items():
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              for old, new in path_replacements:
                  if old not in text:
                      raise SystemExit(f"missing normalization target in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              target.write_text(text, encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes \
            tests/agent_tools/test_responsibility_scope.py
          chmod +x \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py

      - name: Materialize canonical runtime views
        env:
          AGENT_CANON_PARENT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 tools/agent_tools/skill_shim_materializer.py \
            materialize --root . --all --format text
          python3 tools/agent_tools/skill_shim_materializer.py \
            materialize --root . --all --format text | tee /tmp/issue-549-materialize-second.txt
          grep -F 'SKILL_SHIM_MATERIALIZER_CONTENT_DELTA_COUNT=0' \
            /tmp/issue-549-materialize-second.txt
          python3 tools/agent_tools/skill_shim_materializer.py \
            check --root . --all --format text

      - name: Validate ownership, structure, audit semantics, and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent_tools/responsibility_scope.py \
            --root . --manifest responsibility-scope.toml --format text
          tree -a -J --noreport \
            -I '.git|.pytest_cache|.ruff_cache|__pycache__' . \
            > /tmp/issue-549-tree.json
          python3 tools/agent_tools/repo_structure_contract.py \
            --root . --profile agent_canon_standalone \
            --tree-json /tmp/issue-549-tree.json --format text
          PYTHONPATH=tools/agent_tools \
            python3 tools/agent_tools/parent_repository_audit.py \
            check --root . --unit-status pass --format text
          PYTHONPATH=tools/agent_tools python3 -m unittest -v \
            tests.agent_tools.test_responsibility_scope \
            tests.agent_tools.test_parent_repository_audit \
            tests.agent_tools.test_repo_structure_contract
          python3 -m py_compile \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tests/agent_tools/test_responsibility_scope.py \
            tests/agent_tools/test_repo_structure_contract.py \
            tests/agent_tools/test_parent_repository_audit.py
          ruff check \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py \
            tests/agent_tools/test_responsibility_scope.py \
            tests/agent_tools/test_repo_structure_contract.py \
            tests/agent_tools/test_parent_repository_audit.py
          pyright \
            tools/agent_tools/responsibility_scope.py \
            tools/agent_tools/repo_structure_contract.py \
            tools/agent_tools/parent_repository_audit.py
          python3 tools/agent_tools/check_dependency_headers.py --root .
          python3 tools/agent_tools/tool_drift.py --root .
          git diff --check

      - name: Commit and publish validated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: centralize path ownership for Issue 549'
          git push origin HEAD:fix/549-path-ownership-boundary
