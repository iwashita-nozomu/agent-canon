name: Issue 1518 native Markdown verification

on:
  push:
    branches:
      - verify/1518-native-skill-materialization

permissions:
  contents: read

env:
  AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact PR candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b55e76d6274862da806019ce8850c67eaffec01
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the candidate using the existing CI source-sync route
        run: |
          source="${AGENT_CANON_CONTROL_PARENT_ROOT}/agent-canon-1518-${GITHUB_RUN_ID}"
          bare="${source}.git"
          printf 'AGENT_CANON_CANDIDATE_SOURCE=%s\nAGENT_CANON_CANDIDATE_BARE=%s\n' "${source}" "${bare}" >> "${GITHUB_ENV}"
          git init --bare "${bare}"
          git push "${bare}" HEAD:refs/heads/main
          git --git-dir="${bare}" symbolic-ref HEAD refs/heads/main
          git clone --no-local --branch main --single-branch "${bare}" "${source}"
          mkdir -p "${RUNNER_TEMP}/issue-1518-docs"
          git rev-parse HEAD > "${RUNNER_TEMP}/issue-1518-docs/source-head.txt"
      - name: Start the existing shared tool runtime
        id: runtime
        run: |
          key="$(bash "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap/container/image/digest.sh" "${AGENT_CANON_CANDIDATE_SOURCE}")"
          image="ghcr.io/${GITHUB_REPOSITORY}:env-${key}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" install
          else
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" update --local-build
          fi
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" start
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Format the exact Markdown copies with the native docs owner
        run: |
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" exec --root "${GITHUB_WORKSPACE}" -- bash -c '
            set -euo pipefail
            scratch="${AGENT_CANON_RUNTIME_ROOT}/tasks/issue-1518-format"
            mkdir -p "${scratch}"
            tar -C "${AGENT_CANON_TARGET_ROOT}" --exclude=./.git --exclude=./.runtime -cf - . | tar -C "${scratch}" -xf -
            paths=(agents/canonical/CODEX_WORKFLOW.md agents/canonical/CODEX_IMPLEMENTATION.md agents/skills/dependency-analysis.md agents/skills/user-guided-debugging.md .codex/personal/skills/dependency-analysis/SKILL.md .codex/personal/skills/user-guided-debugging/SKILL.md)
            cd "${scratch}"
            sha256sum "${paths[@]}" > before.sha256
            "${AGENT_CANON_CACHE_ROOT}/bin/agent-canon" docs format --root "${scratch}" "${paths[@]}"
            sha256sum "${paths[@]}" > after.sha256
            diff -u before.sha256 after.sha256
          ' > "${RUNNER_TEMP}/issue-1518-docs/docs-format.log" 2>&1
      - name: Export actual formatter and adjacent check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1518-native-docs
          path: ${{ runner.temp }}/issue-1518-docs/
          if-no-files-found: error
          retention-days: 7
      - name: Release the owned shared runtime and helper checkouts
        if: always()
        run: |
          if [[ -n "${AGENT_CANON_CANDIDATE_SOURCE:-}" ]]; then
            if [[ -d "${AGENT_CANON_CANDIDATE_SOURCE}/.runtime" ]]; then
              "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" uninstall
            fi
            rm -rf -- "${AGENT_CANON_CANDIDATE_SOURCE}" "${AGENT_CANON_CANDIDATE_BARE}"
          fi
