name: Finalize PR666 semantic evals
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'canon/simplify-core-skill-contracts-630-640'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/simplify-core-skill-contracts-630-640
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade tomli pyyaml pytest
      - name: Rewrite stale eval contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def rewrite(path, prefixes, append):
              p=Path(path); text=p.read_text(); head,*blocks=text.split('\n[[evals]]'); kept=[]
              for block in blocks:
                  m=re.search(r'\nid\s*=\s*"([^"]+)"','\n'+block); eid=m.group(1) if m else ''
                  if any(eid.startswith(x) for x in prefixes): continue
                  kept.append(block)
              p.write_text(head.rstrip()+''.join('\n[[evals]]'+b for b in kept)+'\n\n'+append.strip()+'\n')
          rewrite('evidence/agent-evals/skill_workflow_prompt_eval.toml',('report-writing-','structure-planning-','test-design-'),r'''
[[evals]]
id = "report-writing-semantic-contract"
target = "agents/skills/report-writing.md"
description = "Report correctness is semantic rather than a fixed presentation schema."
[[evals.checklist]]
id = "REPORT-SEMANTIC-1"
critical = true
required_regex = ["material factual or recommendation claim", "source support", "inference", "observations and interpretations", "limitations", "next action"]
[[evals.checklist]]
id = "REPORT-SEMANTIC-2"
critical = true
required_regex = ["No fixed heading count", "finding_count == 0", "advisory checker", "Markdown is the default", "explicitly requested"]
[[evals]]
id = "structure-planning-semantic-activation"
target = "agents/skills/structure-planning.md"
description = "Structure planning activates only for genuine structural decisions."
[[evals.checklist]]
id = "STRUCTURE-SEMANTIC-1"
critical = true
required_regex = ["owner", "canonical source", "reader entry", "validation topology", "real structural decision"]
[[evals.checklist]]
id = "STRUCTURE-SEMANTIC-2"
critical = true
required_regex = ["Mermaid", "optional diagnostics", "information gain"]
[[evals]]
id = "test-design-semantic-admission"
target = "agents/skills/test-design.md"
description = "Regression admission depends on contract, reachability, and a stable oracle."
[[evals.checklist]]
id = "TEST-SEMANTIC-1"
critical = true
required_regex = ["contract", "reachable", "counterexample", "oracle"]
[[evals.checklist]]
id = "TEST-SEMANTIC-2"
critical = true
required_regex = ["reproduction", "reachability evidence", "null-hypothesis"]
''')
          rewrite('evidence/agent-evals/report_quality_eval.toml',('report-writing-runtime-skill','report-writing-human-doc'),r'''
[[evals]]
id = "report-writing-semantic-quality"
target = "agents/skills/report-writing.md"
description = "Report quality is claim/evidence/limitation/action correctness, not heading or token count."
[[evals.checklist]]
id = "REPORT-QUALITY-SEMANTIC-1"
critical = true
required_regex = ["source support", "inference", "observations and interpretations", "limitations", "next action"]
[[evals.checklist]]
id = "REPORT-QUALITY-SEMANTIC-2"
critical = true
required_regex = ["No fixed heading count", "accepted blocking findings", "finding_count == 0", "second policy/source-of-truth"]
''')
          PY
          rm -f .github/workflows/finalize-pr666.yml .github/workflows/diag-pr666-evals.yml .github/workflows/fix-pr666-evals.yml
      - name: Validate
        run: |
          python3 tools/agent_tools/evaluate_skill_workflow_prompts.py --root .
          python3 tools/agent_tools/evaluate_report_quality.py --root .
          python3 -m pytest -q tests/agent_tools/test_evaluate_report_quality.py
          git diff --check
      - name: Commit and push
        run: |
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git add evidence/agent-evals/skill_workflow_prompt_eval.toml evidence/agent-evals/report_quality_eval.toml .github/workflows
          git commit -m 'test: align skill evals with semantic contracts'
          git push origin HEAD:canon/simplify-core-skill-contracts-630-640
