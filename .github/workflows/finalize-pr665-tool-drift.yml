name: Finalize PR665 tool drift ownership

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 665
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/simplify-diagnostic-workflows-624-628
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pytest pyyaml tomli packaging ruff pyright
      - name: Remove retired coordination workflow from PR-flow convention
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/agent_tools/tool_drift.py')
          s = p.read_text()
          s = s.replace('            LinkCheck(".github/workflows/agent-coordination.yml"),\n', '')
          block = '''        text_checks=(\n            TextCheck(\n                ".github/workflows/agent-coordination.yml",\n                "tools/ci/checkout_agent_canon_submodule.sh",\n                "missing-standalone-checkout-helper-route",\n            ),\n        ),\n'''
          if block not in s:
              raise SystemExit('stale coordination text-check anchor missing')
          p.write_text(s.replace(block, '', 1))
          PY
          rm -f .github/workflows/finalize-pr665-tool-drift.yml .ci-kick-pr665-tool-drift
          touch .ci-trigger-pr665-tool-drift
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/agent_tools/test_tool_drift.py
          git diff --check
      - name: Canonical integration validation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_CANON_PR_READ_TOKEN: ${{ github.token }}
          AGENT_CANON_PR_NUMBER: '665'
          AGENT_CANON_PR_BASE_REF: main
          AGENT_CANON_PR_HEAD_REF: canon/simplify-diagnostic-workflows-624-628
        run: bash tools/ci/check_agent_canon_pr.sh
      - name: Commit completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove retired coordination workflow drift contract'
          git push origin HEAD:canon/simplify-diagnostic-workflows-624-628
