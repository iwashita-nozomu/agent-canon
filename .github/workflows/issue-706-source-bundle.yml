name: Issue 706 Source Bundle

on:
  push:
    branches:
      - fix/docker-run-repository-tests-20260814
    paths:
      - .github/workflows/issue-706-source-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out active issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize head and current main bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git bundle create issue-706.bundle HEAD refs/remotes/origin/main
          git archive --format=tar.gz --output=issue-706-worktree.tar.gz HEAD
          git bundle verify issue-706.bundle
          printf '%s\n' "ISSUE_706_BUNDLE_MAIN=$(git rev-parse refs/remotes/origin/main)"

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue-706-source-bundle
          path: |
            issue-706.bundle
            issue-706-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
