name: Finalize PR668 selected validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 668
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/selective-pr-gates-629-644
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pytest pyyaml tomli packaging ruff pyright
      - name: Apply selected-validation completion patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/agent_tools/classify_path_risk.py')
          s = p.read_text()
          s = s.replace('''        if path.startswith("./"):\n            path = path[2:]\n''', '''        path = path.removeprefix("./")\n''')
          s = s.replace('''                    "PYTHONPATH=tools/agent_tools python3 -m pyright <changed-python-paths>",\n''', '''                    "PYTHONPATH=tools/agent_tools python3 -m pyright <changed-python-paths>",\n                    "python3 -m pytest -q <targeted-python-tests>",\n''')
          p.write_text(s)

          p = Path('tools/ci/run_selected_agent_canon_pr_checks.py')
          s = p.read_text()
          anchor = '''def _run(command: list[str], *, print_only: bool) -> None:\n'''
          helper = '''def _targeted_python_tests(paths: tuple[str, ...]) -> list[str]:\n    tests: list[str] = []\n    for raw in paths:\n        path = Path(raw)\n        if path.suffix not in {".py", ".pyi"}:\n            continue\n        if raw.startswith("tests/") and path.exists():\n            tests.append(raw)\n            continue\n        if raw.startswith("tools/agent_tools/"):\n            candidate = Path("tests/agent_tools") / f"test_{path.stem}.py"\n            if candidate.exists():\n                tests.append(candidate.as_posix())\n    return list(dict.fromkeys(tests))\n\n\n'''
          if '_targeted_python_tests' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          old = '''            _run(\n                ["python3", "-m", "pyright", *changed_python],\n                print_only=print_only,\n            )\n'''
          new = old + '''            targeted_tests = _targeted_python_tests(paths)\n            if targeted_tests:\n                _run(["python3", "-m", "pytest", "-q", *targeted_tests], print_only=print_only)\n'''
          if 'targeted_tests = _targeted_python_tests(paths)' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/agent_tools/test_classify_path_risk.py')
          s = p.read_text()
          s = s.replace('# downstream implementation ../../.github/workflows/path-risk-check-matrix-smoke.yml consumes classifier output.\n', '')
          s = s.replace('''        self.assertIn("docs-only-or-docs-impact", profiles)\n        self.assertIn("python-tooling", profiles)\n        self.assertIn("github-automation", profiles)\n        self.assertIn("agentcanon-shared-surface", profiles)''', '''        self.assertIn("docs", profiles)\n        self.assertIn("python", profiles)\n        self.assertIn("workflow", profiles)''')
          p.write_text(s)

          p = Path('tools/ci/check_github_workflows.py')
          s = p.read_text()
          s = s.replace('''AGENT_CANON_STATIC_GATES_WORKFLOW_REQUIREMENTS = (\n    "pull_request:",\n    "workflow_dispatch:",\n    "github.event.pull_request.head.sha || github.sha",\n    "bash tools/ci/check_agent_canon_pr.sh",\n)''', '''AGENT_CANON_STATIC_GATES_WORKFLOW_REQUIREMENTS = (\n    "pull_request:",\n    "workflow_dispatch:",\n    "github.event.pull_request.head.sha || github.sha",\n    "classify_path_risk.py",\n    "run_selected_agent_canon_pr_checks.py",\n    "--full-confidence",\n)''')
          s = s.replace('''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "generate_agent_runtime_dashboard.py",\n)''', '''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "workflow_dispatch:",\n    "schedule:",\n    "generate_agent_runtime_dashboard.py",\n)''')
          s = s.replace('''STANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: read",\n    "issues: write",\n)''', '''STANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "push:",\n    "- main",\n    "workflow_dispatch:",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: write",\n)''')
          old = '''    wrapper = "bash tools/ci/check_agent_canon_pr.sh"\n    run_steps = [\n        (context, run)\n        for context in step_contexts(workflow)\n        if isinstance((run := context.step.get("run")), str)\n    ]\n    wrapper_steps = [context for context, run in run_steps if wrapper in run]\n    if len(wrapper_steps) != 1:\n        findings.append(\n            Finding(\n                "error",\n                path,\n                f"canonical_candidate_gate_consumer_count:{len(wrapper_steps)}",\n            )\n        )'''
          new = '''    wrapper = "bash tools/ci/check_agent_canon_pr.sh"\n    selected_executor = "tools/ci/run_selected_agent_canon_pr_checks.py"\n    run_steps = [\n        (context, run)\n        for context in step_contexts(workflow)\n        if isinstance((run := context.step.get("run")), str)\n    ]\n    wrapper_steps = [context for context, run in run_steps if wrapper in run]\n    selected_steps = [context for context, run in run_steps if selected_executor in run]\n    if len(selected_steps) != 1:\n        findings.append(\n            Finding(\n                "error",\n                path,\n                f"canonical_selected_gate_consumer_count:{len(selected_steps)}",\n            )\n        )\n    if wrapper_steps:\n        findings.append(Finding("error", path, "direct_full_gate_consumer_forbidden_on_selected_route"))'''
          s = s.replace(old, new)
          s = s.replace('''    for context in wrapper_steps:\n        step_env = as_string_dict(context.step.get("env")) or {}\n        if step_env.get(AGENT_CANON_PR_READ_CREDENTIAL) != GITHUB_TOKEN_EXPRESSION:''', '''    for context in selected_steps:\n        step_env = as_string_dict(context.step.get("env")) or {}\n        if step_env.get(AGENT_CANON_PR_READ_CREDENTIAL) != GITHUB_TOKEN_EXPRESSION:''')
          p.write_text(s)
          PY
          chmod +x tools/agent_tools/classify_path_risk.py tools/ci/run_selected_agent_canon_pr_checks.py
          rm -f .github/workflows/fix-pr668-validation.yml .github/workflows/finalize-pr668.yml .ci-kick-pr668
          touch .ci-trigger-pr668
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/agent_tools/test_classify_path_risk.py
          tmp=$(mktemp)
          printf '%s\n' tools/agent_tools/tool_catalog.py > "$tmp"
          PYTHONPATH=tools python3 tools/ci/run_selected_agent_canon_pr_checks.py --paths-file "$tmp" --print-only | grep -F 'python3 -m pytest -q tests/agent_tools/test_tool_catalog.py'
          python3 tools/ci/check_github_workflows.py
          python3 -m ruff check tools/agent_tools/classify_path_risk.py tools/ci/run_selected_agent_canon_pr_checks.py tools/ci/check_github_workflows.py tests/agent_tools/test_classify_path_risk.py
          git diff --check
      - name: Commit completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete selected PR validation contract'
          git push origin HEAD:canon/selective-pr-gates-629-644
