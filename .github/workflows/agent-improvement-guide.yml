# @dependency-start
# contract configuration
# responsibility Generates bounded AgentCanon improvement guidance for its generator surface and manual dispatch.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md PR evidence rules
# upstream implementation ../../eval/producers/generate_agent_improvement_guide.py builds the guide
# upstream implementation ../../tools/runtime/artifacts/runtime_artifacts.py owns external report/archive paths
# @dependency-end

# Standalone AgentCanon improvement guidance workflow. Derived repositories run
# it automatically only when the guide generator surface changes.
name: Agent Improvement Guide

on:
  pull_request:
    paths:
      - ".github/workflows/agent-improvement-guide.yml"
      - "eval/producers/generate_agent_improvement_guide.py"
      - "tests/agent_tools/test_generate_agent_improvement_guide.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-improvement-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-latest
    env:
      AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..
      AGENT_CANON_RUNTIME_ROOT: ${{ github.workspace }}/.runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # PR runtime images are cache-only and are not available from GHCR.
          # A full PR checkout makes bootstrap use its normal local Docker build.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare PR candidate source
        run: |
          set -euo pipefail
          candidate_bare="${RUNNER_TEMP}/agent-canon-pr-candidate.git"
          candidate_source="${RUNNER_TEMP}/agent-canon-pr-candidate"
          rm -rf -- "${candidate_bare}" "${candidate_source}"
          git init --bare "${candidate_bare}"
          git -C "${GITHUB_WORKSPACE}" push "${candidate_bare}" "HEAD:refs/heads/main"
          git --git-dir="${candidate_bare}" symbolic-ref HEAD refs/heads/main
          git clone --branch main --single-branch "${candidate_bare}" "${candidate_source}"
          printf 'AGENT_CANON_CANDIDATE_SOURCE=%s\n' "${candidate_source}" >> "${GITHUB_ENV}"

      - name: Start shared tool runtime
        run: |
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only

      - name: Generate improvement guide
        id: guide
        run: |
          report_dir="$(realpath -m "${AGENT_CANON_RUNTIME_ROOT}/container-runtime/reports/agent-improvement-guide")"
          guide_path="${report_dir}/agent-improvement-guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          container_guide="/var/lib/agent-canon/runtime/reports/agent-improvement-guide/agent-improvement-guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" \
            exec --root "${GITHUB_WORKSPACE}" -- python3 \
            /usr/local/share/agent-canon/runtime/eval/producers/generate_agent_improvement_guide.py \
            --root . --runtime-root /var/lib/agent-canon/runtime --out "${container_guide}" \
            --output-mode 644
          cat "${guide_path}" >> "${GITHUB_STEP_SUMMARY}"
          echo "guide_path=${guide_path}" >> "$GITHUB_OUTPUT"

      - name: Upload improvement guide
        uses: actions/upload-artifact@v4
        with:
          name: agent-improvement-guide-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guide.outputs.guide_path }}

      - name: Release shared tool runtime
        if: always()
        run: |
          if [[ -n "${AGENT_CANON_CANDIDATE_SOURCE:-}" ]]; then
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" stop || true
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true
          fi
