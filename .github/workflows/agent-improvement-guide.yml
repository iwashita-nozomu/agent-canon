# @dependency-start
# contract configuration
# responsibility Generates bounded AgentCanon improvement guidance for its generator surface and manual dispatch.
# upstream design ../../agents/skills/agent-canon-update.md PR evidence rules
# upstream implementation ../../tools/runtime/dispatch/agent-canon/src/agent_runtime_dashboard.rs builds the guide
# upstream implementation ../../tools/runtime/dispatch/agent-canon/src/runtime_boundary.rs owns external artifact paths
# @dependency-end

# Standalone AgentCanon improvement guidance workflow. Derived repositories run
# it automatically only when the guide generator surface changes.
name: Agent Improvement Guide

on:
  pull_request:
    paths:
      - ".github/workflows/agent-improvement-guide.yml"
      - "tools/runtime/dispatch/agent-canon/src/agent_runtime_dashboard.rs"
      - "tests/agent_tools/test_generate_agent_improvement_guide.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-improvement-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-latest
    env:
      AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Preserve the candidate history while staging its local source clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Prepare PR candidate source
        run: |
          set -euo pipefail
          candidate_bare="${RUNNER_TEMP}/agent-canon-pr-candidate.git"
          candidate_source="${RUNNER_TEMP}/agent-canon-pr-candidate"
          rm -rf -- "${candidate_bare}" "${candidate_source}"
          git init --bare "${candidate_bare}"
          git -C "${GITHUB_WORKSPACE}" push "${candidate_bare}" "HEAD:refs/heads/main"
          git --git-dir="${candidate_bare}" symbolic-ref HEAD refs/heads/main
          git clone --no-local --branch main --single-branch "${candidate_bare}" "${candidate_source}"
          printf 'AGENT_CANON_CANDIDATE_BARE=%s\n' "${candidate_bare}" >> "${GITHUB_ENV}"
          printf 'AGENT_CANON_CANDIDATE_SOURCE=%s\n' "${candidate_source}" >> "${GITHUB_ENV}"

      - name: Start shared tool runtime
        run: |
          set -euo pipefail
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" install
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only

      - name: Generate improvement guide
        id: guide
        run: |
          guide_dir="$(realpath -m -- "${AGENT_CANON_CONTROL_PARENT_ROOT}/agent-improvement-guide")"
          guide_path="${guide_dir}/agent-improvement-guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          container_guide="/var/lib/agent-canon/runtime/reports/agent-improvement-guide/agent-improvement-guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          guide_stderr="${RUNNER_TEMP}/agent-improvement-guide.stderr"
          result=0
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" \
            tool run --root "${GITHUB_WORKSPACE}" generate-agent-improvement-guide -- \
            --root . --runtime-root /var/lib/agent-canon/runtime --out "${container_guide}" \
            --output-mode 644 2>"${guide_stderr}" || result=$?
          cat -- "${guide_stderr}" >&2
          if (( result != 0 )); then
            status_path="${RUNNER_TEMP}/agent-improvement-guide-runtime.json"
            if receipt="$(jq -Rer 'fromjson? | select(.schema == "agent-canon.bootstrap-receipt.v2" and .code == "tool_failed") | .evidence.receipt_path | strings | select(test("^/var/lib/agent-canon/runtime/receipts/[0-9]{8}T[0-9]{6}Z-exec-[a-f0-9]{32}[.]json$"))' "${guide_stderr}")" &&
               "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" status >"${status_path}" &&
               container="$(jq -er 'select(.schema == "agent-canon.bootstrap-receipt.v2" and .status == "ok" and .operation == "status") | .container | select(.drift == false) | .name | strings | select(length > 0)' "${status_path}")"; then
              docker cp -- "${container}:${receipt}" - | tar -xOf - |
                jq -c '{stderr: .details.stderr_preview, truncated: .details.stderr_truncated}' >&2 || true
            fi
            exit "${result}"
          fi
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" \
            tool export guide --destination "${guide_dir}"
          cat "${guide_path}" >> "${GITHUB_STEP_SUMMARY}"
          echo "guide_path=${guide_path}" >> "$GITHUB_OUTPUT"

      - name: Upload improvement guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-improvement-guide-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guide.outputs.guide_path }}

      - name: Release shared tool runtime
        if: always()
        run: |
          guide_dir="$(realpath -m -- "${AGENT_CANON_CONTROL_PARENT_ROOT}/agent-improvement-guide")"
          if [[ -n "${AGENT_CANON_CANDIDATE_SOURCE:-}" ]]; then
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" stop || true
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" uninstall || true
          fi
          rm -rf -- "${AGENT_CANON_CANDIDATE_BARE:-}" "${AGENT_CANON_CANDIDATE_SOURCE:-}" \
            "${guide_dir}"
