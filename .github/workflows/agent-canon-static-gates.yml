# @dependency-start
# contract configuration
# responsibility Replays the canonical selected validation responsibilities for an AgentCanon PR; manual dispatch retains full-confidence validation.
# upstream design ../../documents/design/responsibility-rationale.md selected validation and remote replay rationale
# upstream design ../../documents/runtime/runtime-profiles-and-check-matrix.md profile-based validation routing
# upstream implementation ../../tools/agent_tools/classify_path_risk.py is the sole changed-path selector
# upstream implementation ../../tools/ci/run_selected_agent_canon_pr_checks.py executes the selected responsibilities
# upstream implementation ../../tools/ci/check_agent_canon_pr.sh remains the explicit full-confidence executor
# downstream implementation ../../tools/ci/check_github_workflows.py validates workflow conventions
# @dependency-end

name: AgentCanon Static Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-canon-static-gates-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Select validation responsibilities
        id: select
        shell: bash
        run: |
          set -euo pipefail
          paths_file="${RUNNER_TEMP}/changed-paths.txt"
          : > "${paths_file}"
          selector_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}...HEAD" > "${paths_file}"
          else
            selector_args+=(--full-confidence)
          fi
          python3 tools/agent_tools/classify_path_risk.py \
            --paths-file "${paths_file}" "${selector_args[@]}" --format json \
            > "${RUNNER_TEMP}/selected-validation.json"
          cat "${RUNNER_TEMP}/selected-validation.json"
          profiles="$(python3 - "${RUNNER_TEMP}/selected-validation.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(",".join(payload["profiles"]))
          PY
          )"
          echo "profiles=${profiles}" >> "$GITHUB_OUTPUT"
          echo "paths_file=${paths_file}" >> "$GITHUB_OUTPUT"

      - name: Setup Python validation runtime
        if: contains(steps.select.outputs.profiles, 'python') || contains(steps.select.outputs.profiles, 'workflow') || contains(steps.select.outputs.profiles, 'container') || contains(steps.select.outputs.profiles, 'eval') || contains(steps.select.outputs.profiles, 'full-confidence')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install selected Python gate dependencies
        if: contains(steps.select.outputs.profiles, 'python') || contains(steps.select.outputs.profiles, 'workflow') || contains(steps.select.outputs.profiles, 'container') || contains(steps.select.outputs.profiles, 'eval') || contains(steps.select.outputs.profiles, 'full-confidence')
        run: python3 -m pip install --upgrade pyyaml tomli packaging ruff pyright

      - name: Install selected Rust gate components
        if: contains(steps.select.outputs.profiles, 'rust') || contains(steps.select.outputs.profiles, 'full-confidence')
        run: rustup component add rustfmt clippy

      - name: Prepare selected eval/full runtime archive
        if: contains(steps.select.outputs.profiles, 'eval') || contains(steps.select.outputs.profiles, 'full-confidence')
        run: mkdir -p .agent-canon/log-archive

      - name: Run selected validation
        env:
          AGENT_CANON_PR_READ_TOKEN: ${{ github.token }}
          PYTHONPATH: tools
        run: |
          args=(--paths-file "${{ steps.select.outputs.paths_file }}")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--full-confidence)
          fi
          python3 tools/ci/run_selected_agent_canon_pr_checks.py "${args[@]}"
