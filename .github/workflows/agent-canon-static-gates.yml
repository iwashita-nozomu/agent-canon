# @dependency-start
# contract configuration
# responsibility Selects and runs standalone AgentCanon validation in one shared tool runtime and one required check.
# upstream design ../../agents/skills/agent-canon-update.md agent-canon PR workflow
# upstream design ../../documents/runtime/runtime-profiles-and-check-matrix.md risk-based validation routing
# upstream implementation ../../tools/validation/semantic/path/classify_path_risk.py canonical changed-path selector and unit mapping
# upstream implementation ../../tools/validation/ci/runners/run_standalone_static_gate_unit.sh executes one selected static-gate unit
# downstream implementation ../../tools/validation/ci/checks/check_github_workflows.py validates workflow and PR template conventions
# downstream implementation ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries and selection
# @dependency-end

name: AgentCanon Static Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..

concurrency:
  group: agent-canon-static-gates-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  select-static-units:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.select.outputs.units }}
      docs_paths: ${{ steps.select.outputs.docs_paths }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation units from trusted PR diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git -c core.quotePath=false diff --name-only --no-renames "${BASE_SHA}" HEAD > "${RUNNER_TEMP}/agent-canon-changed-paths.txt"
            python3 tools/validation/semantic/path/classify_path_risk.py \
              --paths-file "${RUNNER_TEMP}/agent-canon-changed-paths.txt" \
              --format github-output | tee -a "${GITHUB_OUTPUT}"
          else
            python3 tools/validation/semantic/path/classify_path_risk.py \
              --full-confidence --format github-output | tee -a "${GITHUB_OUTPUT}"
          fi

  static-gates:
    needs: select-static-units
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful unit selection
        env:
          SELECTION_RESULT: ${{ needs.select-static-units.result }}
          SELECTED_UNITS: ${{ needs.select-static-units.outputs.units }}
        run: |
          [[ "${SELECTION_RESULT}" == "success" ]] || exit 1
          printf 'selected_units=%s\n' "${SELECTED_UNITS:-none}"

      - name: Checkout repository
        if: needs.select-static-units.outputs.units != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare candidate source for bootstrap main synchronization
        if: needs.select-static-units.outputs.units != ''
        run: |
          candidate_source="${AGENT_CANON_CONTROL_PARENT_ROOT}/agent-canon-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_bare="${candidate_source}.git"
          printf 'AGENT_CANON_CANDIDATE_SOURCE=%s\n' "${candidate_source}" >> "${GITHUB_ENV}"
          printf 'AGENT_CANON_CANDIDATE_BARE=%s\n' "${candidate_bare}" >> "${GITHUB_ENV}"
          git init --bare "${candidate_bare}"
          git push "${candidate_bare}" HEAD:refs/heads/main
          git --git-dir="${candidate_bare}" symbolic-ref HEAD refs/heads/main
          git clone --no-local --branch main --single-branch "${candidate_bare}" "${candidate_source}"

      - name: Start one shared tool runtime
        id: start_runtime
        if: needs.select-static-units.outputs.units != ''
        run: |
          key="$(bash "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap/container/image/digest.sh" "${AGENT_CANON_CANDIDATE_SOURCE}")"
          image="ghcr.io/${GITHUB_REPOSITORY}:env-${key}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" install
          else
            "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" update --local-build
          fi
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" start
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only

      - name: Run selected units in the shared runtime
        id: run_units
        if: needs.select-static-units.outputs.units != ''
        env:
          SELECTED_UNITS: ${{ needs.select-static-units.outputs.units }}
          DOCS_PATHS: ${{ needs.select-static-units.outputs.docs_paths }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          evidence="${RUNNER_TEMP}/agent-canon-static-evidence"
          mkdir -p "${evidence}"
          git -C "${GITHUB_WORKSPACE}" show --no-patch --format='%H%n%P' HEAD > "${evidence}/source-identity.txt"
          printf 'base=%s\nunits=%s\n' "${BASE_SHA:-origin/main}" "${SELECTED_UNITS}" >> "${evidence}/source-identity.txt"
          python3 - <<'PY' > "${RUNNER_TEMP}/agent-canon-docs-paths"
          import json
          import os
          import sys
          for path in json.loads(os.environ["DOCS_PATHS"]):
              sys.stdout.buffer.write(path.encode("utf-8") + b"\0")
          PY
          mapfile -d '' -t docs_paths < "${RUNNER_TEMP}/agent-canon-docs-paths"
          IFS=',' read -r -a units <<< "${SELECTED_UNITS}"
          status=0
          eval_unit_status=not-selected
          unit_index=0
          for unit in "${units[@]}"; do
            unit_index=$((unit_index + 1))
            receipt="${evidence}/unit-${unit_index}.log"
            args=()
            case "${unit}" in
              docs) args=("${docs_paths[@]}") ;;
            esac
            if "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" \
              exec --root "${GITHUB_WORKSPACE}" -- bash \
              /opt/agent-canon/source/tools/validation/ci/runners/run_standalone_static_gate_unit.sh "${unit}" "${args[@]}" > "${receipt}" 2>&1; then
              if [[ "${unit}" == "eval" ]]; then
                eval_unit_status=pass
              fi
              printf 'unit=%s status=pass\n' "${unit}" >> "${GITHUB_STEP_SUMMARY}"
            else
              result=$?
              if [[ "${unit}" == "eval" ]]; then
                eval_unit_status=fail
              fi
              printf 'unit=%s status=fail exit=%s\n' "${unit}" "${result}" >> "${GITHUB_STEP_SUMMARY}"
              status=1
            fi
            cat -- "${receipt}"
          done
          printf 'eval_unit_status=%s\n' "${eval_unit_status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Capture shared runtime validation output
        if: always() && steps.start_runtime.outcome == 'success'
        env:
          SELECTED_UNITS: ${{ needs.select-static-units.outputs.units }}
          EVAL_UNIT_STATUS: ${{ steps.run_units.outputs.eval_unit_status }}
        run: |
          evidence="${RUNNER_TEMP}/agent-canon-static-evidence"
          mkdir -p "${evidence}"
          "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" status > "${evidence}/runtime-status.json"
          container="$(jq -er 'select(.schema == "agent-canon.bootstrap-receipt.v2" and .status == "ok" and .operation == "status") | .container | select(.drift == false) | select(.health | type == "string" and length > 0 and . != "absent") | .name | select(type == "string" and length > 0)' "${evidence}/runtime-status.json")"
          # The status owner validates this exact container name and reports
          # drift. Export data without starting a command or extracting paths.
          docker cp -- "${container}:/var/lib/agent-canon/runtime/tasks" - > "${evidence}/runtime-task-output.tar.part"
          mv -- "${evidence}/runtime-task-output.tar.part" "${evidence}/runtime-task-output.tar"
          if [[ ",${SELECTED_UNITS}," == *,eval,* ]]; then
            docker cp -- "${container}:/var/lib/agent-canon/runtime/eval-results" - > "${evidence}/runtime-eval-results.tar.part"
            mv -- "${evidence}/runtime-eval-results.tar.part" "${evidence}/runtime-eval-results.tar"
            if [[ "${EVAL_UNIT_STATUS}" == "fail" ]]; then
              docker cp -- "${container}:/var/lib/agent-canon/runtime/eval/agent-canon-pr-gate" - > "${evidence}/runtime-eval-producer-logs.tar.part"
              mv -- "${evidence}/runtime-eval-producer-logs.tar.part" "${evidence}/runtime-eval-producer-logs.tar"
            fi
          fi

      - name: Upload static validation evidence
        if: always() && steps.start_runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: agent-canon-static-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-canon-static-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Release shared tool runtime
        if: always()
        run: |
          if [[ -n "${AGENT_CANON_CANDIDATE_SOURCE:-}" ]]; then
            if [[ -d "${AGENT_CANON_CANDIDATE_SOURCE}/.runtime" ]]; then
              "${AGENT_CANON_CANDIDATE_SOURCE}/bootstrap.sh" --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" uninstall
            fi
            rm -rf -- "${AGENT_CANON_CANDIDATE_SOURCE}" "${AGENT_CANON_CANDIDATE_BARE}"
          fi
