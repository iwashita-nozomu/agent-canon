# @dependency-start
# contract configuration
# responsibility Selects and runs standalone AgentCanon validation in semantic execution units while preserving one aggregate required check.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md agent-canon PR workflow
# upstream design ../../documents/runtime/runtime-profiles-and-check-matrix.md risk-based validation routing
# upstream implementation ../../tools/agent_tools/classify_path_risk.py canonical changed-path selector and unit mapping
# upstream implementation ../../tools/ci/run_standalone_static_gate_unit.sh executes one selected static-gate unit
# upstream implementation ../../tools/ci/check_agent_canon_pr.sh preserves the manual full-confidence route
# downstream implementation ../../tools/ci/check_github_workflows.py validates workflow and PR template conventions
# downstream implementation ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries and selection
# @dependency-end

name: AgentCanon Static Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Static checks treat the checkout as a read-only source.  Each job gets an
  # explicit external Git control root and runtime root under the runner's
  # task-owned temporary directory.
  AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..
  AGENT_CANON_RUNTIME_ROOT: ${{ github.workspace }}/../workspace/agent-canon-runtime/${{ github.job }}

concurrency:
  group: agent-canon-static-gates-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  select-static-units:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.select.outputs.units }}
      rust: ${{ steps.select.outputs.rust }}
      contracts: ${{ steps.select.outputs.contracts }}
      eval: ${{ steps.select.outputs.eval }}
      workflow_container: ${{ steps.select.outputs.workflow_container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation units from trusted PR diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/agent-canon-changed-paths.txt"
          python3 tools/agent_tools/classify_path_risk.py \
            --paths-file "${RUNNER_TEMP}/agent-canon-changed-paths.txt" \
            --format github-output | tee -a "${GITHUB_OUTPUT}"

  rust-static:
    needs: select-static-units
    if: needs.select-static-units.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start shared tool runtime
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Run Rust static unit
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" exec --root "${GITHUB_WORKSPACE}" -- bash /usr/local/share/agent-canon/runtime/tools/ci/run_standalone_static_gate_unit.sh rust
      - name: Release shared tool runtime
        if: always()
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true

  contracts-static:
    needs: select-static-units
    if: needs.select-static-units.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start shared tool runtime
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Run contract static unit
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" exec --root "${GITHUB_WORKSPACE}" -- bash /usr/local/share/agent-canon/runtime/tools/ci/run_standalone_static_gate_unit.sh contracts
      - name: Release shared tool runtime
        if: always()
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true

  eval-static:
    needs: select-static-units
    if: needs.select-static-units.outputs.eval == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start shared tool runtime
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Run eval static unit
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" exec --root "${GITHUB_WORKSPACE}" -- bash /usr/local/share/agent-canon/runtime/tools/ci/run_standalone_static_gate_unit.sh eval
      - name: Release shared tool runtime
        if: always()
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true

  workflow-container-static:
    needs: select-static-units
    if: needs.select-static-units.outputs.workflow_container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start shared tool runtime
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Run workflow and container static unit
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" exec --root "${GITHUB_WORKSPACE}" -- bash /usr/local/share/agent-canon/runtime/tools/ci/run_standalone_static_gate_unit.sh workflow-container
      - name: Release shared tool runtime
        if: always()
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true

  static-gates:
    if: always()
    needs:
      - select-static-units
      - rust-static
      - contracts-static
      - eval-static
      - workflow-container-static
    runs-on: ubuntu-latest
    steps:
      - name: Read back selected PR execution units
        if: github.event_name == 'pull_request'
        env:
          SELECTOR_RESULT: ${{ needs.select-static-units.result }}
          SELECTED_UNITS: ${{ needs.select-static-units.outputs.units }}
          RUST_SELECTED: ${{ needs.select-static-units.outputs.rust }}
          CONTRACTS_SELECTED: ${{ needs.select-static-units.outputs.contracts }}
          EVAL_SELECTED: ${{ needs.select-static-units.outputs.eval }}
          WORKFLOW_CONTAINER_SELECTED: ${{ needs.select-static-units.outputs.workflow_container }}
          RUST_RESULT: ${{ needs.rust-static.result }}
          CONTRACTS_RESULT: ${{ needs.contracts-static.result }}
          EVAL_RESULT: ${{ needs.eval-static.result }}
          WORKFLOW_CONTAINER_RESULT: ${{ needs.workflow-container-static.result }}
        run: |
          test "${SELECTOR_RESULT}" = success
          printf 'selected_units=%s\n' "${SELECTED_UNITS}"
          check_unit() {
            selected="$1"
            result="$2"
            name="$3"
            printf '%s selected=%s result=%s\n' "${name}" "${selected}" "${result}"
            if [ "${selected}" = true ]; then
              test "${result}" = success
            else
              test "${result}" = skipped
            fi
          }
          check_unit "${RUST_SELECTED}" "${RUST_RESULT}" rust
          check_unit "${CONTRACTS_SELECTED}" "${CONTRACTS_RESULT}" contracts
          check_unit "${EVAL_SELECTED}" "${EVAL_RESULT}" eval
          check_unit "${WORKFLOW_CONTAINER_SELECTED}" "${WORKFLOW_CONTAINER_RESULT}" workflow-container

      - name: Checkout repository for manual full gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start shared tool runtime for manual full gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only
      - name: Run manual full gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          for unit in rust contracts eval workflow-container; do
            ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" \
              exec --root "${GITHUB_WORKSPACE}" -- bash \
              /usr/local/share/agent-canon/runtime/tools/ci/run_standalone_static_gate_unit.sh "${unit}"
          done
      - name: Release manual full-gate runtime
        if: always() && github.event_name == 'workflow_dispatch'
        run: ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true
