# @dependency-start
# contract configuration
# responsibility Runs standalone AgentCanon validation in semantic execution units while preserving one aggregate required check.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md agent-canon PR workflow
# upstream design ../../documents/runtime/runtime-profiles-and-check-matrix.md risk-based validation routing
# upstream implementation ../../tools/ci/run_standalone_static_gate_unit.sh executes one selected static-gate unit
# upstream implementation ../../tools/ci/check_agent_canon_pr.sh preserves the manual full-confidence route
# downstream implementation ../../tools/ci/check_github_workflows.py validates workflow and PR template conventions
# downstream test ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries
# @dependency-end

name: AgentCanon Static Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-canon-static-gates-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  rust-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Install Rust gate components
        run: rustup component add rustfmt clippy
      - name: Run Rust static unit
        run: bash tools/ci/run_standalone_static_gate_unit.sh rust

  contracts-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract gate dependencies
        run: python3 -m pip install --upgrade pyyaml tomli packaging
      - name: Run contract static unit
        run: bash tools/ci/run_standalone_static_gate_unit.sh contracts

  eval-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval gate dependencies
        run: python3 -m pip install --upgrade pyyaml tomli packaging
      - name: Run eval static unit
        run: bash tools/ci/run_standalone_static_gate_unit.sh eval

  workflow-container-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workflow gate dependencies
        run: python3 -m pip install --upgrade pyyaml tomli packaging pytest
      - name: Run workflow and container static unit
        run: bash tools/ci/run_standalone_static_gate_unit.sh workflow-container

  static-gates:
    if: always()
    needs:
      - rust-static
      - contracts-static
      - eval-static
      - workflow-container-static
    runs-on: ubuntu-latest
    steps:
      - name: Read back PR execution units
        if: github.event_name == 'pull_request'
        env:
          RUST_RESULT: ${{ needs.rust-static.result }}
          CONTRACTS_RESULT: ${{ needs.contracts-static.result }}
          EVAL_RESULT: ${{ needs.eval-static.result }}
          WORKFLOW_CONTAINER_RESULT: ${{ needs.workflow-container-static.result }}
        run: |
          printf 'rust=%s\ncontracts=%s\neval=%s\nworkflow_container=%s\n' \
            "${RUST_RESULT}" "${CONTRACTS_RESULT}" "${EVAL_RESULT}" "${WORKFLOW_CONTAINER_RESULT}"
          test "${RUST_RESULT}" = success
          test "${CONTRACTS_RESULT}" = success
          test "${EVAL_RESULT}" = success
          test "${WORKFLOW_CONTAINER_RESULT}" = success

      - name: Checkout repository for manual full gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Checkout AgentCanon submodule for manual full gate
        if: github.event_name == 'workflow_dispatch'
        env:
          AGENT_CANON_REPO_TOKEN: ${{ secrets.AGENT_CANON_REPO_TOKEN }}
          AGENT_CANON_REPO_SSH_KEY: ${{ secrets.AGENT_CANON_REPO_SSH_KEY }}
        run: bash tools/ci/checkout_agent_canon_submodule.sh
      - name: Setup Python for manual full gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install manual full-gate dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m pip install --upgrade pyyaml tomli packaging pytest
      - name: Install Rust components for manual full gate
        if: github.event_name == 'workflow_dispatch'
        run: rustup component add rustfmt clippy
      - name: Run manual full gate
        if: github.event_name == 'workflow_dispatch'
        env:
          AGENT_CANON_PR_READ_TOKEN: ${{ github.token }}
        run: bash tools/ci/check_agent_canon_pr.sh
