name: Refresh PR670 on main
on:
  pull_request:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    if: github.head_ref == 'canon/clean-detached-parent-update-605'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/clean-detached-parent-update-605
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pytest ruff pyright pyyaml tomli packaging
      - name: Merge current main and validate
        run: |
          git fetch origin main
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git merge --no-edit origin/main
          rm .github/workflows/refresh-pr670-main.yml
          python3 -m pytest -q tests/agent_tools/test_attach_clean_detached_submodule.py
          python3 -m ruff check tests/agent_tools/test_attach_clean_detached_submodule.py tools/agent_tools/attach_clean_detached_submodule.py
          python3 -m pyright tools/agent_tools/attach_clean_detached_submodule.py tests/agent_tools/test_attach_clean_detached_submodule.py
          bash -n tools/update_agent_canon.sh
          git diff --check
          git add -u .github/workflows/refresh-pr670-main.yml
          git commit -m 'ci: remove PR670 refresh workflow'
          git push origin HEAD:canon/clean-detached-parent-update-605
