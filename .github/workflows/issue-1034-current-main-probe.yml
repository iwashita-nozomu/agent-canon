# Diagnostic-only workflow for Issue #1034. The branch is reset after evidence capture.
name: Issue 1034 Current Main Graph Probe

on:
  push:
    branches:
      - diagnostic/1034-current-main-graph

permissions:
  contents: read

concurrency:
  group: issue-1034-current-main-graph
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AGENT_CANON_CONTROL_PARENT_ROOT: ${{ github.workspace }}/..
      AGENT_CANON_RUNTIME_ROOT: ${{ github.workspace }}/.runtime
      ISSUE_1034_SOURCE_HEAD: ff63216af172727619fd022a9ccbf7997eefff94
      ISSUE_1034_PR985_BASE: b466b022eb19d1c5922f2a83b92937b3aea70119
      ISSUE_1034_PROBE_DIR: ${{ github.workspace }}/.runtime/issue-1034-current-main
    steps:
      - name: Checkout exact current main with history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.ISSUE_1034_SOURCE_HEAD }}

      - name: Fetch the retained PR 985 head ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/pull/985/head:refs/remotes/origin/issue-1034-pr985-head'
          git cat-file -e "${ISSUE_1034_PR985_BASE}^{commit}"
          git cat-file -e 'refs/remotes/origin/issue-1034-pr985-head^{commit}'

      - name: Start shared tool runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ISSUE_1034_SOURCE_HEAD}"
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" install
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" start
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" target add --root "${GITHUB_WORKSPACE}" --mode read-only

      - name: Capture complete graph failures and migration inputs
        run: |
          set -euo pipefail
          mkdir -p "${ISSUE_1034_PROBE_DIR}"

          run_probe() {
            name="$1"
            shift
            set +e
            "$@" >"${ISSUE_1034_PROBE_DIR}/${name}.stdout" 2>"${ISSUE_1034_PROBE_DIR}/${name}.stderr"
            command_exit=$?
            set -e
            printf '%s\n' "${command_exit}" >"${ISSUE_1034_PROBE_DIR}/${name}.exit"
          }

          run_probe graph-build \
            ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" \
            exec --root "${GITHUB_WORKSPACE}" -- \
            agent-canon graph build --root . --profile default --format json

          run_probe graph-status \
            ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" \
            exec --root "${GITHUB_WORKSPACE}" -- \
            agent-canon graph status --root . --profile default --format json

          python3 - "${ISSUE_1034_PROBE_DIR}" "${AGENT_CANON_RUNTIME_ROOT}/container-state" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path, PurePosixPath

          probe = Path(sys.argv[1])
          state_root = Path(sys.argv[2])
          container_root = PurePosixPath("/var/lib/agent-canon/runtime")

          def host_path(container_path: str) -> Path:
              value = PurePosixPath(container_path)
              try:
                  relative = value.relative_to(container_root)
              except ValueError as exc:
                  raise RuntimeError(f"unexpected runtime path: {container_path}") from exc
              return state_root.joinpath(*relative.parts)

          for name in ("graph-build", "graph-status"):
              envelope = json.loads((probe / f"{name}.stderr").read_text(encoding="utf-8"))
              receipt = host_path(envelope["evidence"]["receipt_path"])
              payload = json.loads(receipt.read_text(encoding="utf-8"))
              shutil.copyfile(receipt, probe / f"{name}.receipt.json")
              details = payload["details"]
              for stream in ("stdout", "stderr"):
                  source = host_path(details[f"{stream}_log"])
                  shutil.copyfile(source, probe / f"{name}.full-{stream}.log")
          PY

          printf '%s\n' "$(git rev-parse HEAD)" >"${ISSUE_1034_PROBE_DIR}/source-head.txt"
          printf '%s\n' "$(git rev-parse refs/remotes/origin/issue-1034-pr985-head)" \
            >"${ISSUE_1034_PROBE_DIR}/pr985-head.txt"

          git archive --format=tar.gz --output="${ISSUE_1034_PROBE_DIR}/source-current.tar.gz" HEAD
          git archive --format=tar.gz --output="${ISSUE_1034_PROBE_DIR}/source-pr985-base.tar.gz" \
            "${ISSUE_1034_PR985_BASE}"
          git archive --format=tar.gz --output="${ISSUE_1034_PROBE_DIR}/source-pr985-head.tar.gz" \
            refs/remotes/origin/issue-1034-pr985-head

          git diff --find-renames=100% --name-status \
            "${ISSUE_1034_PR985_BASE}" refs/remotes/origin/issue-1034-pr985-head \
            >"${ISSUE_1034_PROBE_DIR}/pr985-name-status-r100.tsv"
          git diff --find-renames=50% --name-status \
            "${ISSUE_1034_PR985_BASE}" refs/remotes/origin/issue-1034-pr985-head \
            >"${ISSUE_1034_PROBE_DIR}/pr985-name-status-r50.tsv"
          git diff --find-renames=20% --name-status \
            "${ISSUE_1034_PR985_BASE}" refs/remotes/origin/issue-1034-pr985-head \
            >"${ISSUE_1034_PROBE_DIR}/pr985-name-status-r20.tsv"
          git diff --find-renames=20% --summary \
            "${ISSUE_1034_PR985_BASE}" refs/remotes/origin/issue-1034-pr985-head \
            >"${ISSUE_1034_PROBE_DIR}/pr985-summary-r20.txt"

      - name: Upload exact-main probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1034-current-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ISSUE_1034_PROBE_DIR }}

      - name: Preserve the expected current failure signal
        if: always()
        run: |
          set -euo pipefail
          test "$(cat "${ISSUE_1034_PROBE_DIR}/graph-build.exit")" = 1
          test "$(cat "${ISSUE_1034_PROBE_DIR}/graph-status.exit")" = 2
          python3 - "${ISSUE_1034_PROBE_DIR}/graph-build.full-stdout.log" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["unresolved_count"] == 532, payload["unresolved_count"]
          assert payload["ambiguous_count"] == 0, payload["ambiguous_count"]
          PY

      - name: Release shared tool runtime
        if: always()
        run: |
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" stop || true
          ./bootstrap.sh --control-parent-root "${AGENT_CANON_CONTROL_PARENT_ROOT}" --runtime-root "${AGENT_CANON_RUNTIME_ROOT}" uninstall || true
