name: Issue 771 parent projection smoke

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/issue-771-parent-smoke.yml

permissions:
  contents: read

jobs:
  parent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/771-canonical-deletion-admission

      - name: Run ensure-latest and update latest against empty root-absence set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import os
          import subprocess
          from pathlib import Path
          from types import ModuleType


          def load_module(name: str, path: str) -> ModuleType:
              module_path = Path(path).resolve()
              spec = importlib.util.spec_from_file_location(name, module_path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {module_path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          migration = load_module(
              "issue_771_surface_migration",
              "tests/tools/test_update_agent_canon_surface_migration.py",
          )
          lifecycle = load_module(
              "issue_771_update_lifecycle",
              "tests/tools/test_update_agent_canon.py",
          )


          def environment() -> dict[str, str]:
              env = dict(os.environ)
              env.update(
                  {
                      "AGENT_CANON_COMMIT_REQUEST_EVIDENCE": "evidence:" + "0" * 64,
                      "AGENT_CANON_BRANCH_WORKTREE_AUTHORITY": "user_request",
                      "AGENT_CANON_BRANCH_WORKTREE_REASON": "Issue 771 parent projection smoke",
                      "AGENT_CANON_DESTRUCTIVE_GIT_AUTHORITY": "explicit_user_approval",
                      "AGENT_CANON_DESTRUCTIVE_GIT_REASON": "Issue 771 parent projection smoke",
                      "AGENT_CANON_FORCE_RELINK": "1",
                  }
              )
              return env


          def preserve_or_fail(
              root: Path, result: subprocess.CompletedProcess[str]
          ) -> None:
              print(result.stdout)
              print(result.stderr)
              if result.returncode != 0:
                  raise RuntimeError(
                      f"parent projection failed with {result.returncode}"
                  )
              sentinel = root / "parent-checkout-sentinel.txt"
              if sentinel.read_text(encoding="utf-8") != "preserve\n":
                  raise RuntimeError("parent sentinel changed")
              if not (root / ".git").exists():
                  raise RuntimeError("parent checkout root was removed")


          ensure_case = migration.SurfaceMigrationTest(methodName="runTest")
          try:
              ensure_root = ensure_case.clone_parent_fixture()
              (ensure_root / "parent-checkout-sentinel.txt").write_text(
                  "preserve\n", encoding="utf-8"
              )
              ensure_result = ensure_case.run_sync(
                  ensure_root, "ensure-latest", "main"
              )
              preserve_or_fail(ensure_root, ensure_result)
          finally:
              ensure_case.doCleanups()

          update_case = migration.SurfaceMigrationTest(methodName="runTest")
          try:
              update_root = update_case.clone_parent_fixture()
              (update_root / "parent-checkout-sentinel.txt").write_text(
                  "preserve\n", encoding="utf-8"
              )
              source = update_root / "vendor" / "agent-canon"
              source_remote = Path(
                  subprocess.run(
                      ["git", "-C", str(source), "remote", "get-url", "origin"],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.strip()
              )
              lifecycle_case = lifecycle.SubmoduleUpdateAgentCanonTest(
                  methodName="runTest"
              )
              lifecycle_case.materialize_parent_projection_frontier(
                  update_root, source_remote
              )
              update_result = subprocess.run(
                  [
                      "bash",
                      str(source / "tools" / "update_agent_canon.sh"),
                      "latest",
                      "main",
                  ],
                  cwd=update_root,
                  check=False,
                  capture_output=True,
                  text=True,
                  env=environment(),
              )
              preserve_or_fail(update_root, update_result)
          finally:
              update_case.doCleanups()
          PY
