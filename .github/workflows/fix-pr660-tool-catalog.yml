name: Fix PR660 tool catalog regression
on:
  pull_request:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.head_ref == 'canon/parent-bounded-side-effects-20260810'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/parent-bounded-side-effects-20260810
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pytest pyyaml tomli packaging ruff
      - name: Patch root-relative tool extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/agent_tools/tool_catalog.py')
          s = p.read_text()
          old = 'TOOL_REFERENCE_RE = re.compile(\n    r"(?<!tests/)\\btools/[A-Za-z0-9_./-]+\\.(?:py|sh)\\b"\n)'
          new = 'TOOL_REFERENCE_RE = re.compile(\n    r"(?<![A-Za-z0-9_./-])tools/[A-Za-z0-9_./-]+\\.(?:py|sh)\\b"\n)'
          if s.count(old) != 1:
              raise SystemExit('tool regex anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/agent_tools/test_tool_catalog.py')
          s = t.read_text()
          needle = '                "python3 tools/agent_tools/uncataloged.py\\n"'
          if s.count(needle) < 1:
              raise SystemExit('uncataloged fixture anchor missing')
          s = s.replace(
              needle,
              '                "python3 tests/tools/tools/run_symlink_lint.py\\n"\n' + needle,
              1,
          )
          assertion = '        self.assertIn("tools/agent_tools/uncataloged.py", matches)'
          if s.count(assertion) < 1:
              raise SystemExit('catalog assertion anchor missing')
          s = s.replace(
              assertion,
              '        self.assertNotIn("tools/tools/run_symlink_lint.py", matches)\n' + assertion,
              1,
          )
          t.write_text(s)
          PY
      - name: Validate focused catalog behavior
        run: |
          python3 -m pytest -q tests/agent_tools/test_tool_catalog.py::CheckToolCatalogTest::test_test_paths_are_not_default_tool_references
          python3 tools/agent_tools/tool_catalog.py --root .
          python3 -m ruff check --select E9,F,I tools/agent_tools/tool_catalog.py tests/agent_tools/test_tool_catalog.py
          git diff --check
      - name: Merge current main and revalidate
        run: |
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git add tools/agent_tools/tool_catalog.py tests/agent_tools/test_tool_catalog.py
          git commit -m 'fix: bound tool catalog references to repository root'
          git fetch origin main
          git merge --no-edit origin/main
          python3 -m pytest -q tests/agent_tools/test_tool_catalog.py::CheckToolCatalogTest::test_test_paths_are_not_default_tool_references
          python3 tools/agent_tools/tool_catalog.py --root .
          rm .github/workflows/fix-pr660-tool-catalog.yml
          git add -u .github/workflows/fix-pr660-tool-catalog.yml
          git commit -m 'ci: remove PR660 fix workflow'
          git push origin HEAD:canon/parent-bounded-side-effects-20260810
