# One-shot delivery workflow; removes itself after applying the source-owned fix.
name: Issue 706 container preflight documentation patch

on:
  push:
    branches:
      - fix/docker-run-repository-tests-20260814

permissions:
  contents: write

jobs:
  apply-container-preflight-doc-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/docker-run-repository-tests-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact documentation transformation
        run: python3 tools/ci/issue_706_apply_container_preflight_doc_patch.py

      - name: Commit correction and remove transient patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/issue-706-container-preflight-doc-patch.yml \
            tools/ci/issue_706_apply_container_preflight_doc_patch.py
          git add agents/skills/environment-maintenance.md
          git diff --check --cached
          git commit -m "docs: restore supplementary container preflight (#706)"
          git push origin HEAD:fix/docker-run-repository-tests-20260814
