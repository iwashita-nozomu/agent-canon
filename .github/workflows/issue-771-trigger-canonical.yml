name: Issue 771 canonical materialization trigger

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/issue-771-trigger-canonical.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/771-canonical-deletion-admission

      - name: Execute canonical implementation and validation stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(
              ".github/workflows/issue-771-materialize-canonical.yml"
          ).read_text(encoding="utf-8")
          lines = workflow.splitlines()
          scripts: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] != "        run: |":
                  index += 1
                  continue
              index += 1
              block: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("          "):
                      block.append(line[10:])
                      index += 1
                      continue
                  if not line:
                      block.append("")
                      index += 1
                      continue
                  break
              scripts.append("\n".join(block))
          if len(scripts) != 4:
              raise RuntimeError(
                  f"expected four materialization scripts, found {len(scripts)}"
              )

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", scripts[0]],
              check=True,
          )

          source_path = Path("tools/agent_tools/surface_manifest.py")
          source = source_path.read_text(encoding="utf-8")
          resolution_start_needle = "\n".join(
              (
                  "        try:",
                  "            canonical_path = (",
                  "                canonical_root / normalized",
                  "            ).resolve(strict=False)",
              )
          )
          resolution_end_needle = (
              "        if canonical_path == canonical_root:\n"
          )
          resolution_start = source.index(resolution_start_needle)
          resolution_end = source.index(
              resolution_end_needle, resolution_start
          ) + len(resolution_end_needle)
          replacement = "\n".join(
              (
                  "        candidate_path = canonical_root / normalized",
                  "        try:",
                  "            canonical_parent = (",
                  "                candidate_path.parent.resolve(strict=False)",
                  "            )",
                  "        except (OSError, RuntimeError) as exc:",
                  "            raise ValueError(",
                  "                f\"{owner}: deletion target {raw_path!r} cannot be resolved\"",
                  "            ) from exc",
                  "        canonical_path = canonical_parent / candidate_path.name",
                  "        if canonical_path == canonical_root:",
                  "",
              )
          )
          source_path.write_text(
              source[:resolution_start] + replacement + source[resolution_end:],
              encoding="utf-8",
          )

          test_path = Path(
              "tests/agent_tools/test_surface_manifest_deletion_targets.py"
          )
          test_text = test_path.read_text(encoding="utf-8")
          test_start = test_text.index(
              "    def test_canonical_root_alias_and_symlink_escape_fail_closed"
          )
          test_end = test_text.index(
              "    def test_safe_target_carries_owner_and_canonical_descendant",
              test_start,
          )
          replacement_test = "\n".join(
              (
                  "    def test_intermediate_symlink_escape_fails_closed(self) -> None:",
                  '        """Canonical parent resolution rejects repository escapes."""',
                  "        with self.temporary_directory() as tmp_dir:",
                  "            sandbox = Path(tmp_dir)",
                  '            root = sandbox / "checkout"',
                  '            outside = sandbox / "outside"',
                  "            root.mkdir()",
                  "            outside.mkdir()",
                  '            os.symlink(outside, root / "outside-alias")',
                  '            self.assert_rejected(root, "outside-alias/retired")',
                  "",
                  "    def test_final_symlink_is_admitted_as_an_lstat_leaf(self) -> None:",
                  '        """Admission does not dereference the leaf that removal unlinks."""',
                  "        with self.temporary_directory() as tmp_dir:",
                  "            sandbox = Path(tmp_dir)",
                  '            root = sandbox / "checkout"',
                  '            outside = sandbox / "outside"',
                  "            root.mkdir()",
                  "            outside.mkdir()",
                  '            os.symlink(outside, root / "retired")',
                  "            manifest_path = self.write_manifest(",
                  '                root, root_absent_paths=("retired",)',
                  "            )",
                  '            manifest = load_manifest(root, ".", manifest_path.name)',
                  "            target = manifest.deletion_targets[0]",
                  "            self.assertEqual(",
                  '                target.canonical_path, root.resolve() / "retired"',
                  "            )",
                  "            result = self.run_manifest(",
                  '                root, manifest_path, "root-absent-paths"',
                  "            )",
                  "            self.assertEqual(result.returncode, 0, result.stderr)",
                  '            self.assertEqual(result.stdout, "retired\\n")',
                  "",
                  "",
              )
          )
          test_path.write_text(
              test_text[:test_start] + replacement_test + test_text[test_end:],
              encoding="utf-8",
          )

          for script in scripts[1:3]:
              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", script],
                  check=True,
              )
          PY

      - name: Commit the reviewable implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentCanon Issue Automation"
          git config user.email "agent-canon-issue@automation.invalid"
          git rm \
            .github/workflows/issue-771-materialize-canonical.yml \
            .github/workflows/issue-771-trigger-canonical.yml
          git add \
            tools/agent_tools/surface_manifest.py \
            tests/agent_tools/test_surface_manifest_root_absence.py \
            tests/agent_tools/test_surface_manifest_deletion_targets.py
          git diff --cached --check
          git commit -m "fix: admit only task-owned deletion targets (#771)"
          git push origin HEAD:fix/771-canonical-deletion-admission
