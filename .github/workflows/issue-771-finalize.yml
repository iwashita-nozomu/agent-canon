name: Issue 771 finalization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/issue-771-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/771-root-delete-guard

      - name: Materialize implementation from the reviewed patch step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-771-materialize.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply fail-closed sync protocol patch'
          start = lines.index(marker)
          run_start = next(
              index for index in range(start + 1, len(lines))
              if lines[index] == '        run: |'
          ) + 1
          end = next(
              index for index in range(run_start, len(lines))
              if lines[index].startswith('      - name: ')
          )
          script_lines = [
              line[10:] if line.startswith('          ') else line
              for line in lines[run_start:end]
          ]
          Path('/tmp/issue-771-materialize.sh').write_text(
              '\n'.join(script_lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/issue-771-materialize.sh

      - name: Run focused producer and parent-update regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/agent_tools/test_surface_manifest_root_absence.py
          python3 tests/agent_tools/test_surface_manifest_sync_protocol.py
          python3 tests/tools/test_update_agent_canon_removed_legacy.py
          python3 - <<'PY'
          from pathlib import Path
          import tempfile

          from tests.tools.test_update_agent_canon_latest_todos import (
              test_latest_reports_pending_update_todos_without_failing,
          )

          with tempfile.TemporaryDirectory() as tmp_dir:
              test_latest_reports_pending_update_todos_without_failing(Path(tmp_dir))
          PY

      - name: Run exact /workspace bind-mount regression
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.agent-canon/issue-771-bind-source"
          rm -rf "$fixture"
          mkdir -p "$fixture/.git"
          printf 'ref: refs/heads/main\n' > "$fixture/.git/HEAD"
          cat > "$fixture/manifest.toml" <<'EOF'
          version = 1
          prefix = "."
          integration_mode = "live-agent-canon"
          default_consumer = false
          selection = "explicit-opt-in"
          EOF
          sudo env REPO="$GITHUB_WORKSPACE" FIXTURE="$fixture" \
            unshare --mount --propagation private sh -eu -c '
              mkdir -p /workspace
              mount --bind "$FIXTURE" /workspace
              trap "umount /workspace; rmdir /workspace 2>/dev/null || true" EXIT
              python3 "$REPO/tools/agent_tools/surface_manifest.py" \
                --root /workspace --prefix . --manifest manifest.toml \
                regular-specs > /tmp/issue-771-specs
              test ! -s /tmp/issue-771-specs
              ROOT_DIR=/workspace
              while IFS= read -r spec; do
                path=${spec%%:*}
                rm -rf -- "$ROOT_DIR/$path"
              done < /tmp/issue-771-specs
              test -f /workspace/.git/HEAD
            '

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentCanon Issue Automation"
          git config user.email "agent-canon-issue@automation.invalid"
          git add \
            tools/agent_tools/surface_manifest.py \
            tests/agent_tools/test_surface_manifest_sync_protocol.py
          git diff --cached --check
          git commit -m "fix: fail closed on root sync targets (#771)"
          git push origin HEAD:fix/771-root-delete-guard
