# @dependency-start
# contract configuration
# responsibility Verifies the thin root entrypoint owner-map contract on pull requests.
# upstream design ../../documents/design/entrypoint-owner-map.md structural grammar and ownership contract
# upstream implementation ../../tools/runtime/dispatch/agent-canon/src/entrypoint_owner_map.rs verifier
# upstream implementation ../../tests/agent_tools/test_check_entrypoint_owner_map.py regression suite
# @dependency-end

name: Entrypoint Owner Map

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrypoint-owner-map-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build exact source CLI
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/entrypoint-owner-map-cargo
        run: cargo build --locked --manifest-path tools/runtime/dispatch/agent-canon/Cargo.toml
      - name: Verify entrypoint grammar
        env:
          AGENT_CANON_CLI: ${{ runner.temp }}/entrypoint-owner-map-cargo/debug/agent-canon
        run: "$AGENT_CANON_CLI" docs check-entrypoints --root . --format json
      - name: Run entrypoint regression tests
        env:
          AGENT_CANON_CLI: ${{ runner.temp }}/entrypoint-owner-map-cargo/debug/agent-canon
        run: python3 -m unittest tests.agent_tools.test_check_entrypoint_owner_map -v
