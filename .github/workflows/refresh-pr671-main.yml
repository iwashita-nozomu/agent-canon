name: Refresh PR671 on main
on:
  pull_request:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    if: github.head_ref == 'canon/close-devcontainer-design-diagnostics-614'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/close-devcontainer-design-diagnostics-614
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pyyaml tomli packaging
      - name: Merge current main and validate
        run: |
          git fetch origin main
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git merge --no-edit origin/main
          rm .github/workflows/refresh-pr671-main.yml
          python3 tools/agent_tools/check_design_doc_claims.py --root . documents/design/devcontainer/parent-devcontainer-policy.md
          python3 tools/agent_tools/prose_reasoning_graph.py check-document documents/design/devcontainer/parent-devcontainer-policy.md --profile all
          tools/bin/agent-canon docs check documents/design/devcontainer/parent-devcontainer-policy.md
          bash tools/agent_tools/check_dependency_header_format.sh --changed --require-header
          git diff --check
          git add -u .github/workflows/refresh-pr671-main.yml
          git commit -m 'ci: remove PR671 refresh workflow'
          git push origin HEAD:canon/close-devcontainer-design-diagnostics-614
