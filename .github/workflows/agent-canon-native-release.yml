# @dependency-start
# contract configuration
# responsibility Builds and packages the native AgentCanon CLI for supported host platforms.
# upstream implementation ../../tools/runtime/dispatch/agent-canon/Cargo.toml native executable crate
# upstream implementation ../../tools/agent/templates/template_bundle.py source-bound archive producer
# upstream implementation ../../tools/repository/github/native_release.py verified draft publication
# downstream implementation ../../tests/agent_tools/test_native_cli_distribution.py source-free package smoke
# downstream implementation ../../tests/agent_tools/test_native_release.py integrity and recovery contracts
# @dependency-end

name: AgentCanon native CLI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a stable release for this source revision
        required: true
        type: boolean
        default: false
      release_tag:
        description: Version tag when publish_release is enabled
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: agent-canon-native-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Distribution contracts
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test release integrity and recovery with the standard library
        run: python -S -m unittest -v tests.agent_tools.test_native_release

      - name: Select the matrix and validate publication input
        id: plan
        env:
          PUBLISH_REQUEST: ${{ inputs.publish_release }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          MATRIX_JSON: >-
            {
              "include": [
                {
                  "target": "x86_64-unknown-linux-gnu",
                  "runs_on": "ubuntu-24.04",
                  "executable": "agent-canon",
                  "rustflags": ""
                },
                {
                  "target": "aarch64-unknown-linux-gnu",
                  "runs_on": "ubuntu-24.04-arm",
                  "executable": "agent-canon",
                  "rustflags": ""
                },
                {
                  "target": "x86_64-apple-darwin",
                  "runs_on": "macos-15-intel",
                  "executable": "agent-canon",
                  "rustflags": ""
                },
                {
                  "target": "aarch64-apple-darwin",
                  "runs_on": "macos-15",
                  "executable": "agent-canon",
                  "rustflags": ""
                },
                {
                  "target": "x86_64-pc-windows-msvc",
                  "runs_on": "windows-2025",
                  "executable": "agent-canon.exe",
                  "rustflags": "-C target-feature=+crt-static"
                }
              ]
            }
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          matrix = json.loads(os.environ["MATRIX_JSON"])
          manifest = pathlib.Path("tools/runtime/dispatch/agent-canon/Cargo.toml")
          version = tomllib.loads(manifest.read_text())["package"]["version"]
          tagged = os.environ["GITHUB_REF"].startswith("refs/tags/v")
          publish = (os.environ["GITHUB_EVENT_NAME"] == "push" and tagged) or os.environ.get("PUBLISH_REQUEST") == "true"
          tag = os.environ.get("RELEASE_TAG_INPUT") or (os.environ["GITHUB_REF_NAME"] if tagged else "")
          if not publish:
              tag = ""
          if publish and tag != "v" + version:
              raise SystemExit("release tag must match Cargo version v" + version)
          outputs = {
              "matrix": json.dumps(matrix, separators=(",", ":")),
              "targets": json.dumps([row["target"] for row in matrix["include"]]),
              "version": version,
              "tag": tag,
              "publish": str(publish).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare the manifest producer used by Rust graph tests
        run: python -m pip install PyYAML

      - name: Record host toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          cargo -V
          python -V
          python -c 'import yaml; print("PyYAML=" + yaml.__version__)'

      - name: Check and build the native executable
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-canon-cargo-${{ matrix.target }}
        run: |
          set -euo pipefail
          manifest=tools/runtime/dispatch/agent-canon/Cargo.toml
          log="$RUNNER_TEMP/native-checks.log"
          cargo fmt --manifest-path "$manifest" -- --check 2>&1 | tee "$log"
          cargo clippy --locked --release --manifest-path "$manifest" --all-targets -- -D warnings 2>&1 | tee -a "$log"
          cargo test --locked --release --manifest-path "$manifest" 2>&1 | tee -a "$log"
          cargo build --locked --release --manifest-path "$manifest" 2>&1 | tee -a "$log"
          test -f "$CARGO_TARGET_DIR/release/$EXECUTABLE"

      - name: Package and smoke the source-free archives
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-canon-cargo-${{ matrix.target }}
          PACKAGE_DIR: ${{ runner.temp }}/agent-canon-native-package
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python tools/agent/templates/template_bundle.py native-package \
            --source-root "$GITHUB_WORKSPACE" --source-ref HEAD \
            --binary "$CARGO_TARGET_DIR/release/$EXECUTABLE" --target "$TARGET" \
            --output "$PACKAGE_DIR" \
            --toolchain "rustc=$(rustc -V); cargo=$(cargo -V); rustflags=$RUSTFLAGS"
          python tools/agent/templates/template_bundle.py native-verify \
            --source-root "$GITHUB_WORKSPACE" --source-ref HEAD \
            --root "$PACKAGE_DIR" --target "$TARGET"
          python tests/agent_tools/test_native_cli_distribution.py \
            --package-dir "$PACKAGE_DIR" --target "$TARGET" --version "$VERSION"

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-cli-checks-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checks.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload OS and architecture archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-canon-native-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-canon-native-package/*
          if-no-files-found: error
          retention-days: 14

  check:
    name: native-cli
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete native validation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          [[ "$PREPARE_RESULT" == success && "$BUILD_RESULT" == success ]]

  publish-release:
    name: Publish verified native release
    needs: [prepare, check]
    if: >-
      needs.check.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      )
    runs-on: ubuntu-24.04
    concurrency:
      group: agent-canon-native-publication-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Select retained native artifacts by ID
        id: artifacts
        env:
          TARGETS_JSON: ${{ needs.prepare.outputs.targets }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from tools.repository.github.native_release import select_native_artifacts

          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          pages = json.loads(subprocess.check_output(["gh", "api", endpoint, "--paginate", "--slurp"], text=True))
          artifacts = [row for page in pages for row in page["artifacts"]]
          selected = select_native_artifacts(artifacts, json.loads(os.environ["TARGETS_JSON"]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("ids=" + ",".join(str(row["artifact_id"]) for row in selected), file=output)
          print(json.dumps(selected))
          PY

      - name: Download the verified platform archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: ${{ runner.temp }}/agent-canon-native-release
          merge-multiple: true

      - name: Verify, resume and publish the release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGETS_JSON: ${{ needs.prepare.outputs.targets }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["TARGETS_JSON"])))')
          target_args=()
          for target in "${targets[@]}"; do
            target_args+=(--target "$target")
          done
          python tools/repository/github/native_release.py \
            --source-root "$GITHUB_WORKSPACE" --source-ref HEAD \
            --artifacts "$RUNNER_TEMP/agent-canon-native-release" \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" "${target_args[@]}" \
            > "$RUNNER_TEMP/native-publication.json"
          cat "$RUNNER_TEMP/native-publication.json"

      - name: Upload publication readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-cli-publication-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-publication.json
          if-no-files-found: ignore
          retention-days: 14
