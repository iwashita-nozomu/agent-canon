# @dependency-start
# contract configuration
# responsibility Builds and packages the native AgentCanon CLI for supported host platforms.
# upstream implementation ../../tools/runtime/dispatch/agent-canon/Cargo.toml native executable crate
# upstream implementation ../../tools/agent/templates/template_bundle.py source-bound archive producer
# downstream implementation ../../tests/agent_tools/test_native_cli_distribution.py source-free package smoke
# @dependency-end

name: AgentCanon native CLI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release for this source revision
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag to create when publish_release is enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-canon-native-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
            executable: agent-canon
            rustflags: ""
          - target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
            executable: agent-canon
            rustflags: ""
          - target: x86_64-apple-darwin
            runs_on: macos-15-intel
            executable: agent-canon
            rustflags: ""
          - target: aarch64-apple-darwin
            runs_on: macos-15
            executable: agent-canon
            rustflags: ""
          - target: x86_64-pc-windows-msvc
            runs_on: windows-2025
            executable: agent-canon.exe
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.runs_on }}
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record host toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          cargo -V
          python -V

      - name: Build the native executable
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-canon-cargo-${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --manifest-path tools/runtime/dispatch/agent-canon/Cargo.toml
          test -f "$CARGO_TARGET_DIR/release/$EXECUTABLE"

      - name: Package and smoke the source-free archives
        id: package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-canon-cargo-${{ matrix.target }}
          PACKAGE_DIR: ${{ runner.temp }}/agent-canon-native-package
        run: |
          set -euo pipefail
          package_result="$(
            python tools/agent/templates/template_bundle.py native-package \
              --source-root "$GITHUB_WORKSPACE" \
              --source-ref HEAD \
              --binary "$CARGO_TARGET_DIR/release/$EXECUTABLE" \
              --target "$TARGET" \
              --output "$PACKAGE_DIR" \
              --toolchain "rustc=$(rustc -V); cargo=$(cargo -V); rustflags=$RUSTFLAGS"
          )"
          printf '%s\n' "$package_result"
          version="$(printf '%s\n' "$package_result" | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          python tests/agent_tools/test_native_cli_distribution.py \
            --package-dir "$PACKAGE_DIR" \
            --target "$TARGET" \
            --version "$version"

      - name: Upload OS and architecture archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-canon-native-${{ matrix.target }}
          path: ${{ runner.temp }}/agent-canon-native-package/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish explicit native release
    needs: build
    if: >-
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: agent-canon-native-*
          path: ${{ runner.temp }}/agent-canon-native-release
          merge-multiple: true

      - name: Publish archives for the matching crate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] || \
             [[ "$GITHUB_REF" == refs/tags/v* && -z "$RELEASE_TAG_INPUT" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$RELEASE_TAG_INPUT"
          fi
          if [[ -z "$release_tag" ]]; then
            echo "release_tag is required when publish_release is enabled" >&2
            exit 2
          fi
          release_dir="${RUNNER_TEMP}/agent-canon-native-release"
          version="$(python - "$release_dir" <<'PY'
          import json
          import pathlib
          import sys
          import tarfile

          root = pathlib.Path(sys.argv[1])
          archives = sorted(root.glob("*.tar.gz"))
          if len(archives) != 5:
              raise SystemExit("expected one tar.gz archive for each of five targets")
          versions = set()
          for path in archives:
              with tarfile.open(path, "r:gz") as archive:
                  matches = [
                      member
                      for member in archive.getmembers()
                      if member.name.endswith("share/agent-canon/provenance.json")
                  ]
                  if len(matches) != 1:
                      raise SystemExit(f"invalid provenance in {path.name}")
                  stream = archive.extractfile(matches[0])
                  if stream is None:
                      raise SystemExit(f"unreadable provenance in {path.name}")
                  versions.add(json.load(stream)["version"])
          if len(versions) != 1:
              raise SystemExit("native package versions do not match")
          print(versions.pop())
          PY
          )"
          if [[ "$release_tag" != "v$version" ]]; then
            echo "release tag must match the native crate version v$version" >&2
            exit 2
          fi
          mapfile -t assets < <(find "$release_dir" -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 20 ]]; then
            echo "expected two archive formats and checksums for five targets" >&2
            exit 2
          fi
          gh release create "$release_tag" "${assets[@]}" \
            --title "AgentCanon $release_tag" \
            --generate-notes
