name: issue-746-750-reduction-patch

on:
  push:
    branches:
      - fix/746-750-canonical-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/746-750-canonical-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest PyYAML
      - name: Remove over-strict checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          path = Path('tools/experiments/execution_resource_plan.py')
          text = path.read_text(encoding='utf-8')

          old_fixed = '''    fixed_core = (\n        "tools/experiments/execution_resource_plan.py",\n        "tools/experiments/run_managed_experiment.py",\n        "tools/experiments/registry_lib.py",\n        "tools/agent_tools/jit_canonical_ir.py",\n    )\n    result: list[str] = []\n    for relative_path in fixed_core:\n        candidate = source_root / relative_path\n        if not candidate.is_file():\n            raise TypedPreflightFailure(\n                "gpu_source_path_missing",\n                "a fixed managed source path is missing",\n                relative_path=relative_path,\n            )\n        result.append(relative_path)\n'''
          if old_fixed not in text:
              raise SystemExit('fixed managed source check block not found')
          text = text.replace(old_fixed, '    result: list[str] = []\n', 1)

          old_regex = '_NVIDIA_UNSAFE_XML_RE = re.compile(r"<!\\s*(?:DOCTYPE|ENTITY)\\b", re.IGNORECASE)'
          new_regex = '_NVIDIA_UNSAFE_XML_RE = re.compile(r"<!\\s*ENTITY\\b", re.IGNORECASE)'
          if old_regex not in text:
              raise SystemExit('NVIDIA XML rejection regex not found')
          text = text.replace(old_regex, new_regex, 1)

          old_message = '"NVIDIA XML must not contain DTD or entity declarations",'
          if old_message not in text:
              raise SystemExit('NVIDIA XML rejection message not found')
          text = text.replace(old_message, '"NVIDIA XML must not contain entity declarations",', 1)
          path.write_text(text, encoding='utf-8')

          fixture = Path('tests/fixtures/nvidia/nvidia_smi_query.xml')
          fixture_text = fixture.read_text(encoding='utf-8')
          doctype = '<!DOCTYPE nvidia_smi_log SYSTEM "nvsmi_device_v11.dtd">\n'
          if doctype not in fixture_text:
              lines = fixture_text.splitlines(keepends=True)
              lines.insert(1 if lines and lines[0].lstrip().startswith('<?xml') else 0, doctype)
              fixture_text = ''.join(lines)
              fixture.write_text(fixture_text, encoding='utf-8')

          raw = fixture.read_bytes()
          manifest_path = Path('tests/fixtures/nvidia/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          records = manifest['records']
          records[:] = [record for record in records if record.get('id') != 'xml.reject.dtd']
          valid = next(record for record in records if record.get('id') == 'xml.valid.pi_comment')
          valid['byte_count'] = len(raw)
          valid['raw_sha256'] = hashlib.sha256(raw).hexdigest()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('tests/fixtures/nvidia/nvidia_smi_query_dtd_invalid.xml').unlink(missing_ok=True)

          test_path = Path('tests/tools/test_execution_resource_plan.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_case = '''            "xml.reject.dtd",\n'''
          if old_case not in test_text:
              raise SystemExit('obsolete DTD rejection test case not found')
          test_path.write_text(test_text.replace(old_case, '', 1), encoding='utf-8')
          PY
      - name: Validate focused tests
        run: |
          python -m unittest tests.tools.test_execution_resource_plan
          python -m pytest -q tests/tools/test_run_gpu_command.py tests/tools/test_run_managed_experiment.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/experiments/execution_resource_plan.py tests/tools/test_execution_resource_plan.py tests/fixtures/nvidia/nvidia_smi_query.xml tests/fixtures/nvidia/manifest.json tests/fixtures/nvidia/nvidia_smi_query_dtd_invalid.xml
          git commit -m 'fix: remove over-strict checks for #746 #750 [skip agent-patch]'
          git push origin HEAD:fix/746-750-canonical-boundaries
