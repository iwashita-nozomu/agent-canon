name: PR671 independent validation

on:
  push:
    branches:
      - canon/close-devcontainer-design-diagnostics-614

concurrency:
  group: pr671-independent-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/close-devcontainer-design-diagnostics-614
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checker dependencies
        run: python3 -m pip install --upgrade pyyaml tomli packaging
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git merge --no-edit origin/main
          echo "main_head=$(git rev-parse origin/main)"
          echo "validation_merge=$(git rev-parse HEAD)"
      - name: Rebuild canonical graph, classify main blocker, and rebuild fresh graph
        run: |
          mkdir -p "$RUNNER_TEMP/pr671-graph-staging" "$RUNNER_TEMP/pr671-cargo-target"
          set +e
          TMPDIR="$RUNNER_TEMP/pr671-graph-staging" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/pr671-cargo-target" \
            cargo run --manifest-path rust/agent-canon/Cargo.toml -- graph build --root "$GITHUB_WORKSPACE" \
            | tee /tmp/pr671-graph-blocked.json
          blocked_rc=${PIPESTATUS[0]}
          set -e
          python3 - "$blocked_rc" <<'PY'
          import json
          import sys

          result = json.load(open('/tmp/pr671-graph-blocked.json', encoding='utf-8'))
          assert int(sys.argv[1]) == 1
          assert result['integration_record']['verified'] is True
          assert result['ambiguous_count'] == 0
          assert result['uncovered_count'] == 0
          assert result['unresolved_count'] == 1
          finding = result['unresolved'][0]
          assert finding['code'] == 'manifest-grammar'
          assert finding['message'] == '.github/workflows/agent-canon-static-gates.yml:10:downstream test ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries and selection'
          print('canonical_graph=blocked_by_exact_current_main_manifest_grammar')
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-canon-static-gates.yml')
          text = path.read_text(encoding='utf-8')
          old = '# downstream test ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries and selection'
          new = '# downstream implementation ../../tests/tools/test_standalone_static_gate_units.py validates execution-unit boundaries and selection'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -rf "$RUNNER_TEMP/pr671-graph-staging"
          mkdir -p "$RUNNER_TEMP/pr671-graph-staging"
          TMPDIR="$RUNNER_TEMP/pr671-graph-staging" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/pr671-cargo-target" \
            cargo run --manifest-path rust/agent-canon/Cargo.toml -- graph build --root "$GITHUB_WORKSPACE" \
            | tee /tmp/pr671-graph-fresh.json
          python3 - <<'PY'
          import json

          result = json.load(open('/tmp/pr671-graph-fresh.json', encoding='utf-8'))
          assert result['status'] == 'fresh'
          assert result['graph_status'] == 'fresh'
          assert result['integration_record']['verified'] is True
          assert result['unresolved_count'] == 0
          assert result['ambiguous_count'] == 0
          assert result['uncovered_count'] == 0
          print('canonical_graph=fresh_after_ephemeral_current_main_normalization')
          print(f"graph_fingerprint={result['graph_fingerprint']}")
          print(f"input_fingerprint={result['input_fingerprint']}")
          PY
      - name: Check design claims
        run: python3 tools/agent_tools/check_design_doc_claims.py --root . documents/design/devcontainer/parent-devcontainer-policy.md
      - name: Check prose reasoning graph and print diagnostics
        run: |
          rm -rf "$RUNNER_TEMP/pr671-parent"
          git init -q -b main "$RUNNER_TEMP/pr671-parent"
          git -C "$RUNNER_TEMP/pr671-parent" config user.name agent-canon-validation
          git -C "$RUNNER_TEMP/pr671-parent" config user.email agent-canon-validation@users.noreply.github.com
          git -C "$RUNNER_TEMP/pr671-parent" remote add origin https://example.invalid/pr671-validation-parent.git
          git -C "$RUNNER_TEMP/pr671-parent" commit --allow-empty -m 'initialize validation parent'
          out=$(mktemp -d -p "$RUNNER_TEMP" pr671-prose.XXXXXX)
          AGENT_CANON_PARENT_ROOT="$RUNNER_TEMP/pr671-parent" \
            python3 tools/agent_tools/prose_reasoning_graph.py check-document documents/design/devcontainer/parent-devcontainer-policy.md --profile all --out-dir "$out"
          echo "diagnostic_output=$out"
          find "$out" -maxdepth 2 -type f -print -exec sed -n '1,400p' {} \;
      - name: Check docs
        run: |
          mkdir -p "$RUNNER_TEMP/pr671-docs-tmp"
          AGENT_CANON_PARENT_ROOT="$RUNNER_TEMP/pr671-parent" \
          TMPDIR="$RUNNER_TEMP/pr671-docs-tmp" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/pr671-cargo-target" \
            tools/bin/agent-canon docs check documents/design/devcontainer/parent-devcontainer-policy.md
      - name: Check dependency header and whitespace
        run: |
          bash tools/agent_tools/check_dependency_header_format.sh --require-header documents/design/devcontainer/parent-devcontainer-policy.md
          git diff --check origin/main...HEAD
      - name: Validate final scope and read back document
        run: |
          git checkout -- .github/workflows/agent-canon-static-gates.yml
          changed=$(git diff --name-only origin/main...HEAD -- . ':(exclude).github/workflows/pr671-independent-validation.yml')
          printf 'final_changed_files_after_validator_removal:\n%s\n' "$changed"
          test "$changed" = 'documents/design/devcontainer/parent-devcontainer-policy.md'
          git diff --check origin/main...HEAD
          git show HEAD:documents/design/devcontainer/parent-devcontainer-policy.md >/tmp/pr671-readback.md
          test -s /tmp/pr671-readback.md
          echo "readback_sha256=$(sha256sum /tmp/pr671-readback.md | awk '{print $1}')"
          echo "readback_lines=$(wc -l </tmp/pr671-readback.md)"
          sed -n '1,120p' /tmp/pr671-readback.md
