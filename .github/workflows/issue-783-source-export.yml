name: Issue 783 Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.transport-783 --exclude=.agent-canon-runtime-inventory-783.txt -czf /tmp/agent-canon-783-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-canon-783-source
          path: /tmp/agent-canon-783-source.tar.gz
          if-no-files-found: error
          retention-days: 1
