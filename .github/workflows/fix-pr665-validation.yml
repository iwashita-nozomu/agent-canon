name: Fix PR665 validation contract
on:
  pull_request:
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    if: github.head_ref == 'canon/simplify-diagnostic-workflows-624-628'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/simplify-diagnostic-workflows-624-628
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pyyaml
      - name: Patch stale workflow expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ci/check_github_workflows.py')
          s = p.read_text()
          old = '''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "generate_agent_runtime_dashboard.py",\n)\nSTANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: read",\n    "issues: write",\n)'''
          new = '''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "workflow_dispatch:",\n    "schedule:",\n    "generate_agent_runtime_dashboard.py",\n)\nSTANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "push:",\n    "- main",\n    "workflow_dispatch:",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: write",\n)'''
          if old not in s:
              raise SystemExit('stale workflow expectation block not found exactly')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-pr665-validation.yml
      - name: Validate focused workflow contract
        run: |
          python3 tools/ci/check_github_workflows.py
          python3 -m py_compile tools/ci/check_github_workflows.py
          git diff --check
      - name: Commit validated patch
        run: |
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git add tools/ci/check_github_workflows.py .github/workflows/fix-pr665-validation.yml
          git commit -m 'fix: align workflow checker with publication boundaries'
          git push origin HEAD:canon/simplify-diagnostic-workflows-624-628
