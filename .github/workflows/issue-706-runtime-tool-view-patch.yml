# One-shot delivery workflow; removes itself after applying the source-owned fix.
name: Issue 706 runtime tool-view patch

on:
  push:
    branches:
      - fix/docker-run-repository-tests-20260814

permissions:
  contents: write

jobs:
  apply-runtime-tool-view-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/docker-run-repository-tests-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source transformation
        run: python3 tools/ci/issue_706_apply_runtime_tool_view_patch.py

      - name: Commit correction and remove transient patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/issue-706-runtime-tool-view-patch.yml \
            tools/ci/issue_706_apply_runtime_tool_view_patch.py
          git add tools/agent_tools/check_agent_runtime_alignment.py
          git diff --check --cached
          git commit -m "fix: project source tooling into runtime fixture (#706)"
          git push origin HEAD:fix/docker-run-repository-tests-20260814
