# @dependency-start
# contract configuration
# responsibility Applies and validates the one-time Issue #766 implementation patch.
# upstream design ../../documents/experiments/result-log-retention-and-visualization.md owns raw retention.
# downstream implementation ../../tools/experiments/save_experiment_result_annex.py is the retained owner.
# @dependency-end

name: Issue 766 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/766-split-raw-annex-results

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply asserted implementation and skill migration
        run: |
          python3 .github/issue-766/identity_fixture.py prepare
          cat .github/issue-766/part-* > .github/issue-766/apply_issue_766.py
          python3 .github/issue-766/transform_patch.py
          python3 .github/issue-766/apply_issue_766.py
          python3 .github/issue-766/identity_fixture.py restore
          rm -rf .github/issue-766
          rm -f .github/workflows/issue-766-implementation.yml

      - name: Install focused validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
          python3 -m pip install --upgrade pytest pyyaml tomli packaging

      - name: Validate syntax, identity, layout, runner, annex, and template
        run: |
          python3 -m compileall -q tools/experiments templates/experiments/_template tests/tools
          git diff --check
          python3 -m pytest -q tests/tools/test_experiment_identity.py
          python3 -m pytest -q tests/tools/test_experiment_raw_layout.py
          python3 -m pytest -q tests/tools/test_run_managed_experiment.py
          python3 -m pytest -q tests/tools/test_save_experiment_result_annex.py
          python3 tools/ci/check_experiment_template.py --source-root .
          python3 -m pytest -q tests/tools/test_check_experiment_template.py
          python3 -m pytest -q tests/tools/test_experiment_template_contracts.py

      - name: Reject compatibility and duplicate-owner drift
        run: |
          legacy_env="$(git grep -n -- 'EXPERIMENT_RESULT_ANNEX_REPO' || true)"
          legacy_schema="$(git grep -n -- 'git-annex-result-retention/v1' || true)"
          legacy_cli="$(git grep -n -- '--result-dir experiments/<topic>/result/<variant>/<run_name>' || true)"
          if [ -n "$legacy_env" ]; then printf '%s\n' "$legacy_env"; exit 1; fi
          if [ -n "$legacy_schema" ]; then printf '%s\n' "$legacy_schema"; exit 1; fi
          if [ -n "$legacy_cli" ]; then printf '%s\n' "$legacy_cli"; exit 1; fi
          test "$(git grep -l -- 'EXPERIMENT_RAW_DIR' tools/experiments/run_managed_experiment.py templates/experiments/_template/run.py | wc -l)" -eq 2
          test "$(find tools/experiments -maxdepth 1 -type f -name '*annex*.py' | wc -l)" -eq 1

      - name: Run repository-owned static units
        run: |
          bash tools/ci/run_standalone_static_gate_unit.sh contracts
          bash tools/ci/run_standalone_static_gate_unit.sh eval
          bash tools/ci/run_standalone_static_gate_unit.sh workflow-container

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(experiments): split raw retention from review evidence (#766)"
          git push origin HEAD:feat/766-split-raw-annex-results
