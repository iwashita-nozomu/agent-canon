# @dependency-start
# contract configuration
# responsibility Applies and validates the one-time Issue #766 implementation patch.
# upstream design ../../documents/experiments/result-log-retention-and-visualization.md owns raw retention.
# downstream implementation ../../tools/experiments/save_experiment_result_annex.py is the retained owner.
# @dependency-end

name: Issue 766 implementation

on:
  push:
    branches:
      - feat/766-split-raw-annex-results
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue-766-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize asserted identity-test baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/tools/test_experiment_identity.py")
          text = path.read_text(encoding="utf-8")
          current_imports = '''    contained_path,
              load_json_text,
              report_relative_path,
              result_relative_path,
          '''
          asserted_imports = '''    contained_path,
              identity_from_manifest,
              load_json_file,
              load_json_text,
              report_relative_path,
              result_relative_path,
          '''
          current_assertions = '''    assert result_relative_path(identity) == Path("experiments/topic.v1/result/smoke.v2/run.3")
              assert report_relative_path(identity) == Path("experiments/report/topic.v1/smoke.v2/run.3.md")
          '''
          asserted_assertions = '''    assert result_relative_path(identity) == Path("experiments/demo/result/formal/run-a")
              assert report_relative_path(identity) == Path(
                  "experiments/report/demo/formal/run-a.md"
              )
          '''
          if text.count(current_imports) != 1 or text.count(current_assertions) != 1:
              raise SystemExit("identity test baseline drifted before Issue #766 patch")
          path.write_text(
              text.replace(current_imports, asserted_imports).replace(
                  current_assertions, asserted_assertions
              ),
              encoding="utf-8",
          )
          PY

      - name: Apply asserted canonical patch
        run: |
          cat .github/issue-766/part-* > .github/issue-766/apply_issue_766.py
          python3 - <<'PY'
          import ast
          import base64
          import gzip
          from pathlib import Path

          path = Path(".github/issue-766/apply_issue_766.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          index = next(i for i, line in enumerate(lines) if line.startswith("_PATCH = "))
          payload = ast.literal_eval(lines[index].split("=", 1)[1].strip())
          source = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          old = """replace_once(
              RUNNER,
              '''            \"result_dir\": str(context.paths.result_dir),\\n            \"log_dir\": str(context.paths.log_dir),\\n''',
              '''            \"result_dir\": str(context.paths.result_dir),\\n            \"raw_dir\": str(context.paths.raw_dir),\\n            \"log_dir\": str(context.paths.log_dir),\\n''',
          )"""
          new = """runner_text = read(RUNNER)
          runner_old = '''            \"result_dir\": str(context.paths.result_dir),\\n            \"log_dir\": str(context.paths.log_dir),\\n'''
          runner_new = '''            \"result_dir\": str(context.paths.result_dir),\\n            \"raw_dir\": str(context.paths.raw_dir),\\n            \"log_dir\": str(context.paths.log_dir),\\n'''
          runner_count = runner_text.count(runner_old)
          if runner_count != 2:
              raise RuntimeError(
                  f\"{RUNNER}: expected two canonical path payloads, found {runner_count}\"
              )
          write(RUNNER, runner_text.replace(runner_old, runner_new))"""
          if source.count(old) != 1:
              raise SystemExit("runner raw-path patch assertion drifted")
          source = source.replace(old, new)
          encoded = base64.b64encode(gzip.compress(source.encode("utf-8"), mtime=0)).decode()
          lines[index] = f"_PATCH = {encoded!r}"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python3 .github/issue-766/apply_issue_766.py

      - name: Restore canonical identity-test fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/tools/test_experiment_identity.py")
          text = path.read_text(encoding="utf-8")
          patched_imports = '''    contained_path,
              identity_from_manifest,
              identity_from_raw_relative_path,
              load_json_file,
              load_json_text,
              raw_relative_path,
              report_relative_path,
              result_relative_path,
          '''
          canonical_imports = '''    contained_path,
              identity_from_raw_relative_path,
              load_json_text,
              raw_relative_path,
              report_relative_path,
              result_relative_path,
          '''
          patched_assertions = '''    assert result_relative_path(identity) == Path("experiments/demo/result/formal/run-a")
              assert raw_relative_path(identity) == Path("experiments/demo/raw/formal/run-a")
              assert identity_from_raw_relative_path(raw_relative_path(identity)) == identity
              assert report_relative_path(identity) == Path(
                  "experiments/report/demo/formal/run-a.md"
              )
          '''
          canonical_assertions = '''    assert result_relative_path(identity) == Path("experiments/topic.v1/result/smoke.v2/run.3")
              assert raw_relative_path(identity) == Path("experiments/topic.v1/raw/smoke.v2/run.3")
              assert identity_from_raw_relative_path(raw_relative_path(identity)) == identity
              assert report_relative_path(identity) == Path("experiments/report/topic.v1/smoke.v2/run.3.md")
          '''
          if text.count(patched_imports) != 1 or text.count(patched_assertions) != 1:
              raise SystemExit("identity test patch result drifted")
          path.write_text(
              text.replace(patched_imports, canonical_imports).replace(
                  patched_assertions, canonical_assertions
              ),
              encoding="utf-8",
          )
          PY

      - name: Remove one-time patch transport
        run: |
          rm -rf .github/issue-766
          rm -f .github/workflows/issue-766-implementation.yml

      - name: Install focused validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
          python3 -m pip install --upgrade pytest pyyaml tomli packaging

      - name: Validate Python syntax and diff hygiene
        run: |
          python3 -m compileall -q tools/experiments templates/experiments/_template tests/tools
          git diff --check

      - name: Run identity and managed raw-layout tests
        run: |
          python3 -m pytest -q tests/tools/test_experiment_identity.py
          python3 -m pytest -q tests/tools/test_experiment_raw_layout.py
          python3 -m pytest -q tests/tools/test_run_managed_experiment.py

      - name: Run raw annex retention tests
        run: python3 -m pytest -q tests/tools/test_save_experiment_result_annex.py

      - name: Run template materialization smoke
        run: |
          python3 tools/ci/check_experiment_template.py --source-root .
          python3 -m pytest -q tests/tools/test_check_experiment_template.py

      - name: Reject compatibility and duplicate-owner drift
        run: |
          test "$(git grep -l -- 'EXPERIMENT_RESULT_ANNEX_REPO' || true)" = ""
          test "$(git grep -l -- 'git-annex-result-retention/v1' || true)" = ""
          test "$(git grep -l -- '--result-dir experiments/<topic>/result/<variant>/<run_name>' || true)" = ""
          test "$(git grep -l -- 'EXPERIMENT_RAW_DIR' tools/experiments/run_managed_experiment.py templates/experiments/_template/run.py | wc -l)" -eq 2
          test "$(find tools/experiments -maxdepth 1 -type f -name '*annex*.py' | wc -l)" -eq 1

      - name: Run repository-owned static units
        run: |
          bash tools/ci/run_standalone_static_gate_unit.sh contracts
          bash tools/ci/run_standalone_static_gate_unit.sh eval
          bash tools/ci/run_standalone_static_gate_unit.sh workflow-container

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(experiments): split raw retention from review evidence (#766)"
          git push origin HEAD:feat/766-split-raw-annex-results
