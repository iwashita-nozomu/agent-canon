# @dependency-start
# contract configuration
# responsibility Defines the standalone AgentCanon coordination YAML configuration.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md agent-canon PR workflow
# @dependency-end

# Standalone AgentCanon coordination workflow with selected roles. Derived
# repositories own their coordination surface separately.
name: Agent Coordination

on:
  workflow_dispatch:
    inputs:
      task:
        description: Short task summary for the agent team run
        required: true
        default: manual-agent-run
        type: string
      owner:
        description: Human or agent owning the run
        required: true
        default: github-actions
        type: string
      specialists:
        description: Optional comma-separated specialist roles such as researcher,scheduler,infra_steward
        required: false
        default: ""
        type: string
      full_team:
        description: Enable every specialist role for this run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AGENT_COORDINATION_TASK: ${{ inputs.task }}
  AGENT_COORDINATION_OWNER: ${{ inputs.owner }}
  AGENT_COORDINATION_SPECIALISTS: ${{ inputs.specialists }}
  AGENT_COORDINATION_FULL_TEAM: ${{ inputs.full_team }}

concurrency:
  group: agent-coordination-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.coordinate.outputs.run_id }}
      report_dir: ${{ steps.coordinate.outputs.report_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout AgentCanon submodule
        env:
          AGENT_CANON_REPO_TOKEN: ${{ secrets.AGENT_CANON_REPO_TOKEN }}
          AGENT_CANON_REPO_SSH_KEY: ${{ secrets.AGENT_CANON_REPO_SSH_KEY }}
        run: |
          if [ -f .github/scripts/checkout_agent_canon_submodule.sh ]; then
            bash .github/scripts/checkout_agent_canon_submodule.sh
          else
            bash tools/ci/checkout_agent_canon_submodule.sh
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Coordinate agent run
        id: coordinate
        run: |
          case "${AGENT_COORDINATION_SPECIALISTS}" in
            *$'\n'*|*$'\r'*)
              echo "specialist values must be comma-separated on one line" >&2
              exit 1
              ;;
          esac
          normalized="$(printf '%s' "${AGENT_COORDINATION_SPECIALISTS}" | tr -d ' ')"
          flags=()
          if [ "${AGENT_COORDINATION_FULL_TEAM}" = "true" ]; then
            flags+=(--full-team)
          fi
          if [ -n "${normalized}" ]; then
            IFS=',' read -ra roles <<< "${normalized}"
            for role in "${roles[@]}"; do
              case "${role}" in
                researcher|research_reviewer|scheduler|schedule_reviewer|infra_steward|infra_reviewer)
                  flags+=(--enable "${role}")
                  ;;
                "")
                  ;;
                *)
                  echo "unsupported specialist role: ${role}" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          python3 tools/agent_tools/bootstrap_agent_run.py \
            --task "${AGENT_COORDINATION_TASK}" \
            --owner "${AGENT_COORDINATION_OWNER}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            "${flags[@]}" > bootstrap.txt
          cat bootstrap.txt
          run_id="$(grep '^RUN_ID=' bootstrap.txt | cut -d= -f2-)"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "report_dir=reports/agents/${run_id}" >> "$GITHUB_OUTPUT"
      - name: Record coordination intake
        run: |
          # Readback source is run.capacity_request.lineage.role_ids in the generated team_manifest.yaml.
          # Summary vocabulary: finding=none at intake and result=bundle_ready are
          # emitted only after packet readback and write-scope validation pass.
          report_dir="${{ steps.coordinate.outputs.report_dir }}"
          manifest_path="${report_dir}/team_manifest.yaml"
          report_snapshot="${RUNNER_TEMP}/coordination-report-before.json"
          workspace_snapshot="${RUNNER_TEMP}/coordination-workspace-before.json"
          python3 tools/agent_tools/validate_role_write_scope.py \
            --report-dir "${report_dir}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            --report-snapshot-out "${report_snapshot}" \
            --workspace-snapshot-out "${workspace_snapshot}"
          {
            echo ""
            echo "- github_actions_coordination: intake recorded for selected role set"
          } >> "${report_dir}/intent_brief.md"
          summary_result="bundle_ready"
          summary_finding="none at intake"
          if ! role_readback="$(python3 - "${manifest_path}" <<'PY'
          from __future__ import annotations

          import sys
          from pathlib import Path

          import yaml

          manifest = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          run = manifest.get("run") if isinstance(manifest, dict) else None
          capacity_request = (
              run.get("capacity_request") if isinstance(run, dict) else None
          )
          lineage = (
              capacity_request.get("lineage")
              if isinstance(capacity_request, dict)
              else None
          )
          role_ids = lineage.get("role_ids") if isinstance(lineage, dict) else None
          role_entries = manifest.get("roles") if isinstance(manifest, dict) else None
          if (
              not isinstance(role_ids, list)
              or not all(isinstance(role_id, str) for role_id in role_ids)
              or not isinstance(role_entries, list)
          ):
              raise SystemExit("team_manifest role readback is incomplete")
          always_on = {
              entry.get("id")
              for entry in role_entries
              if isinstance(entry, dict) and entry.get("activation") == "always"
          }
          if not all(isinstance(role_id, str) for role_id in always_on):
              raise SystemExit("team_manifest always-on role readback is incomplete")
          specialists = [role_id for role_id in role_ids if role_id not in always_on]
          print(f"ACTIVE_ROLES={','.join(role_ids)}")
          print(f"SCHEDULED_SPECIALISTS={','.join(specialists) or '-'}")
          PY
          )"; then
            summary_result="fail"
            summary_finding="team_manifest_role_readback_failed"
            {
              echo "### Agent coordination"
              echo "- executed_role=coordination"
              echo "- scheduled_specialists=readback_failed"
              echo "- finding=${summary_finding}"
              echo "- result=${summary_result}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          printf '%s\n' "${role_readback}"
          scheduled_specialists="$(printf '%s\n' "${role_readback}" | sed -n 's/^SCHEDULED_SPECIALISTS=//p')"
          if [ -z "${scheduled_specialists}" ]; then
            summary_result="fail"
            summary_finding="team_manifest_specialist_readback_missing"
          fi
          write_scope_status="pass"
          if ! python3 tools/agent_tools/validate_role_write_scope.py \
            --role manager \
            --report-dir "${report_dir}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            --report-snapshot-in "${report_snapshot}" \
            --workspace-snapshot-in "${workspace_snapshot}"; then
            write_scope_status="fail"
            summary_result="fail"
            summary_finding="write_scope_validation_failed"
          fi
          {
            echo "### Agent coordination"
            echo "- executed_role=coordination"
            echo "- scheduled_specialists=${scheduled_specialists:-readback_failed}"
            echo "- finding=${summary_finding}"
            echo "- result=${summary_result}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${write_scope_status}" != "pass" ] || [ "${summary_result}" != "bundle_ready" ]; then
            exit 1
          fi
      - name: Upload coordination bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-coordinate-${{ steps.coordinate.outputs.run_id }}
          path: ${{ steps.coordinate.outputs.report_dir }}
