# @dependency-start
# contract configuration
# responsibility Defines the standalone AgentCanon coordination YAML configuration.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md agent-canon PR workflow
# @dependency-end

# Standalone AgentCanon coordination workflow with selected roles. Derived
# repositories own their coordination surface separately.
name: Agent Coordination

on:
  workflow_dispatch:
    inputs:
      task:
        description: Short task summary for the agent team run
        required: true
        default: manual-agent-run
        type: string
      owner:
        description: Human or agent owning the run
        required: true
        default: github-actions
        type: string
      specialists:
        description: Optional comma-separated specialist roles such as researcher,scheduler,infra_steward
        required: false
        default: ""
        type: string
      full_team:
        description: Enable every specialist role for this run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AGENT_COORDINATION_TASK: ${{ inputs.task }}
  AGENT_COORDINATION_OWNER: ${{ inputs.owner }}
  AGENT_COORDINATION_SPECIALISTS: ${{ inputs.specialists }}
  AGENT_COORDINATION_FULL_TEAM: ${{ inputs.full_team }}

concurrency:
  group: agent-coordination-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.coordinate.outputs.run_id }}
      report_dir: ${{ steps.coordinate.outputs.report_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout AgentCanon submodule
        env:
          AGENT_CANON_REPO_TOKEN: ${{ secrets.AGENT_CANON_REPO_TOKEN }}
          AGENT_CANON_REPO_SSH_KEY: ${{ secrets.AGENT_CANON_REPO_SSH_KEY }}
        run: |
          if [ -f .github/scripts/checkout_agent_canon_submodule.sh ]; then
            bash .github/scripts/checkout_agent_canon_submodule.sh
          else
            bash tools/ci/checkout_agent_canon_submodule.sh
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Coordinate agent run
        id: coordinate
        run: |
          case "${AGENT_COORDINATION_SPECIALISTS}" in
            *$'\n'*|*$'\r'*)
              echo "specialist values must be comma-separated on one line" >&2
              exit 1
              ;;
          esac
          normalized="$(printf '%s' "${AGENT_COORDINATION_SPECIALISTS}" | tr -d ' ')"
          flags=()
          if [ "${AGENT_COORDINATION_FULL_TEAM}" = "true" ]; then
            flags+=(--full-team)
          fi
          if [ -n "${normalized}" ]; then
            IFS=',' read -ra roles <<< "${normalized}"
            for role in "${roles[@]}"; do
              case "${role}" in
                researcher|research_reviewer|scheduler|schedule_reviewer|infra_steward|infra_reviewer)
                  flags+=(--enable "${role}")
                  ;;
                "")
                  ;;
                *)
                  echo "unsupported specialist role: ${role}" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          python3 tools/agent_tools/bootstrap_agent_run.py \
            --task "${AGENT_COORDINATION_TASK}" \
            --owner "${AGENT_COORDINATION_OWNER}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            "${flags[@]}" > bootstrap.txt
          cat bootstrap.txt
          run_id="$(grep '^RUN_ID=' bootstrap.txt | cut -d= -f2-)"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "report_dir=reports/agents/${run_id}" >> "$GITHUB_OUTPUT"
      - name: Record coordination intake
        run: |
          report_snapshot="${RUNNER_TEMP}/coordination-report-before.json"
          workspace_snapshot="${RUNNER_TEMP}/coordination-workspace-before.json"
          python3 tools/agent_tools/validate_role_write_scope.py \
            --report-dir "${{ steps.coordinate.outputs.report_dir }}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            --report-snapshot-out "${report_snapshot}" \
            --workspace-snapshot-out "${workspace_snapshot}"
          {
            echo ""
            echo "- github_actions_coordination: intake recorded for selected role set"
          } >> "${{ steps.coordinate.outputs.report_dir }}/intent_brief.md"
          python3 tools/agent_tools/validate_role_write_scope.py \
            --role manager \
            --report-dir "${{ steps.coordinate.outputs.report_dir }}" \
            --workspace-root "${GITHUB_WORKSPACE}" \
            --report-snapshot-in "${report_snapshot}" \
            --workspace-snapshot-in "${workspace_snapshot}"
      - name: Upload coordination bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-coordinate-${{ steps.coordinate.outputs.run_id }}
          path: ${{ steps.coordinate.outputs.report_dir }}
