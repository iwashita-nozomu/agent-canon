name: Fix PR668 validation review findings
on:
  pull_request:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.head_ref == 'canon/selective-pr-gates-629-644'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/selective-pr-gates-629-644
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pytest pyyaml tomli packaging ruff pyright
      - name: Add behavioral Python responsibility and align checker topology
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tools/agent_tools/classify_path_risk.py')
          s=p.read_text()
          old='''                    "python3 -m ruff check <changed-python-paths>",\n                    "PYTHONPATH=tools/agent_tools python3 -m pyright <changed-python-paths>",'''
          new='''                    "python3 -m ruff check <changed-python-paths>",\n                    "PYTHONPATH=tools/agent_tools python3 -m pyright <changed-python-paths>",\n                    "python3 -m pytest -q <targeted-python-tests>",'''
          if s.count(old)!=1:
              raise SystemExit('python profile anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('tools/ci/run_selected_agent_canon_pr_checks.py')
          s=p.read_text()
          anchor='''def _run(command: list[str], *, print_only: bool) -> None:\n'''
          helper='''def _targeted_python_tests(paths: tuple[str, ...]) -> list[str]:\n    tests: list[str] = []\n    for raw in paths:\n        path = Path(raw)\n        if path.suffix not in {".py", ".pyi"}:\n            continue\n        if raw.startswith("tests/") and path.exists():\n            tests.append(raw)\n            continue\n        if raw.startswith("tools/agent_tools/"):\n            candidate = Path("tests/agent_tools") / f"test_{path.stem}.py"\n            if candidate.exists():\n                tests.append(candidate.as_posix())\n    return list(dict.fromkeys(tests))\n\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit('executor helper anchor mismatch')
          s=s.replace(anchor,helper+anchor,1)
          old='''            _run(\n                ["python3", "-m", "pyright", *changed_python],\n                print_only=print_only,\n            )\n'''
          new='''            _run(\n                ["python3", "-m", "pyright", *changed_python],\n                print_only=print_only,\n            )\n            targeted_tests = _targeted_python_tests(paths)\n            if targeted_tests:\n                _run(["python3", "-m", "pytest", "-q", *targeted_tests], print_only=print_only)\n'''
          if s.count(old)!=1:
              raise SystemExit('executor python anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('tools/ci/check_github_workflows.py')
          s=p.read_text()
          old='''AGENT_CANON_STATIC_GATES_WORKFLOW_REQUIREMENTS = (\n    "pull_request:",\n    "workflow_dispatch:",\n    "github.event.pull_request.head.sha || github.sha",\n    "bash tools/ci/check_agent_canon_pr.sh",\n)'''
          new='''AGENT_CANON_STATIC_GATES_WORKFLOW_REQUIREMENTS = (\n    "pull_request:",\n    "workflow_dispatch:",\n    "github.event.pull_request.head.sha || github.sha",\n    "classify_path_risk.py",\n    "run_selected_agent_canon_pr_checks.py",\n    "--full-confidence",\n)'''
          if s.count(old)!=1:
              raise SystemExit('static workflow requirement anchor mismatch')
          s=s.replace(old,new,1)
          # carry forward publication-only checker correction from PR665.
          s=s.replace('''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "generate_agent_runtime_dashboard.py",\n)''','''STANDALONE_RUNTIME_DASHBOARD_WORKFLOW_REQUIREMENTS = (\n    "workflow_dispatch:",\n    "schedule:",\n    "generate_agent_runtime_dashboard.py",\n)''')
          s=s.replace('''STANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "Standalone-only workflow",\n    "Template and derived repositories should not copy",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: read",\n    "issues: write",\n)''','''STANDALONE_ISSUE_MIRROR_WORKFLOW_REQUIREMENTS = (\n    "push:",\n    "- main",\n    "workflow_dispatch:",\n    "issue_sync.py",\n    "--github-check",\n    "--sync-github",\n    "GITHUB_STEP_SUMMARY",\n    "permissions:",\n    "issues: write",\n)''')
          p.write_text(s)
          PY
          rm .github/workflows/fix-pr668-validation.yml
      - name: Validate selector and executor
        run: |
          python3 -m pytest -q tests/agent_tools/test_classify_path_risk.py
          tmp=$(mktemp)
          printf '%s\n' tools/agent_tools/classify_path_risk.py > "$tmp"
          PYTHONPATH=tools python3 tools/ci/run_selected_agent_canon_pr_checks.py --paths-file "$tmp" --print-only
          printf '%s\n' tools/agent_tools/tool_catalog.py > "$tmp"
          PYTHONPATH=tools python3 tools/ci/run_selected_agent_canon_pr_checks.py --paths-file "$tmp" --print-only | grep -F 'python3 -m pytest -q tests/agent_tools/test_tool_catalog.py'
          python3 tools/ci/check_github_workflows.py
          python3 -m ruff check tools/agent_tools/classify_path_risk.py tools/ci/run_selected_agent_canon_pr_checks.py tools/ci/check_github_workflows.py
          git diff --check
      - name: Commit and push
        run: |
          git config user.name agent-canon-validation
          git config user.email agent-canon-validation@users.noreply.github.com
          git add tools/agent_tools/classify_path_risk.py tools/ci/run_selected_agent_canon_pr_checks.py tools/ci/check_github_workflows.py .github/workflows/fix-pr668-validation.yml
          git commit -m 'fix: preserve behavioral tests in selected Python validation'
          git push origin HEAD:canon/selective-pr-gates-629-644
