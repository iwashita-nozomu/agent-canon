name: Issue 775 source export

on:
  push:
    branches:
      - refactor/775-luna-team-communication

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: issue-775-agent-canon-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
