# @dependency-start
# contract configuration
# responsibility Builds and publishes the multi-architecture AgentCanon runtime image.
# upstream design ../../documents/design/agent-canon-bootstrap-tool-runtime.md shared runtime image contract
# upstream implementation ../../bootstrap/container/image/Dockerfile builds the runtime image
# downstream implementation ../../tools/validation/ci/checks/check_github_workflows.py validates workflow conventions
# @dependency-end

name: AgentCanon runtime image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            runner_arch: X64
            uname: x86_64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            runner_arch: ARM64
            uname: aarch64
    runs-on: ${{ matrix.runs_on }}
    env:
      ARCH: ${{ matrix.arch }}
      BUILDER_NAME: agent-canon-runtime-${{ github.run_id }}-${{ matrix.arch }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_UNAME: ${{ matrix.uname }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native runner
        env:
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          actual_uname="$(uname -m)"
          if [ "${ACTUAL_RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "runner.arch=${ACTUAL_RUNNER_ARCH}; expected ${EXPECTED_RUNNER_ARCH}" >&2
            exit 1
          fi
          if [ "${actual_uname}" != "${EXPECTED_UNAME}" ]; then
            echo "uname -m=${actual_uname}; expected ${EXPECTED_UNAME}" >&2
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GHCR_USER}" --password-stdin

      - name: Create temporary buildx builder
        run: |
          set -euo pipefail
          docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --driver-opt network=host \
            --use
          docker buildx inspect --bootstrap "${BUILDER_NAME}"

      - name: Build native architecture image for pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDER_NAME}" \
            --network host \
            --file bootstrap/container/image/Dockerfile \
            --platform "${EXPECTED_PLATFORM}" \
            --tag "agent-canon-runtime:pr-${GITHUB_SHA}-${ARCH}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=pr-${GITHUB_SHA}" \
            --label io.agent-canon.projection-layout=container-runtime-v1 \
            --output type=cacheonly \
            .

      - name: Set up Python for #989 native acceptance
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install #989 acceptance test dependency
        if: github.event_name == 'pull_request'
        run: python3 -m pip install --disable-pip-version-check "pytest==8.3.5"

      - name: Run #989 native ownership contract
        if: github.event_name == 'pull_request'
        env:
          AGENT_CANON_RUN_REAL_CLEAN_E2E: "1"
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/bootstrap/test_bootstrap_shell.py::test_existing_controller_volume_requires_state_label \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_volume_initializer_rejects_image_copy_up_without_nocopy \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_volume_initializer_preserves_readonly_legacy_source \
            tests/bootstrap/test_bootstrap_shell.py::test_state_volume_readback_failure_removes_fresh_volume_and_allows_retry \
            tests/bootstrap/test_bootstrap_shell.py::test_fresh_controller_failure_cleans_candidate_resources \
            tests/bootstrap/test_bootstrap_shell.py::test_existing_volume_transaction_restores_only_authoritative_set \
            tests/bootstrap/test_bootstrap_shell.py::test_candidate_cleanup_refuses_name_replacement_foreign_container \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_volume_snapshot_rejects_cross_boundary_hardlinks \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_volume_restore_failure_preserves_live_tree_and_snapshot \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_marked_volume_adopts_divergent_legacy_state \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_marked_layout_migration_failure_restores_old_tree \
            tests/bootstrap/test_bootstrap_shell.py::test_legacy_controller_cleanup_failure_restores_receipts_and_state \
            tests/bootstrap/test_bootstrap_shell.py::test_target_add_init_failure_restores_previous_fake_resident \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_input_imports_use_exact_runtime_paths \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_input_import_failure_stops_follow_on_imports \
            tests/bootstrap/test_bootstrap_shell.py::test_private_log_import_failure_restores_old_tree_then_retry_normalizes \
            tests/bootstrap/test_bootstrap_shell.py::test_ensure_container_gates_are_terminal_when_errexit_is_suppressed \
            tests/bootstrap/test_bootstrap_shell.py::test_missing_resident_start_or_health_failure_preserves_existing_volume_and_image \
            tests/bootstrap/test_bootstrap_shell.py::test_candidate_cleanup_without_receipt_uses_name_only_to_prove_absence \
            tests/bootstrap/test_bootstrap_shell.py::test_committed_activation_cleanup_failure_retries_without_rollback \
            tests/bootstrap/test_bootstrap_shell.py::test_up_to_date_cleanup_failure_occurs_after_commit_without_rollback \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_copy_runs_embedded_helper_with_real_posix_shell \
            tests/bootstrap/test_bootstrap_shell.py::test_fake_docker_projection_capability_routes_legacy_runtime_layout \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_export_digest_corruption_is_rejected \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_export_rejects_fifo_before_publish \
            tests/bootstrap/test_bootstrap_shell.py::test_volume_export_list_failure_is_typed_and_preserves_destination \
            tests/bootstrap/test_bootstrap_shell.py::test_projection_later_move_failure_restores_exact_previous_state \
            tests/bootstrap/test_bootstrap_shell.py::test_projection_backup_can_survive_late_activation_and_restore \
            tests/bootstrap/test_bootstrap_shell.py::test_private_feedback_volume_copy_uses_canonical_subtree \
            tests/bootstrap/test_bootstrap_shell.py::test_codex_volume_copy_rejects_unexpected_symlink_target \
            tests/bootstrap/test_bootstrap_shell.py::test_codex_volume_copy_roundtrips_managed_symlink \
            tests/bootstrap/test_bootstrap_shell.py::test_global_links_preflight_collision_preserves_regular_config_and_manifest \
            tests/bootstrap/test_bootstrap_shell.py::test_global_links_rejects_foreign_agents_symlink_without_mutation \
            tests/bootstrap/test_bootstrap_shell.py::test_global_links_transaction_restores_config_links_and_manifest \
            tests/bootstrap/test_bootstrap_shell.py::test_restore_failure_skips_previous_resident_restart \
            tests/bootstrap/test_bootstrap_shell.py::test_real_docker_public_clean_install_e2e

      - name: Build and publish native architecture image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDER_NAME}" \
            --network host \
            --file bootstrap/container/image/Dockerfile \
            --platform "${EXPECTED_PLATFORM}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}-${ARCH}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=sha-${GITHUB_SHA}" \
            --label io.agent-canon.projection-layout=container-runtime-v1 \
            --push \
            .

      - name: Remove temporary buildx builder and log out
        if: always()
        run: |
          docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true

  runtime-image:
    needs: build
    if: always()
    name: runtime-image
    runs-on: ubuntu-24.04
    env:
      BUILDER_NAME: agent-canon-runtime-${{ github.run_id }}-merge

    steps:
      - name: Require successful native builds
        if: needs.build.result != 'success'
        run: |
          echo "native runtime-image builds did not all succeed: ${NEEDS_RESULT}" >&2
          exit 1
        env:
          NEEDS_RESULT: ${{ needs.build.result }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GHCR_USER}" --password-stdin

      - name: Create temporary buildx builder
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --driver-opt network=host \
            --use
          docker buildx inspect --bootstrap "${BUILDER_NAME}"

      - name: Publish combined image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

      - name: Read back combined image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          verify_platforms() {
            local image_ref="$1"
            local inspect_output
            inspect_output="$(docker buildx imagetools inspect "${image_ref}")"
            printf '%s\n' "${inspect_output}"
            for platform in linux/amd64 linux/arm64; do
              if ! printf '%s\n' "${inspect_output}" | grep -Eq \
                "^[[:space:]]*Platform:[[:space:]]+${platform}([[:space:]]|$)"; then
                echo "${image_ref} does not contain ${platform}" >&2
                return 1
              fi
            done
          }
          verify_platforms "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          verify_platforms "${IMAGE_NAME}:main"

      - name: Remove temporary buildx builder and log out
        if: always()
        run: |
          docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
