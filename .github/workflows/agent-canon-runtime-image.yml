# @dependency-start
# contract configuration
# responsibility Builds one reusable multi-architecture AgentCanon environment image.
# upstream implementation ../../bootstrap/container/image/digest.sh stable environment key
# downstream implementation ../../bootstrap/host/lifecycle/entrypoint.sh host image selection
# @dependency-end

name: AgentCanon environment image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.environment.outputs.image }}
      exists: ${{ steps.remote.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: environment
        run: |
          set -euo pipefail
          key="$(bootstrap/container/image/digest.sh)"
          image="${IMAGE_NAME}:env-${key}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - id: remote
        env:
          IMAGE: ${{ steps.environment.outputs.image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs_on }}
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      BUILDER: agent-canon-environment-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "$GHCR_USER" --password-stdin

      - name: Build environment image
        run: |
          set -euo pipefail
          docker buildx create --name "$BUILDER" --driver docker-container --use
          docker buildx inspect --bootstrap "$BUILDER"
          docker buildx build \
            --builder "$BUILDER" \
            --file bootstrap/container/image/Dockerfile \
            --platform "$PLATFORM" \
            --tag "${IMAGE}-${ARCH}" \
            --load \
            .
          docker run --rm --network none "${IMAGE}-${ARCH}" health

      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}-${ARCH}"

      - name: Remove local image and builder
        if: always()
        run: |
          docker image rm --force "${IMAGE}-${ARCH}" >/dev/null 2>&1 || true
          docker buildx rm --force "$BUILDER" >/dev/null 2>&1 || true
          docker logout "$REGISTRY" >/dev/null 2>&1 || true

  runtime-image:
    needs: [prepare, build]
    if: always()
    name: runtime-image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Require source and build success when publishing
        if: >-
          needs.prepare.result != 'success' ||
          (needs.prepare.outputs.exists != 'true' &&
           needs.build.result != 'success')
        run: |
          echo "environment image preparation/build did not succeed" >&2
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && needs.prepare.outputs.exists != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "$GHCR_USER" --password-stdin

      - name: Reuse existing environment image
        if: needs.prepare.outputs.exists == 'true'
        run: |
          echo "environment image already exists: $IMAGE"

      - name: Publish environment and main tags
        if: github.event_name != 'pull_request' && needs.prepare.outputs.exists != 'true'
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "${IMAGE_NAME}:main")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}-amd64" "${IMAGE}-arm64"

      - name: Log out
        if: always() && github.event_name != 'pull_request' && needs.prepare.outputs.exists != 'true'
        run: docker logout "$REGISTRY" >/dev/null 2>&1 || true
