name: AgentCanon runtime image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BUILDER_NAME: agent-canon-runtime-${{ github.run_id }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GHCR_USER}" --password-stdin

      - name: Register arm64 binfmt for this job
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64

      - name: Create temporary buildx builder
        run: |
          set -euo pipefail
          docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --driver-opt network=host \
            --use
          docker buildx inspect --bootstrap "${BUILDER_NAME}"

      - name: Build and publish multi-architecture image
        id: publish
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/agent-canon-runtime-image-metadata.json"
          docker buildx build \
            --builder "${BUILDER_NAME}" \
            --network host \
            --file bootstrap/container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:main" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=sha-${GITHUB_SHA}" \
            --metadata-file "${metadata_file}" \
            --push \
            .
          digest="$(jq -r '."containerimage.digest" // empty' "${metadata_file}")"
          if [ -z "${digest}" ]; then
            echo "containerimage.digest was not emitted by buildx" >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'image_digest=%s\n' "${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Read back published image index
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST}"
          inspect_output="$(docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}")"
          printf '%s\n' "${inspect_output}"
          if ! printf '%s\n' "${inspect_output}" | grep -Fq "Digest: ${IMAGE_DIGEST}"; then
            echo "published image index digest did not match build metadata" >&2
            exit 1
          fi

      - name: Remove temporary buildx builder and log out
        if: always()
        run: |
          docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
