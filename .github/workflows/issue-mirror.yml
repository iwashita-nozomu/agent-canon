# @dependency-start
# contract configuration
# responsibility Synchronizes AgentCanon local issues with GitHub Issues only at publication boundaries.
# upstream design ../../documents/design/responsibility-rationale.md durable issue and remote reconciliation rationale
# upstream design ../../issues/README.md durable local issue and GitHub mirror policy
# upstream implementation ../../tools/agent_tools/issue_sync.py validates and syncs issue mirrors
# downstream implementation ../../tools/ci/check_github_workflows.py validates workflow wiring
# @dependency-end

name: Issue Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: issue-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue-mirror-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and synchronize linked GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/agent_tools/issue_sync.py \
            --root . \
            --repo "${GITHUB_REPOSITORY}" \
            --github-check \
            --sync-github \
            --summary-file "${GITHUB_STEP_SUMMARY}"
