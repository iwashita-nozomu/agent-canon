# @dependency-start
# contract configuration
# responsibility Synchronizes AgentCanon local issues with GitHub Issues only at publication boundaries.
# upstream design ../../documents/design/responsibility-rationale.md durable issue and remote reconciliation rationale
# upstream design ../../issues/README.md durable local issue and GitHub mirror policy
# upstream implementation ../../tools/agent_tools/issue_sync.py validates and syncs issue mirrors
# downstream implementation ../../tools/ci/check_github_workflows.py validates workflow wiring
# @dependency-end

name: Issue Mirror

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: issue-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue-mirror-sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and synchronize linked GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary_file="${GITHUB_WORKSPACE}/.agent-canon/issue-mirror-${GITHUB_JOB}.md"
          python3 tools/agent_tools/parent_root_side_effects.py public-exec \
            --invocation-script tools/agent_tools/issue_sync.py \
            --purpose issue-mirror \
            -- python3 tools/agent_tools/issue_sync.py \
            --root . \
            --repo "${GITHUB_REPOSITORY}" \
            --github-check \
            --sync-github \
            --summary-file "${summary_file}"
          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

  issue-mirror-check:
    if: always()
    needs: issue-mirror-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: PR required-check compatibility
        if: github.event_name == 'pull_request'
        run: echo "Remote issue reconciliation is intentionally skipped for pull requests."

      - name: Checkout repository
        id: checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Confirm publication sync
        if: github.event_name != 'pull_request' && steps.checkout.outcome == 'success'
        run: |
          if [ "${{ needs.issue-mirror-sync.result }}" != "success" ]; then
            echo "Issue mirror publication sync did not succeed." >&2
            exit 1
          fi

      - name: Record issue mirror unavailable
        if: failure() && steps.checkout.outcome != 'success'
        run: |
          {
            echo "## Issue Mirror Check"
            echo ""
            echo "- status: \`fail\`"
            echo "- reason: \`checkout-failed\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "ISSUE_SYNC=fail"
          exit 1
