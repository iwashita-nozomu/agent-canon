name: Issue 771 materialization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/issue-771-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/771-root-delete-guard

      - name: Apply fail-closed sync protocol patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_issue_771.py <<'PY'
          from pathlib import Path

          source_path = Path("tools/agent_tools/surface_manifest.py")
          text = source_path.read_text(encoding="utf-8")


          def replace_once(source: str, old: str, new: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one replacement target, found {count}: {old[:80]!r}"
                  )
              return source.replace(old, new, 1)


          text = replace_once(
              text,
              "from pathlib import Path\n",
              "from pathlib import Path, PurePosixPath\n",
          )
          text = replace_once(
              text,
              "def path_list(mapping: Mapping[str, object]) -> tuple[str, ...]:\n",
              r'''def validate_sync_target_path(path: str, label: str) -> str:
              """Return a normalized non-root repository-relative sync target."""
              pure_path = PurePosixPath(path)
              forbidden_characters = ("\0", "\n", "\r", "\t", "\\", ":")
              invalid = (
                  not path
                  or path != path.strip()
                  or path == "."
                  or pure_path.is_absolute()
                  or pure_path.as_posix() != path
                  or ".." in pure_path.parts
                  or any(character in path for character in forbidden_characters)
                  or (pure_path.parts and pure_path.parts[0] == ".git")
              )
              if invalid:
                  raise ValueError(
                      f"{label} must be a normalized non-root repository-relative POSIX path"
                  )
              return path


          def path_list(mapping: Mapping[str, object]) -> tuple[str, ...]:
          ''',
          )
          text = replace_once(
              text,
              '''def validate_entry(entry: SurfaceEntry) -> SurfaceEntry:
              """Validate one manifest entry."""
              if entry.mode not in ALLOWED_MODES:
          ''',
              '''def validate_entry(entry: SurfaceEntry) -> SurfaceEntry:
              """Validate one manifest entry."""
              validate_sync_target_path(entry.path, "surface path")
              if entry.mode not in ALLOWED_MODES:
          ''',
          )
          text = replace_once(
              text,
              r'''        path = string_value(candidate, "path")
                  if not path or path.startswith("/") or "\t" in path or "\n" in path:
                      raise ValueError(f"{transition_id}: invalid transition candidate path")
          ''',
              '''        path = validate_sync_target_path(
                      string_value(candidate, "path"),
                      f"{transition_id} transition candidate path",
                  )
          ''',
          )
          text = replace_once(
              text,
              '''

          def main(argv: Sequence[str] | None = None) -> int:
          ''',
              r'''

          def write_command_output(output: str) -> None:
              """Write one line protocol without materializing an empty record."""
              if not output:
                  return
              sys.stdout.write(output)
              sys.stdout.write("\n")


          def main(argv: Sequence[str] | None = None) -> int:
          ''',
          )
          text = replace_once(
              text,
              '''    if args.command == "root-absent-paths":
                  print(render_actionable_root_absent_paths(manifest.entries, root))
                  return 0
          ''',
              '''    if args.command == "root-absent-paths":
                  write_command_output(
                      render_actionable_root_absent_paths(manifest.entries, root)
                  )
                  return 0
          ''',
          )
          text = replace_once(
              text,
              '''    if args.command in outputs:
                  print(outputs[args.command])
                  return 0
          ''',
              '''    if args.command in outputs:
                  write_command_output(outputs[args.command])
                  return 0
          ''',
          )
          source_path.write_text(text, encoding="utf-8")
          PY
          python3 /tmp/apply_issue_771.py

          cat > tests/agent_tools/test_surface_manifest_sync_protocol.py <<'PY'
          """Regression tests for the surface-manifest sync line protocol."""

          # @dependency-start
          # contract test
          # responsibility Verifies empty sync sets cannot become checkout-root mutation records.
          # upstream implementation ../../tools/agent_tools/surface_manifest.py validates and serializes sync targets
          # upstream implementation ../../tools/sync_agent_canon.sh consumes newline-delimited sync records
          # upstream design ../../documents/runtime/SHARED_RUNTIME_SURFACES.md owns parent root projection safety
          # @dependency-end

          from __future__ import annotations

          import json
          import subprocess
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          PROJECT_ROOT = Path(__file__).resolve().parents[2]
          SURFACE_MANIFEST = PROJECT_ROOT / "tools" / "agent_tools" / "surface_manifest.py"
          TEST_TEMP_ROOT = PROJECT_ROOT / ".agent-canon" / "test-sync-spec-protocol"
          EMPTY_SYNC_COMMANDS = (
              "copy-specs",
              "link-specs",
              "regular-specs",
              "removed-legacy-paths",
              "root-absent-paths",
              "update-transition-specs",
          )


          class SurfaceManifestSyncProtocolTest(unittest.TestCase):
              """Verify the producer language excludes the empty/root record."""

              def temporary_directory(self) -> tempfile.TemporaryDirectory[str]:
                  """Keep test repositories below AgentCanon's temporary boundary."""
                  TEST_TEMP_ROOT.mkdir(parents=True, exist_ok=True)
                  return tempfile.TemporaryDirectory(dir=TEST_TEMP_ROOT)

              def write_manifest(self, root: Path, path: str | None = None) -> Path:
                  """Write one minimal live-integration manifest."""
                  lines = [
                      "version = 1",
                      'prefix = "."',
                      'integration_mode = "live-agent-canon"',
                      "default_consumer = false",
                      'selection = "explicit-opt-in"',
                  ]
                  if path is not None:
                      lines.extend(
                          [
                              "",
                              "[[surface]]",
                              f"path = {json.dumps(path)}",
                              'mode = "regular"',
                              'projection_producer = "project"',
                              'projection_kind = "project_content"',
                              "local_override_allowed = true",
                          ]
                      )
                  manifest = root / "manifest.toml"
                  manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
                  return manifest

              def run_manifest(
                  self, root: Path, manifest: Path, command: str
              ) -> subprocess.CompletedProcess[str]:
                  """Run one sync-protocol producer command."""
                  return subprocess.run(
                      [
                          sys.executable,
                          str(SURFACE_MANIFEST),
                          "--root",
                          str(root),
                          "--prefix",
                          ".",
                          "--manifest",
                          manifest.name,
                          command,
                      ],
                      cwd=root,
                      check=False,
                      capture_output=True,
                      text=True,
                  )

              def test_empty_sync_sets_emit_zero_bytes(self) -> None:
                  """The empty set is EOF, never one empty line record."""
                  with self.temporary_directory() as tmp_dir:
                      root = Path(tmp_dir)
                      manifest = self.write_manifest(root)

                      for command in EMPTY_SYNC_COMMANDS:
                          with self.subTest(command=command):
                              result = self.run_manifest(root, manifest, command)
                              self.assertEqual(
                                  result.returncode,
                                  0,
                                  result.stdout + result.stderr,
                              )
                              self.assertEqual(result.stdout, "")

              def test_legacy_consumer_preserves_absolute_workspace_root(self) -> None:
                  """A 6d6ab427-style loop receives no record and cannot delete root."""
                  with self.temporary_directory() as tmp_dir:
                      workspace = Path(tmp_dir) / "workspace"
                      git_dir = workspace / ".git"
                      git_dir.mkdir(parents=True)
                      sentinel = git_dir / "HEAD"
                      sentinel.write_text("ref: refs/heads/main\n", encoding="utf-8")
                      manifest = self.write_manifest(workspace)
                      produced = self.run_manifest(workspace, manifest, "regular-specs")
                      self.assertEqual(
                          produced.returncode,
                          0,
                          produced.stdout + produced.stderr,
                      )

                      legacy = subprocess.run(
                          [
                              "bash",
                              "-c",
                              """
                              set -euo pipefail
                              ROOT_DIR="$1"
                              while IFS= read -r spec; do
                                path="${spec%%:*}"
                                rm -rf -- "$ROOT_DIR/$path"
                              done
                              """,
                              "legacy-consumer",
                              str(workspace),
                          ],
                          input=produced.stdout,
                          check=False,
                          capture_output=True,
                          text=True,
                      )

                      self.assertEqual(legacy.returncode, 0, legacy.stderr)
                      self.assertTrue(workspace.is_dir())
                      self.assertEqual(
                          sentinel.read_text(encoding="utf-8"),
                          "ref: refs/heads/main\n",
                      )

              def test_unsafe_targets_fail_before_output_or_mutation(self) -> None:
                  """Only normalized, task-declared strict descendants enter the protocol."""
                  with self.temporary_directory() as tmp_dir:
                      root = Path(tmp_dir)
                      sentinel = root / "parent-owned.txt"
                      sentinel.write_text("preserve\n", encoding="utf-8")
                      unsafe_paths = (
                          "",
                          ".",
                          "/",
                          str(root),
                          "../outside",
                          "nested/../../outside",
                          "nested//target",
                          "nested/",
                          ".git",
                          ".git/config",
                          "target:other",
                          r"target\other",
                      )

                      for unsafe_path in unsafe_paths:
                          with self.subTest(path=unsafe_path):
                              manifest = self.write_manifest(root, unsafe_path)
                              result = self.run_manifest(root, manifest, "regular-specs")
                              self.assertEqual(result.returncode, 1)
                              self.assertEqual(result.stdout, "")
                              self.assertIn(
                                  "SURFACE_MANIFEST_ERROR=surface path must be a "
                                  "normalized non-root repository-relative POSIX path",
                                  result.stderr,
                              )
                              self.assertEqual(
                                  sentinel.read_text(encoding="utf-8"),
                                  "preserve\n",
                              )

              def test_valid_target_is_exactly_one_nonempty_record(self) -> None:
                  """A valid record retains the existing trailing-newline protocol."""
                  with self.temporary_directory() as tmp_dir:
                      root = Path(tmp_dir)
                      manifest = self.write_manifest(root, "safe/target")

                      result = self.run_manifest(root, manifest, "regular-specs")

                      self.assertEqual(
                          result.returncode,
                          0,
                          result.stdout + result.stderr,
                      )
                      self.assertEqual(result.stdout, "safe/target:\n")


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Run focused unit and parent-update regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/agent_tools/test_surface_manifest_root_absence.py
          python3 tests/agent_tools/test_surface_manifest_sync_protocol.py
          python3 tests/tools/test_update_agent_canon_removed_legacy.py
          python3 - <<'PY'
          from pathlib import Path
          import tempfile

          from tests.tools.test_update_agent_canon import SubmoduleUpdateAgentCanonTest
          from tests.tools.test_update_agent_canon_latest_todos import (
              test_latest_reports_pending_update_todos_without_failing,
          )

          case = SubmoduleUpdateAgentCanonTest(
              methodName="test_ensure_latest_reports_already_current_submodule"
          )
          case.setUp()
          try:
              case.test_ensure_latest_reports_already_current_submodule()
          finally:
              case.doCleanups()

          with tempfile.TemporaryDirectory() as tmp_dir:
              test_latest_reports_pending_update_todos_without_failing(Path(tmp_dir))
          PY

      - name: Run /workspace bind-mount regression
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.agent-canon/issue-771-bind-source"
          rm -rf "$fixture"
          mkdir -p "$fixture/.git"
          printf 'ref: refs/heads/main\n' > "$fixture/.git/HEAD"
          cat > "$fixture/manifest.toml" <<'EOF'
          version = 1
          prefix = "."
          integration_mode = "live-agent-canon"
          default_consumer = false
          selection = "explicit-opt-in"
          EOF
          sudo env REPO="$GITHUB_WORKSPACE" FIXTURE="$fixture" \
            unshare --mount --propagation private sh -eu -c '
              mkdir -p /workspace
              mount --bind "$FIXTURE" /workspace
              trap "umount /workspace; rmdir /workspace 2>/dev/null || true" EXIT
              python3 "$REPO/tools/agent_tools/surface_manifest.py" \
                --root /workspace --prefix . --manifest manifest.toml \
                regular-specs > /tmp/issue-771-specs
              test ! -s /tmp/issue-771-specs
              ROOT_DIR=/workspace
              while IFS= read -r spec; do
                path=${spec%%:*}
                rm -rf -- "$ROOT_DIR/$path"
              done < /tmp/issue-771-specs
              test -f /workspace/.git/HEAD
            '

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentCanon Issue Automation"
          git config user.email "agent-canon-issue@automation.invalid"
          git add \
            tools/agent_tools/surface_manifest.py \
            tests/agent_tools/test_surface_manifest_sync_protocol.py
          git diff --cached --check
          git commit -m "fix: fail closed on root sync targets (#771)"
          git push origin HEAD:fix/771-root-delete-guard
