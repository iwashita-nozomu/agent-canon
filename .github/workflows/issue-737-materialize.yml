# @dependency-start
# contract configuration
# responsibility Materializes the one-shot Issue #737 implementation payload on its dedicated branch and validates the resulting repository state.
# upstream issue https://github.com/iwashita-nozomu/agent-canon/issues/737 provider-independent admitted direct GPU command contract
# downstream implementation ../../tools/experiments/gpu_command_admission.py materialized direct admission owner
# downstream implementation ../../tools/experiments/run_gpu_command.py materialized direct command CLI
# @dependency-end

name: Issue 737 Materialize GPU Direct Command

on:
  push:
    branches:
      - issue-737-gpu-direct-command

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-737]') }}
    runs-on: ubuntu-latest
    env:
      AGENT_CANON_PARENT_ROOT: ${{ github.workspace }}
      AGENT_CANON_ACTIVE_REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python3 -m pip install --upgrade pytest pyyaml tomli packaging

      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Extract and verify implementation payload
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import io
          import os
          import runpy
          import shutil
          import tarfile
          import zlib
          from pathlib import Path

          root = Path.cwd()
          stage = root / ".issue737"
          parts = tuple(sorted(stage.glob("payload.part*")))
          expected_blob_shas = (
              "3314692c559dfe3a303a36d5d3199e8b9546c441",
              "e8fb4dd1f68c6a236acedae383bb9c35d912d358",
              "c3a6bec959ae5411eb36e3bf7d6175b9da6d1c0c",
              "d108ad402addd9dc66b1ed381d21e8c1d24aff09",
              "b4a2e354bcedc021c3962642aab4c02f848cd00a",
              "0eb090c9ac3fc755e6c18d4eea4f0109f3d3cf97",
              "ee605f650e66d6cd653045fb85540d783dea8353",
              "f468062e2b41edfbfd9c508432daf6dc139b4f04",
          )
          if len(parts) != len(expected_blob_shas):
              raise SystemExit(f"expected 8 payload parts, found {len(parts)}")

          encoded_parts: list[str] = []
          for path, expected_sha in zip(parts, expected_blob_shas):
              content = path.read_bytes()
              header = f"blob {len(content)}\0".encode("ascii")
              observed_sha = hashlib.sha1(header + content).hexdigest()
              if observed_sha != expected_sha:
                  raise SystemExit(
                      f"payload blob mismatch for {path}: {observed_sha} != {expected_sha}"
                  )
              encoded_parts.append(content.decode("ascii").strip())

          raw = base64.b64decode("".join(encoded_parts), validate=True)
          try:
              archive = gzip.decompress(raw)
          except (gzip.BadGzipFile, EOFError):
              if raw[:3] != b"\x1f\x8b\x08" or raw[3] != 0:
                  raise
              archive = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)

          extracted = Path(os.environ["RUNNER_TEMP"]) / "issue737-payload"
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as package:
              for member in package.getmembers():
                  candidate = Path(member.name)
                  if candidate.is_absolute() or ".." in candidate.parts:
                      raise SystemExit(f"unsafe payload member: {member.name}")
              package.extractall(extracted)

          replacements = {
              "s dout": "stdout",
              "s derr": "stderr",
              "self.s  def record(": "self.started_at_utc",
              "self.s  def recomonotonic": "self.started_at_monotonic",
              "s  def record( = datetime.now(UTC).isoformat()": (
                  "started_at_utc = datetime.now(UTC).isoformat()"
              ),
              "s  def  = time.monotonic()": "started_at_monotonic = time.monotonic()",
              "st de_new_session=True": "start_new_session=True",
              "every failure is retainf  until": "every failure is retained until",
              "AgentCanon-s  def  descendant": "AgentCanon-started descendant",
              "finishedrecord( = datetime.now(UTC).isoformat()": (
                  "finished_at_utc = datetime.now(UTC).isoformat()"
              ),
              "s  def record(=s  def record(": "started_at_utc=started_at_utc",
              "finishedrecord(=finished_at_utc": "finished_at_utc=finished_at_utc",
              "s  def recomonotonic=s  def ": (
                  "started_at_monotonic=started_at_monotonic"
              ),
              "finishedrecomonotonic=finished": "finished_at_monotonic=finished",
              "retainf _gpu_process_uuids=()": "retained_gpu_process_uuids=()",
          }
          for path in extracted.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              repaired = text
              for source, target in replacements.items():
                  repaired = repaired.replace(source, target)
              if repaired != text:
                  path.write_text(repaired, encoding="utf-8")

          expected_files = {
              "tools/experiments/gpu_command_admission.py": (
                  "168b7a458d9d96506e43ca3040faa576980acb60262bea6862f66e00ed989706"
              ),
              "tools/experiments/run_gpu_command.py": (
                  "adfb6b06f439c8b91631e701dcb42fe65db4d03d562f52be80085b5ccfa85492"
              ),
              "tests/tools/test_run_gpu_command.py": (
                  "f17440c841ad0db4c838f09a9f79f5e40fcf6c9d3e03b33a6c3a478c91802d4f"
              ),
              "documents/experiments/gpu-direct-command.md": (
                  "7e1d8817844d12b75fc12356ca401688a35ffe21cfebbbd3b0d0f784b713f29c"
              ),
              "agents/skills/gpu-execution.md": (
                  "eab0c3a0b7049902187db6f9c556e516f93290c72cd582e68bca01d85bcc1b44"
              ),
          }
          for relative, expected_sha in expected_files.items():
              source = extracted / relative
              observed_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if observed_sha != expected_sha:
                  raise SystemExit(
                      f"repaired payload mismatch for {relative}: "
                      f"{observed_sha} != {expected_sha}"
                  )
              destination = root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          runpy.run_path(str(extracted / ".issue737" / "bootstrap_patch.py"))

          direct_doc = root / "documents/experiments/gpu-direct-command.md"
          direct_text = direct_doc.read_text(encoding="utf-8")
          direct_text = (
              direct_text.replace(r"\(", "$",).replace(r"\)", "$")
              .replace(r"\[", "$$\n").replace(r"\]", "\n$$")
          )
          direct_doc.write_text(direct_text, encoding="utf-8")

          def replace_one(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"ambiguous patch boundary in {path}: {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          planner = root / "tools/experiments/execution_resource_plan.py"
          replace_one(
              planner,
              "# responsibility Owns the immutable ExecutionResourcePlan transaction, canonical GPU allocation, ExperimentRunner handoff, and completion coverage.\n",
              "# responsibility Owns the immutable ExecutionResourcePlan transaction, canonical GPU allocation, reusable GPU admission primitives, managed ExperimentRunner handoff, and completion coverage.\n",
          )
          replace_one(
              planner,
              "# downstream implementation ./run_managed_experiment.py managed experiment adapter\n",
              "# downstream implementation ./run_managed_experiment.py managed experiment adapter\n"
              "# downstream implementation ./gpu_command_admission.py provider-independent direct GPU admission adapter\n",
          )
          replace_one(
              planner,
              "# Static consumer closure: run_managed_experiment.py is the only managed-run\n"
              "# consumer; generic lifecycle remains in the external admitted CLI.\n",
              "# Static consumer closure: run_managed_experiment.py is the managed-run\n"
              "# consumer; gpu_command_admission.py reuses only admission primitives for the\n"
              "# provider-independent direct-command route.\n",
          )

          source_packet = root / "documents/experiments/gpu-admission-r5-source-packet.md"
          replace_one(
              source_packet,
              "実行順序は次の固定 sequence です。\n",
              "以下の sequence と CLI handshake は managed experiment adapter の固定契約です。\n"
              "provider-independent direct command は同じ NVIDIA evidence、BUSY/UNKNOWN/FREE\n"
              "分類、full UUID lock、lock-held fresh readback、plan freeze を再利用しますが、\n"
              "外部 provider protocol と completion coverage を要求しません。direct route の\n"
              "正本は `documents/experiments/gpu-direct-command.md` です。\n\n"
              "managed experiment の実行順序は次の固定 sequence です。\n",
          )

          shutil.rmtree(stage)
          PY

      - name: Materialize runtime skill shim
        run: |
          python3 tools/agent_tools/skill_shim_materializer.py materialize --root . --all
          python3 tools/agent_tools/skill_shim_materializer.py readback --root . --all

      - name: Validate direct and managed GPU contracts
        run: |
          python3 -m compileall -q \
            tools/experiments/gpu_command_admission.py \
            tools/experiments/run_gpu_command.py \
            tests/tools/test_run_gpu_command.py
          python3 -m pytest tests/tools/test_run_gpu_command.py -q
          python3 -m pytest tests/tools/test_run_managed_experiment.py -q
          python3 -m pytest tests/tools/test_execution_resource_plan.py -q

      - name: Validate docs, skill catalog, and dependency headers
        run: |
          python3 tools/agent_tools/check_skill_frontmatter.py --root .
          python3 tools/agent_tools/skill_tool_commands.py check
          tools/bin/agent-canon docs check \
            documents/experiments/gpu-direct-command.md \
            documents/experiments/gpu-admission-r5-source-packet.md \
            agents/skills/gpu-execution.md
          python3 tools/agent_tools/check_dependency_headers.py --changed
          bash tools/agent_tools/check_dependency_header_format.sh --changed --require-header
          git diff --check

      - name: Commit and push materialized implementation
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Issue #737 materialization produced no changes." >&2
            exit 1
          fi
          git commit -m "feat: separate GPU admission for direct commands (#737) [materialized-737]"
          git push origin HEAD:issue-737-gpu-direct-command
