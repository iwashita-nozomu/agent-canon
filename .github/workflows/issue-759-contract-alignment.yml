name: issue-759-consumer-static-validation

on:
  push:
    branches:
      - fix/759-autonomous-convergence
    paths:
      - .github/workflows/issue-759-contract-alignment.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/759-autonomous-convergence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml tomli

      - name: Restore consumer-static views and derive tests from the owner contract
        shell: bash
        run: |
          mkdir -p "$HOME/.agent-canon/tmp"
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/agent_tools/test_execution_time_aware_orchestration_contract.py")
          text = path.read_text(encoding="utf-8")
          old_import = "import tempfile\nimport unittest"
          new_import = "import tempfile\nimport tomllib\nimport unittest"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected orchestration test import block")
          text = text.replace(old_import, new_import, 1)

          old_helper = '''    def read(self, relative_path: str) -> str:
        """Read one repository surface for a static contract assertion."""
        return (PROJECT_ROOT / relative_path).read_text(encoding="utf-8")

'''
          new_helper = old_helper + '''    def contract(self) -> dict[str, object]:
        """Read the machine-readable owner instead of duplicating its markers."""
        return tomllib.loads(
            self.read("agents/skills/agent-orchestration.execution-contract.toml")
        )

'''
          if text.count(old_helper) != 1:
              raise SystemExit("unexpected orchestration test helper block")
          text = text.replace(old_helper, new_helper, 1)

          owner_replacement = '''    def test_owner_keeps_the_complete_work_conservation_contract(self) -> None:
        """The canonical owner must retain every declared execution-time decision."""
        text = " ".join(
            self.read("agents/skills/agent-orchestration.md").lower().split()
        )
        markers = self.contract()["owner_markers"]
        self.assertIsInstance(markers, list)
        for marker in markers:
            self.assertIsInstance(marker, str)
            self.assertIn(" ".join(marker.lower().split()), text, marker)

'''
          text, count = re.subn(
              r"    def test_owner_keeps_the_complete_work_conservation_contract\(self\) -> None:\n.*?(?=    def test_production_checker_accepts_the_complete_owner_closure)",
              owner_replacement,
              text,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("unexpected owner contract test block")

          pr_replacement = '''    def test_pr_processing_consumes_and_specializes_the_owner(self) -> None:
        """PR processing keeps queue-specific rules under the owner contract."""
        text = " ".join(self.read("agents/skills/pr-processing.md").lower().split())
        consumers = self.contract()["consumers"]
        self.assertIsInstance(consumers, list)
        consumer = next(
            item
            for item in consumers
            if isinstance(item, dict) and item.get("id") == "pr-processing"
        )
        markers = consumer["required_markers"]
        self.assertIsInstance(markers, list)

        self.assertIn(OWNER_REF.lower(), text)
        for marker in markers:
            self.assertIsInstance(marker, str)
            self.assertIn(" ".join(marker.lower().split()), text, marker)
        self.assertIn("never use elapsed time", text)

'''
          text, count = re.subn(
              r"    def test_pr_processing_consumes_and_specializes_the_owner\(self\) -> None:\n.*?(?=    def test_runtime_catalog_and_schedule_project_the_owner)",
              pr_replacement,
              text,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("unexpected PR consumer test block")

          runtime_replacement = '''    def test_runtime_catalog_and_schedule_project_the_owner(self) -> None:
        """Projections point to the owner without becoming policy copies."""
        contract = self.contract()
        consumers = contract["consumers"]
        self.assertIsInstance(consumers, list)
        indexed = {
            item["id"]: item
            for item in consumers
            if isinstance(item, dict) and isinstance(item.get("id"), str)
        }

        self.assertIn(OWNER_REF, self.read("agents/task_catalog.yaml"))
        self.assertIn(OWNER_REF, self.read("templates/agents/schedule.md"))

        runtime = " ".join(
            self.read(".agents/skills/agent-orchestration/SKILL.md").lower().split()
        )
        runtime_markers = indexed["runtime-shim"]["required_markers"]
        self.assertIsInstance(runtime_markers, list)
        for marker in runtime_markers:
            self.assertIsInstance(marker, str)
            self.assertIn(" ".join(marker.lower().split()), runtime, marker)

        schedule = " ".join(self.read("templates/agents/schedule.md").lower().split())
        schedule_markers = indexed["schedule"]["required_markers"]
        self.assertIsInstance(schedule_markers, list)
        for marker in schedule_markers:
            self.assertIsInstance(marker, str)
            self.assertIn(" ".join(marker.lower().split()), schedule, marker)

'''
          text, count = re.subn(
              r"    def test_runtime_catalog_and_schedule_project_the_owner\(self\) -> None:\n.*?(?=\nif __name__ == \"__main__\":)",
              runtime_replacement,
              text,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("unexpected runtime projection test block")

          path.write_text(text, encoding="utf-8")
          PY
          python tools/agent_tools/model_profile_registry.py \
            --root . \
            --projection consumer-static \
            --generate-role-views

      - name: Check convergence and consumer-static contracts
        run: |
          python tools/agent_tools/check_execution_time_aware_orchestration.py --root .
          python tools/agent_tools/autonomous_convergence.py --root . --check-contract
          python tools/agent_tools/model_profile_registry.py \
            --root . \
            --projection consumer-static \
            --check-role-views

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/agent_tools/test_autonomous_convergence.py \
            tests/agent_tools/test_execution_time_aware_orchestration_contract.py \
            tests/agent_tools/test_model_profile_registry.py \
            tests/agent_tools/test_bootstrap_and_close.py \
            -q --tb=short

      - name: Commit validated consumer-static convergence change
        run: |
          rm .github/workflows/issue-759-contract-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Restore consumer-static convergence views (#759)"
          git push origin HEAD:fix/759-autonomous-convergence
