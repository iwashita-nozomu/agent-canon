name: issue-759-contract-validation

on:
  push:
    branches:
      - fix/759-autonomous-convergence
    paths:
      - .github/workflows/issue-759-contract-alignment.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/759-autonomous-convergence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml tomli

      - name: Check convergence contracts
        run: |
          python tools/agent_tools/check_execution_time_aware_orchestration.py --root .
          python tools/agent_tools/autonomous_convergence.py --root . --check-contract
          python tools/agent_tools/model_profile_registry.py --root . --check-role-views

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/agent_tools/test_autonomous_convergence.py \
            tests/agent_tools/test_execution_time_aware_orchestration_contract.py \
            tests/agent_tools/test_model_profile_registry.py \
            tests/agent_tools/test_bootstrap_and_close.py \
            -q --tb=short

      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/issue-759-contract-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Issue #759 validation workflow"
          git push origin HEAD:fix/759-autonomous-convergence
