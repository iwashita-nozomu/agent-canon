# deterministic source-patch finalization rerun
name: issue-759-finite-convergence-finalization

on:
  push:
    branches:
      - fix/759-autonomous-convergence
    paths:
      - .github/workflows/issue-759-contract-alignment.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/759-autonomous-convergence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml tomli ruff

      - name: Integrate current main without discarding branch history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Materialize reviewed finite-state implementation
        run: |
          python .github/issue-759-repair.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tools/agent_tools/autonomous_convergence.py": [
                  (
                      "from dataclasses import dataclass, fields\n"
                      "from pathlib import Path\n"
                      "from typing import Iterable, Mapping, Sequence\n",
                      "from collections.abc import Iterable, Mapping, Sequence\n"
                      "from dataclasses import dataclass, fields\n"
                      "from pathlib import Path\n",
                  ),
                  (
                      "    if enforce_terminal_gate and state.terminal_state in {\"ship\", \"handoff\"}:\n"
                      "        if not _terminal_ready(state):\n"
                      "            raise ConvergenceContractError(\n"
                      "                \"terminal_state:terminal_gate_not_satisfied\"\n"
                      "            )\n",
                      "    if (\n"
                      "        enforce_terminal_gate\n"
                      "        and state.terminal_state in {\"ship\", \"handoff\"}\n"
                      "        and not _terminal_ready(state)\n"
                      "    ):\n"
                      "        raise ConvergenceContractError(\n"
                      "            \"terminal_state:terminal_gate_not_satisfied\"\n"
                      "        )\n",
                  ),
              ],
              "tools/agent_tools/check_execution_time_aware_orchestration.py": [
                  (
                      "    if consumer_id != EXPECTED_OWNER_SKILL and owner_heading:\n"
                      "        if text.count(owner_heading):\n"
                      "            add(\n"
                      "                findings,\n"
                      "                \"duplicate_local_scheduling_definition\",\n"
                      "                path,\n"
                      "                \"owner-definition-present\",\n"
                      "            )\n",
                      "    if (\n"
                      "        consumer_id != EXPECTED_OWNER_SKILL\n"
                      "        and owner_heading\n"
                      "        and text.count(owner_heading)\n"
                      "    ):\n"
                      "        add(\n"
                      "            findings,\n"
                      "            \"duplicate_local_scheduling_definition\",\n"
                      "            path,\n"
                      "            \"owner-definition-present\",\n"
                      "        )\n",
                  ),
              ],
              "tests/agent_tools/test_autonomous_convergence.py": [
                  (
                      "from autonomous_convergence import (  # noqa: E402\n",
                      "from autonomous_convergence import (\n",
                  ),
              ],
          }

          for path_string, changes in replacements.items():
              path = Path(path_string)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected patch cardinality for {path}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          chmod +x \
            tools/agent_tools/autonomous_convergence.py \
            tools/agent_tools/check_execution_time_aware_orchestration.py
          python tools/agent_tools/model_profile_registry.py --root . --projection consumer-static --generate-role-views

      - name: Check owner and generated-consumer alignment
        run: |
          python tools/agent_tools/check_execution_time_aware_orchestration.py --root .
          python tools/agent_tools/autonomous_convergence.py --root . --check-contract
          python tools/agent_tools/model_profile_registry.py --root . --projection consumer-static --check-role-views

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/agent_tools/test_autonomous_convergence.py \
            tests/agent_tools/test_execution_time_aware_orchestration_contract.py \
            tests/agent_tools/test_model_profile_registry.py \
            -q --tb=short

      - name: Run repository-owned static validation
        run: |
          python -m ruff check \
            tools/agent_tools/autonomous_convergence.py \
            tools/agent_tools/check_execution_time_aware_orchestration.py \
            tests/agent_tools/test_autonomous_convergence.py \
            tests/agent_tools/test_execution_time_aware_orchestration_contract.py
          python -m ruff format --check \
            tools/agent_tools/autonomous_convergence.py \
            tools/agent_tools/check_execution_time_aware_orchestration.py \
            tests/agent_tools/test_autonomous_convergence.py \
            tests/agent_tools/test_execution_time_aware_orchestration_contract.py
          git diff --check

      - name: Commit main integration and validated implementation
        run: |
          rm \
            .github/issue-759-repair.py \
            .github/issue-759-payload-autonomous.txt \
            .github/issue-759-payload-autonomous-tests.txt \
            .github/issue-759-payload-contract.txt \
            .github/issue-759-payload-checker.txt \
            .github/issue-759-payload-contract-tests.txt \
            .github/workflows/issue-759-contract-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: enforce finite autonomous convergence (#759)"
          git push origin HEAD:fix/759-autonomous-convergence
