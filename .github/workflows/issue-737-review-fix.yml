# @dependency-start
# contract workflow
# responsibility Applies and validates the one-shot Issue #737 lock-contention review correction.
# upstream implementation ../../tools/experiments/gpu_command_admission.py direct GPU admission release owner
# downstream implementation ../../tests/tools/test_run_gpu_command.py lock-contention regression
# @dependency-end

name: Issue 737 Lock Contention Review Fix

on:
  push:
    branches:
      - issue-737-gpu-direct-command

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed release-disposition correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          implementation = Path("tools/experiments/gpu_command_admission.py")
          text = implementation.read_text(encoding="utf-8")
          old = '''def _release_dispositions_complete(
              dispositions: Sequence[FdReleaseEvidence],
          ) -> bool:
              return bool(dispositions) and all(
                  item.error_kind is None
                  and item.disposition in {"released", "rolled_back"}
                  for item in dispositions
              )
          '''
          new = '''def _release_dispositions_complete(
              dispositions: Sequence[FdReleaseEvidence],
          ) -> bool:
              return bool(dispositions) and all(
                  item.error_kind is None
                  and item.disposition in {
                      "busy_candidate",
                      "released",
                      "rolled_back",
                  }
                  for item in dispositions
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("release-disposition patch boundary is not unique")
          implementation.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/tools/test_run_gpu_command.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_busy_candidate_close_is_a_complete_release_disposition() -> None:"
          if marker in test_text:
              raise SystemExit("lock-contention regression already exists")
          test_text += '''


def test_busy_candidate_close_is_a_complete_release_disposition() -> None:
    dispositions = (
        FdReleaseEvidence(
            component="gpu-reservation-lock",
            uuid=GPU_A,
            disposition="busy_candidate",
            close_attempts=1,
            error_kind=None,
            fingerprint="busy-candidate-closed",
        ),
        FdReleaseEvidence(
            component="gpu-reservation-lock",
            uuid=GPU_B,
            disposition="released",
            close_attempts=1,
            error_kind=None,
            fingerprint="selected-candidate-released",
        ),
    )

    assert direct._release_dispositions_complete(dispositions) is True
'''
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Validate direct GPU command contract
        run: |
          python3 -m pip install --upgrade pytest
          python3 -m compileall -q \
            tools/experiments/gpu_command_admission.py \
            tests/tools/test_run_gpu_command.py
          python3 -m pytest tests/tools/test_run_gpu_command.py -q
          git diff --check

      - name: Commit reviewed correction and remove this workflow
        run: |
          rm .github/workflows/issue-737-review-fix.yml
          rm -rf .pytest_cache tools/experiments/__pycache__ tests/tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: accept skipped busy GPU lock candidates (#737)"
          git push origin HEAD:issue-737-gpu-direct-command
