# @dependency-start
# contract workflow
# responsibility Regenerates the committed log-surface inventory on the dedicated maintenance branch.
# upstream implementation ../../tools/agent_tools/log_surface_inventory.py inventory generator
# downstream environment ../../documents/log-surface-inventory.json generated baseline
# @dependency-end

name: Refresh Log Surface Baseline

on:
  push:
    branches:
      - agent/refresh-log-surface-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-log-surface-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Regenerate inventory baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent_tools/log_surface_inventory.py \
            --root . \
            --output documents/log-surface-inventory.json
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'log surface baseline is already current'
            exit 0
          fi
          test "$changed" = 'documents/log-surface-inventory.json'

      - name: Commit generated baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- documents/log-surface-inventory.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add documents/log-surface-inventory.json
          git commit -m 'docs: refresh log surface inventory'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
