# Canonical source: templates/documents/github/issue/eval-capture.yml. Generated projection targets .github/ISSUE_TEMPLATE/eval-capture.yml; edit this source only.

name: Agent behavior eval capture
description: 観測した agent/workflow failure を再利用可能な eval case に変換します。
title: "[eval] "
labels: ["agent-quality", "eval"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Failure category / 原因分類
      options:
        - scope-creep
        - helper-sprawl
        - upstream-mutation
        - api-surface-miss
        - responsibility-boundary
        - workflow-bypass
        - doc-drift
        - insufficient-evidence
        - wrong-artifact
        - non-reproducible-review
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger / 発生条件
      value: |
        user request:
        repo state / relevant files:
        likely bad assumption:
    validations:
      required: true
  - type: textarea
    id: observed_evidence
    attributes:
      label: 観測証拠と影響
      description: 観測 artifact/path、再現性、影響する owner、実務上の影響を特定します。
      value: |
        observed facts:
        evidence paths:
        owner:
        impact:
    validations:
      required: true
  - type: textarea
    id: bad_behavior
    attributes:
      label: 捕捉する bad behavior
      value: |
        forbidden action 1:
        forbidden action 2:
    validations:
      required: true
  - type: textarea
    id: required_behavior
    attributes:
      label: 必須の挙動
      value: |
        must inspect:
        must ask / must not ask:
        allowed outputs:
        disallowed outputs:
    validations:
      required: true
  - type: textarea
    id: eval_shape
    attributes:
      label: Eval shape / oracle boundary
      value: |
        input prompt:
        fixtures / repo snapshot:
        expected route:
        assertions:
        negative assertions:
        oracle type: machine / rubric / human-reviewed
        necessary evidence:
        sufficient evidence:
        not proven:
    validations:
      required: true
  - type: textarea
    id: options_and_non_goals
    attributes:
      label: Options、棄却根拠、non-goals、conflict intent
      value: |
        option A:
        option B:
        selected / rejected rationale:
        non-goals:
        conflict intent:
        independent reviewer and evidence:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入と close condition
      value: |
        acceptance oracle:
        validation:
        close condition:
    validations:
      required: true
  - type: textarea
    id: close_condition
    attributes:
      label: Close condition / lifecycle
      value: |
        eval added:
        eval fails before fix:
        eval passes after fix:
        linked rule / workflow / tool updated:
        failure-cause classification:
        retention / cleanup owner:
    validations:
      required: true
