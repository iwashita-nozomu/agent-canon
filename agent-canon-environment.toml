# @dependency-start
# contract configuration
# responsibility Defines machine-readable AgentCanon development environment expectations.
# upstream design CONTAINER_OPERATIONS.md canonical shared tool-runtime ownership boundary
# upstream design documents/experiments/gpu-admission-r5-source-packet.md exact shared runtime artifact identity
# upstream design documents/design/rust-agent-tool-migration.md Rust tool migration policy
# upstream implementation bootstrap.sh installs and starts the shared tool runtime
# downstream implementation tools/runtime/dispatch/agent-canon/src/structured_analysis.rs implements structured-analysis cache build tooling
# downstream implementation tools/analysis/documents/prose_reasoning_graph.py creates prose graph DBs under the explicit external runtime
# downstream environment agents/skills/gpu-execution.md routes the audited provider identity
# downstream environment documents/tools/dependency-tools-and-licenses.md projects environment tool ownership for readers
# downstream environment tests/tools/test_run_managed_experiment.py verifies provider identity binding
# downstream environment tools/experiments/execution/run_managed_experiment.py binds the audited external provider identity
# @dependency-end

manifest_kind = "agent_canon_environment"
version = 1

[toolchain.rust]
owner = "agent-canon"
install_surface = "bootstrap/container/image/dependencies.toml"
manual_install_summary = "Use bootstrap.sh to build or reuse the shared image-owned Rust toolchain."
manual_install_commands = [
  "bash bootstrap.sh --control-parent-root <parent> install",
  "bash bootstrap.sh --control-parent-root <parent> start",
]
required_binaries = [
  "cargo",
  "rustc",
  "rustup",
  "rustfmt",
  "cargo-clippy",
  "rust-analyzer",
]
runtime_owner = "bootstrap/container/image/Dockerfile"
host_toolchain_install = "forbidden; toolchain is image-owned"

[compiled_tools.agent_canon_cli]
owner = "agent-canon"
source_manifest = "tools/runtime/dispatch/agent-canon/Cargo.toml"
source_entrypoint = "tools/runtime/dispatch/agent-canon/src/main.rs"
install_root = "/usr/local/share/agent-canon"
install_binary = "/usr/local/bin/agent-canon"
path_shim = "forbidden; executable exists only in the shared tool image"
compatibility_symlink = "forbidden; no host /usr/local projection"
rebuild_command = "bash bootstrap.sh --control-parent-root <root> install"
validation_commands = [
  "agent-canon --version",
  "agent-canon rust-migration-audit --root .",
  "agent-canon rust-migration-plan --root . --limit 12",
  "agent-canon semantic-index --help",
  "agent-canon structured-analysis build --root . --profile manual --out-dir ${TMPDIR:-/tmp}/agent-canon-structured-analysis-smoke",
]

[json_cli_tools]
owner = "agent-canon"
install_surface = "bootstrap/container/image/dependencies.toml"
install_function = "install_json_cli_tools"
required_binaries = [
  "jq",
]
install_command = "bootstrap.sh install"
runtime_validation_commands = [
  "jq --version",
]
dockerfile_policy = "image-owned in bootstrap/container/image; project Dockerfiles do not install AgentCanon tools"


[container_local_runtime]
owner = "ExecutionResourcePlan and environment owner"
runtime_root = "/var/lib/agent-canon/runtime"
source_projection_root = "/workspace/reports/agents/<run-id>/runtime"
tool_availability_projection = "tool-availability.json"
environment_certificate = "ExecutionResourcePlan.EnvironmentCertificate/v1"
runtime_session_root_env = "AGENT_CANON_CODEX_SESSION_ROOT"
runtime_session_root = "/home/project/.codex/sessions"
runtime_session_root_policy = "explicit container-local runtime owner; HOME and CODEX_HOME fallback forbidden"
host_codex_home_mount = "forbidden"
tree_capability = "required; cataloged in EnvironmentCertificate"
successful_completion_contract = "bootstrap image readback publishes cataloged tools; runtime plan readback certifies availability before ExperimentRunner execute"
runtime_route = "BOOTSTRAP_MANAGED_CONTAINER"
shared_runtime_source = "/var/lib/agent-canon/runtime"
host_shared_runtime_source = "${runtime_root}/container-runtime (bootstrap-owned)"
runtime_directory_mode = "02770"
runtime_file_mode = "0660"
runtime_umask = "0007"
local_flock_filesystems = ["btrfs", "ext4", "xfs"]
provision_receipt = "/var/lib/agent-canon/runtime/shared-runtime-provision.json"
readback_receipt = "/var/lib/agent-canon/runtime/shared-runtime-readback.json"
compose_user = "PROJECT_UID:PROJECT_GID (materialized host UID/GID)"
compose_group_add = "omitted; primary PROJECT_UID:PROJECT_GID identity only"
compose_bind_source = "${runtime_root}/container-runtime (bootstrap-owned)"
compose_bind_target = "/var/lib/agent-canon/runtime"

[external_provider.experiment_runner_admitted]
owner = "managed experiment adapter contract"
activation = "managed_experiment_only"
direct_gpu_command_required = false
repository = "https://github.com/iwashita-nozomu/experiment-runner"
merged_commit = "71b3630266151703bdf88b11741b7492eca92fb4"
contract_path = "documents/experiment-runner-admission.md"
contract_sha256 = "2de2b63aac3076e6aacdf1ff10b2c35a0235e835504aeff2db92a7750a720d85"
executable = "experiment-runner-admitted"
invocation = "experiment-runner-admitted --request <path> --result <path>"
request_schema = "agentcanon-managed-run/v1"
result_schema = "agentcanon-managed-run-result/v1"
identity_binding = "managed request metadata and managed-run receipt"
installation_owner = "consumer repository when managed mode is selected"
agent_canon_install_policy = "forbidden; audit the consumer-provided executable only in managed mode"

[structured_analysis_cache]
owner = "agent-canon"
install_surface = "bootstrap/container/image/dependencies.toml"
primary_cli = "agent-canon structured-analysis build"
runtime_command = "bootstrap.sh tool run structured-analysis --root <registered-target> --profile manual"
cache_root = "${AGENT_CANON_STRUCTURED_ANALYSIS_HOME:-$HOME/.cache/agent-canon/structured-analysis}"
database_name = "prose_graph.sqlite"
diagnostics_database_name = "diagnostics.sqlite"
export_directory = "exports"
repo_tree_write_policy = "forbidden; cache build writes only to user-home cache or explicit --out-dir"
post_create_failure_policy = "warning-only; container creation must continue and print the manual rebuild command"
source_to_ir_scope = "git-visible files plus document-canon findings; no source rewrite"
analysis_scope = "materialize source DB diagnostics into a separate warnings DB"
manual_analyze_command = "agent-canon structured-analysis analyze --db <cache-dir>/prose_graph.sqlite --diagnostics-db <cache-dir>/diagnostics.sqlite --profile manual"

[prose_reasoning_graph_cache]
owner = "agent-canon"
primary_cli = "python3 tools/analysis/documents/prose_reasoning_graph.py"
runtime_root_env = "AGENT_CANON_RUNTIME_ROOT"
cache_root = "<AGENT_CANON_RUNTIME_ROOT>/prose-reasoning-graph"
database_name = "prose_graph.sqlite"
explicit_db_flag = "--db <path>"
repo_tree_write_policy = "DB and all graph artifacts stay in the explicit external runtime; --db and output paths must remain inside it, with no source-tree, HOME, XDG, or implicit cache fallback"
source_to_ir_scope = "Markdown/plain text source documents plus optional user prompt context; no source rewrite"
