# @dependency-start
# contract environment
# responsibility Declares only the shared AgentCanon Python, Rust, and LSP image capabilities.
# upstream design ../../documents/design/agent-canon-bootstrap-tool-runtime.md shared tool runtime boundary
# downstream implementation ./Dockerfile image-install and immutable receipts
# downstream implementation ../../tools/analysis/dependencies/dependency_plan.py typed dependency planner
# @dependency-end

schema = "agent-canon.tool-dependencies"
schema_version = 2

# The shared image intentionally excludes project dependencies, Codex, GitHub
# CLI, editor integrations, GPU tooling, and lifecycle helpers.

[[records]]
# pipx is a build-only provider; its dependent launchers are verified below
# and the package itself is removed before the runtime image is published.
id = "pipx"
package = "pipx"
method = "apt-package"
version = "1.4.3-1"
source = "ubuntu:24.04"
verification = { kind = "apt-package" }
deps = []
provides = ["pipx"]
failure_policy = "fail"

[[records]]
id = "check-jsonschema"
package = "check-jsonschema"
method = "pipx"
version = "0.31.0"
source = "https://pypi.org/simple"
verification = { kind = "pipx-package", executable = "check-jsonschema", args = ["--version"], output_contains = "0.31.0" }
deps = ["pipx"]
provides = ["check-jsonschema"]
failure_policy = "fail"

[[records]]
id = "yamllint"
package = "yamllint"
method = "pipx"
version = "1.35.1"
source = "https://pypi.org/simple"
verification = { kind = "pipx-package", executable = "yamllint", args = ["--version"], output_contains = "1.35.1" }
deps = ["pipx"]
provides = ["yamllint"]
failure_policy = "fail"

[[records]]
id = "pyright-language-server"
package = "pyright"
method = "npm-global"
version = "1.1.411"
source = "https://registry.npmjs.org/pyright"
verification = { kind = "npm-package", executable = "pyright", args = ["--version"], output_contains = "1.1.411" }
deps = ["node"]
provides = ["pyright", "pyright-langserver"]
failure_policy = "fail"

[[records]]
id = "bash-language-server"
package = "bash-language-server"
method = "npm-global"
version = "5.6.0"
source = "https://registry.npmjs.org/bash-language-server"
verification = { kind = "npm-package", executable = "bash-language-server", args = ["--version"], output_contains = "5.6.0" }
deps = ["node"]
provides = ["bash-language-server"]
failure_policy = "fail"

[[records]]
id = "jq"
package = "jq"
method = "apt-package"
version = "1.7.1-3ubuntu0.24.04.2"
source = "ubuntu:24.04"
verification = { kind = "apt-package", executable = "jq", args = ["--version"], output_contains = "jq-1.7" }
deps = []
provides = ["jq"]
failure_policy = "fail"

[[records]]
id = "tree"
package = "tree"
method = "apt-package"
version = "2.1.1-2ubuntu3.24.04.2"
source = "ubuntu:24.04"
verification = { kind = "apt-package", executable = "tree", args = ["--version"], output_contains = "tree v2.1.1" }
deps = []
provides = ["tree"]
failure_policy = "fail"

[[records]]
id = "clangd-language-server"
package = "clangd-18"
method = "apt-package"
version = "1:18.1.3-1ubuntu1"
platforms = ["linux/amd64", "linux/arm64"]
source = "ubuntu:24.04"
executable_owner_packages = ["clangd-18"]
verification = { kind = "apt-package", executable = "clangd-18", args = ["--version"], output_contains = "clangd version 18.1.3" }
deps = []
provides = ["clangd-18"]
failure_policy = "fail"

[[records]]
id = "rust-toolchain"
package = "rust"
method = "rust-toolchain"
version = "1.89.0"
source = "https://static.rust-lang.org"
components = ["rust-src", "rust-analyzer"]
checksums = { x86_64 = "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c", aarch64 = "e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c" }
verification = { kind = "rust-toolchain", executable = "rustc", args = ["--version"], output_contains = "rustc 1.89.0" }
deps = ["rustup-init", "build-essential", "curl"]
provides = ["rust", "cargo", "rust-src", "rust-analyzer"]
failure_policy = "fail"
