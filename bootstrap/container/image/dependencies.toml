# @dependency-start
# contract environment
# responsibility Declares shared AgentCanon Python, Rust, LSP, and native workflow-checking image capabilities.
# upstream design ../../../documents/design/agent-canon-bootstrap-tool-runtime.md shared tool runtime boundary
# downstream implementation ./Dockerfile image-install and immutable receipts
# downstream implementation ../../../tools/analysis/dependencies/dependency_plan.py typed dependency planner
# @dependency-end

schema = "agent-canon.tool-dependencies"
schema_version = 2

# The shared image intentionally excludes project dependencies, Codex, GitHub
# CLI, editor integrations, GPU tooling, and lifecycle helpers.

[[records]]
# pipx is a build-only provider; its dependent launchers are verified below
# and the package itself is removed before the runtime image is published.
id = "pipx"
package = "pipx"
method = "apt-package"
version = "1.4.3-1"
source = "ubuntu:24.04"
verification = { kind = "apt-package" }
deps = []
provides = ["pipx"]
failure_policy = "fail"

[[records]]
id = "check-jsonschema"
package = "check-jsonschema"
method = "pipx"
version = "0.31.0"
source = "https://pypi.org/simple"
verification = { kind = "pipx-package", executable = "check-jsonschema", args = ["--version"], output_contains = "0.31.0" }
deps = ["pipx"]
provides = ["check-jsonschema"]
failure_policy = "fail"

