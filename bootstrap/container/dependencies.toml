# @dependency-start
# contract environment
# responsibility Declares only the shared AgentCanon Python, Rust, and LSP image capabilities.
# upstream design ../../documents/design/agent-canon-bootstrap-tool-runtime.md shared tool runtime boundary
# downstream implementation ./Dockerfile image-install and immutable receipts
# downstream implementation ../../tools/agent_tools/dependency_plan.py typed dependency planner
# @dependency-end

schema = "agent-canon.tool-dependencies"
schema_version = 2

# The image is intentionally amd64-only. UID/GID are non-root defaults; the
# bootstrap may replace them with the invoking non-root Host identity without
# branching on rootless/rootful daemon mode.
[container]
platform = "linux/amd64"
uid = 1000
gid = 1000

# The shared image intentionally excludes project dependencies, Codex, GitHub
# CLI, editor integrations, GPU tooling, and lifecycle helpers.

[[records]]
id = "pyright-language-server"
package = "pyright"
method = "npm-global"
version = "1.1.411"
source = "https://registry.npmjs.org/pyright"
verification = { kind = "npm-package", executable = "pyright", args = ["--version"], output_contains = "1.1.411" }
deps = ["node"]
provides = ["pyright", "pyright-langserver"]
failure_policy = "fail"

[[records]]
id = "bash-language-server"
package = "bash-language-server"
method = "npm-global"
version = "5.6.0"
source = "https://registry.npmjs.org/bash-language-server"
verification = { kind = "npm-package", executable = "bash-language-server", args = ["--version"], output_contains = "5.6.0" }
deps = ["node"]
provides = ["bash-language-server"]
failure_policy = "fail"

[[records]]
id = "jq"
package = "jq"
method = "apt-package"
version = "1.6-2.1ubuntu3.2"
platform = "linux/amd64"
source = "ubuntu:22.04"
verification = { kind = "apt-package" }
deps = []
